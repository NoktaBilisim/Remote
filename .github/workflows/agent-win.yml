      # P28e K8 (mimari-p28e §12 "Go birim", §13 K8; runbook §28e.8): istemci + servis 0.16.0 kayıt testleri günlükte görünür koşar
      # (kapsam yukarıdaki `go test ./...` ile aynı; bu adım ad sözleşmesini sabitler). Hepsi platformdan bağımsız (sahte UI/boru/soket);
