                   TestP28cControllerDisconnectAndReturnStatus TestP28cP28eTrayWithActiveForwardsRecUI TestP28cNamesSuffix \
                   TestP28cHeadlessShowRoster TestP28cLiveSetNamesDrawsSuffix TestP28cSessionWindowFits768 \
                   TestP28cIceRestartRoutedByFrom TestP28cIceRestartKeepsPeersAndSendsNothing \
                   TestP28cSetNamesSameSuffixRechecksDrawn; do
            grep -q -- "--- PASS: $t" "$out" || { echo "::error::$t PASS değil / koşmadı (ad değişti mi? sözleşme: docs/implementation.md P28c)"; exit 1; }
          done
      # P28d K4 (mimari-p28d §9, §11 K4; runbook §28d.7): istemci 0.18.0 ses testleri günlükte görünür koşar (kapsam yukarıdaki
      # `go test ./...` ile aynı; bu adım ad sözleşmesini sabitler). Ad kuralı: P28d testlerinin adında `P28d`, `Voice` ya da `Opus`
      # geçer; -run tüm internal paketlerini süzer. Liste K0s internal/voice (wazero + libopus.wasm) + K3 (flow, voice motoru,
      # rtc ses, ui/tray, yardımcı sınırı) testleridir (ad süzgecine uyan tüm Test işlevleri); Windows amd64'te
      # derleyici yolu koşar, SKIP kabul edilmez (yalnız -short ve amd64 dışı SKIP'tir). Listedeki bir testin koşmaması (ad
      # değişti) kırmızıdır — ad değiştiren listeyi de günceller (sözleşme: docs/implementation.md "P28d").
      - name: P28d ses testleri (-v; wazero + libopus.wasm)
        shell: bash
        run: |
          out="$RUNNER_TEMP/p28d.txt"
          GITHUB_STEP_SUMMARY='' go test -count=1 -v -run 'P28d|Voice|Opus' ./internal/... | tee "$out"
          bad=0
          for t in TestP28dK0sRoundTripSNR TestP28dK0sPacketLossConcealment TestP28dK0sDecodesStereoAndOtherFrameSizes \
                   TestP28dK0sWasmDigestMatches TestP28dK0sWasmSandboxSurface TestP28dK0sTrapIsolatedPerInstance \
                   TestP28dK0sGarbagePacketsNoPanic TestP28dK0sOversizePacketRejected TestP28dK0sRateLimit \
                   TestP28dK0sPanicIsolatedAndPeerDroppedOnThird TestP28dK0sFrameSizeAndClose TestP28dK0sCompilerMatchesInterpreter \
                   TestAC374P28dAskClosedWhenRequesterLeavesRoster TestAC374P28dDeviceErrorSendsDeviceEnd \
                   TestAC374P28dDeviceLostMidCallSendsDeviceEnd TestAC374P28dGuestInboundMatchesFixture \
                   TestAC374P28dHelloReleasesOpenCall TestAC374P28dLocalEndBeforeActiveThenLateActiveEndsOnce \
                   TestAC374P28dMuteIsLocal TestAC374P28dNewRequestOtherCallReleases TestAC374P28dNoMicWithoutLocalAccept \
                   TestAC374P28dReleaseMicOnHello TestAC374P28dReleaseMicOnIdle TestAC374P28dReleaseMicOnLocalEnd \
                   TestAC374P28dReleaseMicOnSessionEnd TestAC374P28dReleaseMicOnWsDrop \
                   TestAC374P28dReleaseMicOnWsDropSilencesFirst TestAC374P28dStaleOpenClosedImmediately \
                   TestAC374P28dStateActiveWithoutConsentSendsCustomerEndOnce TestAC374P28dStateOnlyCloses \
                   TestAC375P28dAnswerOpusDirection TestAC375P28dICERestartNoDuplicateTrack TestAC375P28dOpusBothWays \
                   TestAC377P28dConstantsMatchFixture TestAC378P28dGuestOutboundMatchesFixture TestAC378P28dMixMinusExcludesSelf \
                   TestAC378P28dMutedSendsOthersOnly TestAC378P28dNewListenerAnnounced \
                   TestAC378P28dNonTalkerPacketDroppedNoDecoder TestAC378P28dOnlyListenersReceive TestAC378P28dPeerBinding \
                   TestAC378P28dPeerDroppedAfterRepeatedTraps TestAC378P28dRealCodecCallRoundTrip \
                   TestAC379P28dUnattendedNoFeatureNoOpen TestP28dAudioPushRacesRelease TestP28dBoundaryHelperHasNoVoice \
                   TestP28dComPartialOpenReleasesAcquired TestP28dComReleaseReverseOrderBalanced TestP28dConcurrentPushAndRoles \
                   TestP28dDeviceFailureCallsOnFailOnceWithoutDeadlock TestP28dFECAndDecodeCountAsOnePacket \
                   TestP28dFlowContractPeersRolesSinkErrors TestP28dHRErrorClasses TestP28dJitterArrivalRateLimit \
                   TestP28dJitterFECThenConceal TestP28dJitterFIFOVariableFrames TestP28dJitterLateAndDuplicateDropped \
                   TestP28dJitterLossUsesFECThenPLCInCall TestP28dJitterOverflowDropsOldest TestP28dJitterResyncOnSequenceJump \
                   TestP28dJitterSequenceWrap TestP28dJitterSilenceAfterFivePLCAndReanchor TestP28dJitterStartsAt60msInOrder \
                   TestP28dLoopPanicReleasesDevice TestP28dMixSaturates TestP28dNilAudioHandlerStillReads \
                   TestP28dNoticesContainLibopusCopying TestP28dReleaseWithinOneSecond TestP28dRunEventsInMultiMode \
                   TestP28dSendonlyOfferNoGuestAudio TestP28dSessionWindowWithVoiceRowFits768 TestP28dSilentOfferNoAudioLine \
                   TestP28dSupportedMatchesWazeroCompilerCriterion TestP28dTrayLicensesOutsideScopeNoNetwork \
                   TestP28dVoiceRenderOnDefaultDevice TestP28dVoiceStatsCountPerPeerAndPlayback \
                   TestP28dVoiceSummaryOnlyCountersAndFormats TestP28dVoiceTechToCustomerPlaysEndToEnd \
                   TestP28dTrayVoiceEndAndLicensesInScope TestP28dTrayVoiceTipAndMenu TestP28dVoiceAskBody TestP28dVoiceRowTexts \
                   TestP28dDoneTimeoutEventsInMultiMode TestAC374P28dReleaseMicWhenActiveNeverArrives \
                   TestAC374P28dActiveInTimeKeepsMic TestAC374P28dActiveWaitDuringOpenClosesStaleOpen \
                   TestP28dOpusContextCancelStopsCall TestP28dOpusCallLimitTreatedAsTrap TestP28dOpusCallLimitValues; do
            if grep -q -- "--- PASS: $t (" "$out"; then continue; fi
            if grep -q -- "--- SKIP: $t (" "$out"; then
              echo "::error::$t SKIP: windows/amd64'te koşmalı (derleyici yolu), SKIP kabul edilmez"
            else
              echo "::error::$t PASS değil / koşmadı (ad değişti mi? sözleşme: docs/implementation.md P28d)"
            fi
            bad=1
          done
          exit "$bad"
      # P28u K6s spike (mimari-p28u §7.5 soru 1, R-P28u-1; docs/spike-p28u-k6s.md): üretim yardımcısıyla aynı proclimit.Spec'le
      # başlatılan kısıtlı jetonlu çocuk LockWorkStation çağırır. Koşucu oturumunu KİLİTLER (giriş masaüstü Winlogon olur;
      # pano/WGC/yazdırma testleri bozulur), bu yüzden ayrı ve işin GERÇEK son adımıdır. Ölçümdür: sonuç step summary'de
      # ("P28u K6s soru 1"), işletim sistemi davranışı adımı kırmızı yapmaz.
      - name: P28u K6s spike — kısıtlı jetonla LockWorkStation (koşucuyu kilitler; SON adım)
        shell: bash
        run: |
          # Kilitten önce (-v görünür; tablolar ana `go test` adımında step summary'ye yazıldı, burada çiftlenmez):
          # r3: TestK6sOverlay (soru 4, onay diyaloğu örtülmesi) win/k6s_overlay_windows_test.go ile silindi (mimari-p28u §r3.7 R4).
          GITHUB_STEP_SUMMARY='' go test -count=1 -v -run 'TestK6sSessionIDs' ./internal/servis/
          K6S_KILIT=1 go test -count=1 -v -run 'TestK6sLockRestrictedToken' ./internal/servis/

  # P28d K4 (mimari-p28d §11 K4, §14 O-PD-4; docs/implementation.md P28d K3 "K0s"; runbook §28d.11): gömülü kodlayıcı
  # internal/voice/libopus.wasm repo'da ikili olarak durur (go:embed). Bu iş onu kaynaktan yeniden üretir ve repo'dakiyle bayt
  # bayt karşılaştırır: incelenmemiş bir ikili gömülemez. Betik Docker ister (Go konteyneri değil, host runner). Tarball
  # SHA-256'sı burada ayrıca sabitlenir (Xiph SHA256SUMS.txt değeri, 2026-11-17 elle eşlendi): betikteki değer sessizce
  # değişirse iş kırmızı olur. libopus sürüm yükseltmesi = betik + bu değer + wasm/.sha256 aynı PR'da (runbook §28d.11).
  libopus-wasm:
    name: libopus.wasm yeniden üret + karşılaştır
    if: inputs.resign_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent-win
    env:
      OPUS_SHA256_PINNED: 6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1 # opus-1.6.1.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: tarball SHA-256 sabitlemesi (betik = iş akışı)
        run: |
          got="$(sed -n 's/^OPUS_SHA256=\([0-9a-f]\{64\}\).*/\1/p' build/libopus-wasm.sh)"
          echo "betik OPUS_SHA256=$got"
          [ "$got" = "$OPUS_SHA256_PINNED" ] || { echo "::error::build/libopus-wasm.sh OPUS_SHA256 ($got) iş akışındaki sabitle aynı değil"; exit 1; }
          grep -q '^WASI_SDK_IMAGE="ghcr.io/webassembly/wasi-sdk@sha256:[0-9a-f]\{64\}"' build/libopus-wasm.sh \
            || { echo "::error::wasi-sdk imajı digest ile sabit değil"; exit 1; }
      - name: gömülü wasm .sha256 ile tutarlı
        working-directory: apps/agent-win/internal/voice
        run: sha256sum -c libopus.wasm.sha256
      # Betik tarball'ı indirir, SHA-256'yı host'ta ve konteynerde denetler, wasi-sdk imajını digest'le ve ağsız koşturur.
      # Çıktı dizini her zaman verilir (varsayılan internal/voice'un üzerine yazar).
      - name: yeniden üret (wasi-sdk, ağsız konteyner)
        run: sh build/libopus-wasm.sh "$RUNNER_TEMP/wasm"
      - name: repo'daki ikiliyle bayt bayt karşılaştır
        run: |
          for f in libopus.wasm libopus.wasm.sha256 libopus-COPYING.txt; do
            cmp "$RUNNER_TEMP/wasm/$f" "internal/voice/$f" || { echo "::error::$f yeniden üretilenle aynı değil (runbook §28d.11)"; exit 1; }
          done
          { echo '### libopus.wasm (yeniden üretildi = repo)'; echo '```'; cat internal/voice/libopus.wasm.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # P28f K8a (mimari-p28f §8.2, ADR-0037 m.1/m.5): macOS ince ikilileri Linux GO_IMAGE'da (CGO_ENABLED=0, purego). Sunucu adresi
  # tablosu (build-darwin.sh S-P28f-7 korumasıyla aynı): v* etiket push'u → vars.AGENT_SERVER_URL, testBuild YOK (prod; yalnız
  # sign-mac'te paketlenir) · main'de elle tetikleme + staging adresi → STG_SERVER_URL + `test` · geri kalan her şey (PR, main push,
  # yer tutucu dispatch) → PLACEHOLDER (.invalid) + `test`. main push'a prod adresi GÖMÜLMEZ (Windows'tan farklı: ad-hoc pakete
  # prod adresi girmez).
  build-mac:
    name: build-mac ${{ matrix.n }}/2
    if: inputs.resign_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        n: [1, 2]
    container:
      image: golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: sürüm + sunucu adresi + kip
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VAR_SERVER_URL: ${{ vars.AGENT_SERVER_URL }}
          GIT_REF: ${{ github.ref }}
          IN_SERVER_URL: ${{ inputs.server_url }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ] && [ "$EVENT" != push ]; then
            echo "::error::etiket derlemesi yalnız etiket push'unda"; exit 1
          fi
          server="$PLACEHOLDER_SERVER_URL"; version=0.0.0; mode="test"
          if [ "$REF_TYPE" = tag ]; then
            echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::etiket vX.Y.Z olmalı"; exit 1; }
            [ -n "$VAR_SERVER_URL" ] || { echo "::error::Release için repo değişkeni AGENT_SERVER_URL gerekli"; exit 1; }
            server="$VAR_SERVER_URL"; version="${REF_NAME#v}"; mode=prod
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$IN_SERVER_URL" ] && [ "$IN_SERVER_URL" != yer-tutucu ]; then
            [ "$IN_SERVER_URL" = "$STG_SERVER_URL" ] || { echo "::error::server_url yalnız $STG_SERVER_URL olabilir"; exit 1; }
            [ "$GIT_REF" = refs/heads/main ] || { echo "::error::staging paketi yalnız main dalından ($GIT_REF)"; exit 1; }
            printf '%s' "$IN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version x.y.z olmalı"; exit 1; }
            server="$STG_SERVER_URL"; version="$IN_VERSION"
          fi
          # P29 K6 (§9.6): prod (etiket) -> prod.pub, staging adresi -> staging.pub, diğerleri gömülmez (güncelleyici kapalı).
          upd=""; [ "$mode" = prod ] && upd=prod; [ "$server" = "$STG_SERVER_URL" ] && upd=staging
          { echo "version=$version"; echo "server=$server"; echo "mode=$mode"; echo "updenv=$upd"; } >> "$GITHUB_OUTPUT"
      - name: build/build-darwin.sh (arm64 + amd64)
        env:
          SERVER: ${{ steps.meta.outputs.server }}
          VERSION: ${{ steps.meta.outputs.version }}
          MODE: ${{ steps.meta.outputs.mode }}
          UPDATE_ENV: ${{ steps.meta.outputs.updenv }}
          VAR_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          kip="test"; [ "$MODE" = prod ] && kip=""
          # D-P28f-K3: beklenen Team ID yalnız prod (etiket) derlemesine ve yalnız vars.APPLE_TEAM_ID doluysa gömülür (boşsa r4 ad-hoc
          # prod dalı: sign-mac atlanır, gömülmez; 4. satır boş = reproducible-mac signing=adhoc, S-r4-3). build-darwin.sh biçimi ve ikilide bulunmasını denetler; sign-mac build-meta 4. satırı = TEAM.
          team=""; [ "$MODE" = prod ] && team="$VAR_TEAM"
          for a in arm64 amd64; do
            # kip boşsa (prod) build-darwin.sh yalnız GITHUB_REF_TYPE=tag + GITHUB_REF_NAME=v<sürüm> ile derler (S-P28f-7).
            EXPECTED_TEAM_ID="$team" apps/agent-win/build/build-darwin.sh "$SERVER" "$VERSION" "$a" "$RUNNER_TEMP/out/noktadestek-$a" $kip
          done
          printf '%s\n%s\n%s\n%s\n' "$SERVER" "$VERSION" "$MODE" "$team" > "$RUNNER_TEMP/out/build-meta.txt"
          sha256sum "$RUNNER_TEMP/out/noktadestek-arm64" "$RUNNER_TEMP/out/noktadestek-amd64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-mac-build-${{ matrix.n }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  reproducible-mac:
    name: tekrarlanabilirlik (darwin arm64 + amd64)
    needs: build-mac
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha_arm64: ${{ steps.cmp.outputs.sha_arm64 }}
      sha_amd64: ${{ steps.cmp.outputs.sha_amd64 }}
      version: ${{ steps.cmp.outputs.version }}
      mode: ${{ steps.cmp.outputs.mode }}
      zip: ${{ steps.cmp.outputs.zip }}
      artifact: ${{ steps.cmp.outputs.artifact }}
      # S-r4-3: etiket dalının TEK kaynağı (adhoc|notarized); etiket dışı her zaman adhoc (TEST).
      signing: ${{ steps.cmp.outputs.signing }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: agent-mac-build-*, path: builds }
      - name: iki derleme aynı SHA-256 + Mach-O 64 + boyut; paket adı; imza dalı
        id: cmp
        env:
          REF_TYPE: ${{ github.ref_type }}
          VAR_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cmp builds/agent-mac-build-1/build-meta.txt builds/agent-mac-build-2/build-meta.txt || { echo "::error::build-meta farklı"; exit 1; }
          for a in arm64 amd64; do
            f1="builds/agent-mac-build-1/noktadestek-$a"; f2="builds/agent-mac-build-2/noktadestek-$a"
            x=$(sha256sum "$f1" | cut -d' ' -f1); y=$(sha256sum "$f2" | cut -d' ' -f1)
            echo "$a build1=$x build2=$y"
            [ "$x" = "$y" ] || { echo "::error::darwin/$a tekrarlanabilir build başarısız: SHA-256 farklı"; exit 1; }
            [ "$(od -An -tx1 -N4 "$f1" | tr -d ' \n')" = cffaedfe ] || { echo "::error::$a Mach-O 64 değil"; exit 1; }
            size=$(stat -c %s "$f1"); echo "$a boyut=$size"
            [ "$size" -le 31457280 ] || { echo "::error::$a ince ikili 30 MiB'ı aşıyor (zip ≤ 60 MiB, AC-389)"; exit 1; }
            echo "sha_$a=$x" >> "$GITHUB_OUTPUT"
          done
          meta=builds/agent-mac-build-1/build-meta.txt
          server="$(sed -n 1p "$meta")"; ver="$(sed -n 2p "$meta")"; mode="$(sed -n 3p "$meta")"; team="$(sed -n 4p "$meta")"
          signing=adhoc
          if [ "$REF_TYPE" = tag ]; then
            [ "$mode" = prod ] || { echo "::error::etiket derlemesi prod kipinde olmalı"; exit 1; }
            zip="NoktaDestek-macOS-$ver.zip"; artifact=none
            # S-r4-3: dal = gömülü Team ID (build-mac'in o anki vars'ı); şimdiki vars ile uyuşmazlık = hata (onay öncesi görünür).
            [ -z "$team" ] || signing=notarized
            [ "$team" = "$VAR_TEAM" ] || { echo "::error::gömülü Team ID ('$team') vars.APPLE_TEAM_ID ('$VAR_TEAM') değil — değişken derleme sırasında değişti; yeni etiket"; exit 1; }
          else
            [ "$mode" = test ] || { echo "::error::etiket dışı derleme test kipinde olmalı (S-P28f-7)"; exit 1; }
            zip="NoktaDestek-macOS-stg-$ver.zip"
            if [ "$server" = "$STG_SERVER_URL" ]; then artifact=agent-mac-stg; else artifact=agent-mac; fi
          fi
          printf '%s' "$zip" | grep -Eq '^NoktaDestek-macOS-(stg-)?[0-9]+\.[0-9]+\.[0-9]+\.zip$' || { echo "::error::zip adı $zip"; exit 1; }
          { echo "version=$ver"; echo "mode=$mode"; echo "zip=$zip"; echo "artifact=$artifact"; echo "signing=$signing"; } >> "$GITHUB_OUTPUT"
          mkdir thin && cp builds/agent-mac-build-1/* thin/
          (cd thin && sha256sum noktadestek-arm64 noktadestek-amd64 > SHA256SUMS && cat SHA256SUMS)
          { echo "### darwin ince ikililer ($mode, $server, imza dalı: $signing)"; echo '```'; cat thin/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-mac-thin
          path: thin/
          if-no-files-found: error
          retention-days: 7

  # P28f K8a (§8.2 package-mac; S-P28f-4/5/14/17): universal + .app + AD-HOC + hardened runtime + entitlements.plist (boş; prod ile
  # aynı dosya) + Info.plist izin listesi + entitlement tam eşleşme + zip ≤ 60 MiB. Girdi SHA'ları reproducible-mac ÇIKTILARIYLA
  # karşılaştırılır (aynı artifact'teki SHA256SUMS ile değil). r4 (K-P28f-r4-4/11, S-r4-3/4): etiket + signing=notarized → yalnız
  # denetler, YÜKLEMEZ (Developer ID zip'i sign-mac üretir). Etiket + signing=adhoc → prod ad-hoc zip (OKUBENI-adhoc) `agent-mac-adhoc`
  # artifact'i (retention 7: onay 1 günü aşabilir); attestation YOK — yalnız approve sonrası attest-mac. Çıktılar zip_sha / exe_sha
  # (iş çıktısı; attest-mac predicate'i bunlardan kurar). Onaylayan özette imza dalını + SHA'ları görür.
  package-mac:
    name: package-mac (universal .app, ad-hoc + hardened runtime)
    needs: reproducible-mac
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      zip_sha: ${{ steps.pkg.outputs.zip_sha }}
      exe_sha: ${{ steps.pkg.outputs.exe_sha }}
    defaults:
      run:
        working-directory: apps/agent-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-mac-thin, path: "${{ runner.temp }}/thin" }
      - name: ince ikili SHA = reproducible-mac çıktısı
        env:
          WANT_ARM64: ${{ needs.reproducible-mac.outputs.sha_arm64 }}
          WANT_AMD64: ${{ needs.reproducible-mac.outputs.sha_amd64 }}
        run: |
          [ "$(shasum -a 256 "$RUNNER_TEMP/thin/noktadestek-arm64" | cut -d' ' -f1)" = "$WANT_ARM64" ] || { echo "::error::arm64 SHA uyuşmuyor"; exit 1; }
          [ "$(shasum -a 256 "$RUNNER_TEMP/thin/noktadestek-amd64" | cut -d' ' -f1)" = "$WANT_AMD64" ] || { echo "::error::amd64 SHA uyuşmuyor"; exit 1; }
      - name: package.sh adhoc (+ check) + OKUBENI içeriği (AC-505) + zip/ikili SHA
        id: pkg
        env:
          VERSION: ${{ needs.reproducible-mac.outputs.version }}
          MODE: ${{ needs.reproducible-mac.outputs.mode }}
          ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          SIGNING: ${{ needs.reproducible-mac.outputs.signing }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          prof=stg; [ "$MODE" = prod ] && prof=prod
          build/macos/package.sh adhoc "$RUNNER_TEMP/thin/noktadestek-arm64" "$RUNNER_TEMP/thin/noktadestek-amd64" "$VERSION" "$prof" \
            "$RUNNER_TEMP/pkg" "$ZIP"
          app="$RUNNER_TEMP/pkg/stage/Nokta Destek.app"
          spctl -a -vv -t exec "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt" || true
          echo "(ad-hoc paket Gatekeeper'da reddedilir — beklenen; Developer ID dalında sign-mac 'Notarized Developer ID' şartını uygular)"
          # AC-505 / K-P28f-r4-11: package.sh adhoc → stg: OKUBENI-stg.txt, prod: OKUBENI-adhoc.txt (Developer ID metni OKUBENI.txt değil).
          want=build/macos/OKUBENI-adhoc.txt; [ "$prof" = stg ] && want=build/macos/OKUBENI-stg.txt
          unzip -p "$RUNNER_TEMP/pkg/$ZIP" OKUBENI.txt | cmp - "$want" || { echo "::error::zip içi OKUBENI.txt $want değil"; exit 1; }
          zsha=$(shasum -a 256 "$RUNNER_TEMP/pkg/$ZIP" | cut -d' ' -f1)
          esha=$(shasum -a 256 "$app/Contents/MacOS/noktadestek" | cut -d' ' -f1)
          [ "$(unzip -p "$RUNNER_TEMP/pkg/$ZIP" "Nokta Destek.app/Contents/MacOS/noktadestek" | shasum -a 256 | cut -d' ' -f1)" = "$esha" ] \
            || { echo "::error::zip içi ikili paketteki ikili değil"; exit 1; }
          { echo "zip_sha=$zsha"; echo "exe_sha=$esha"; } >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            { echo "### macOS etiket paketi — onaylayan için (S-r4-3)"
              echo "- imza dalı (reproducible-mac signing): **$SIGNING** ($([ "$SIGNING" = adhoc ] && echo "Developer ID'siz prod; Gatekeeper 'Yine de Aç'" || echo "Developer ID + notarize, sign-mac"))"
              echo "- ad-hoc zip $ZIP SHA-256: \`$zsha\`$([ "$SIGNING" = adhoc ] && echo " (Release'e girecek dosya)" || echo " (yüklenmez; Release'e sign-mac zip'i girer)")"
              echo "- paket içi ikili (Hakkında parmak izi ${esha:0:8}): \`$esha\`"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: prod ad-hoc dağıtım klasörü (etiket + signing=adhoc; K-P28f-r4-4)
        if: github.ref_type == 'tag' && needs.reproducible-mac.outputs.signing == 'adhoc'
        env:
          ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          VERSION: ${{ needs.reproducible-mac.outputs.version }}
          VAR_TEAM: ${{ vars.APPLE_TEAM_ID }}
          ZSHA: ${{ steps.pkg.outputs.zip_sha }}
          ESHA: ${{ steps.pkg.outputs.exe_sha }}
        run: |
          # S-r4-3: tek kaynak signing; vars yalnız tutarlılık (uyuşmazlık = hata, sessiz atlama değil).
          [ -z "$VAR_TEAM" ] || { echo "::error::signing=adhoc ama vars.APPLE_TEAM_ID tanımlı — değişken derleme sırasında değişti; yeni etiket"; exit 1; }
          printf '%s' "$ZIP" | grep -Eq '^NoktaDestek-macOS-[0-9]+\.[0-9]+\.[0-9]+\.zip$' || { echo "::error::prod zip adı $ZIP"; exit 1; }
          app="$RUNNER_TEMP/pkg/stage/Nokta Destek.app"
          codesign -dv "$app" 2>&1 | grep -qx 'Signature=adhoc' || { echo "::error::prod paket ad-hoc imzalı değil"; exit 1; }
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = net.noktabilisim.destek ] || { echo "::error::bundle kimliği prod değil"; exit 1; }
          d="$RUNNER_TEMP/dist"; mkdir "$d"
          cp "$RUNNER_TEMP/pkg/$ZIP" "$RUNNER_TEMP/thin/build-meta.txt" "$d/"
          (cd "$d" && shasum -a 256 "$ZIP" > SHA256SUMS)
          [ "$(cut -d' ' -f1 "$d/SHA256SUMS")" = "$ZSHA" ] || { echo "::error::zip SHA zip_sha çıktısı değil"; exit 1; }
          # S-P28f-17: paket içi ikili + dilim başına imzasız SHA (Hakkında parmak izi = Contents/MacOS/noktadestek).
          { (cd "$RUNNER_TEMP/pkg/stage" && shasum -a 256 "Nokta Destek.app/Contents/MacOS/noktadestek")
            (cd "$RUNNER_TEMP/thin" && shasum -a 256 noktadestek-arm64 noktadestek-amd64); } > "$d/icerik-sha256.txt"
          # Bilgi amaçlı beyan; attest-mac predicate'i İŞ ÇIKTILARINDAN kendisi kurar ve bununla birebir karşılaştırır (S-r4-4).
          jq -n --arg ver "$VERSION" --arg zip "$ZIP" --arg exe "$ESHA" \
            '{bundleId:"net.noktabilisim.destek", version:$ver, file:$zip, signature:"adhoc", notarized:false, executableSha256:$exe}' > "$d/adhoc.json"
          { echo "### $ZIP (prod ad-hoc; agent-mac-adhoc — attestation YALNIZ onaydan sonra)"; echo '```'; cat "$d/SHA256SUMS" "$d/icerik-sha256.txt" "$d/adhoc.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: github.ref_type == 'tag' && needs.reproducible-mac.outputs.signing == 'adhoc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-mac-adhoc
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7
      - name: dağıtım klasörü (etiket değilse)
        if: github.ref_type != 'tag'
        env:
          ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          ART: ${{ needs.reproducible-mac.outputs.artifact }}
        run: |
          mkdir "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/pkg/$ZIP" "$RUNNER_TEMP/thin/build-meta.txt" "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 "$ZIP" > SHA256SUMS
          # S-P28f-17: paket içi ikili + dilim başına imzasız SHA (Hakkında parmak izi = Contents/MacOS/noktadestek).
          { (cd "$RUNNER_TEMP/pkg/stage" && shasum -a 256 "Nokta Destek.app/Contents/MacOS/noktadestek")
            (cd "$RUNNER_TEMP/thin" && shasum -a 256 noktadestek-arm64 noktadestek-amd64); } > icerik-sha256.txt
          { echo "### $ZIP ($ART; ad-hoc TEST, Release'e gitmez)"; echo '```'; cat SHA256SUMS icerik-sha256.txt build-meta.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.reproducible-mac.outputs.artifact }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30

  # P28f K8a (§8.2 test-macos, §9; S-P28f-11/14): darwin go test (MallocScribble/NSZombieEnabled), x86_64 dilimi Rosetta ile (varsa),
  # AC-394 iz testi `.invalid` sunuculu, testBuild'siz AYRI derlemeyle argümansız. İz betiği TRACE_MAC (K5:
  # test/trace-check-mac.sh snapshot/compare; salt okunur).
  test-macos:
    name: go test (macOS) + iz testi
    if: inputs.resign_tag == ''
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/agent-win
    env:
      TRACE_MAC: test/trace-check-mac.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      # P28f düzeltme 1 (QA m.6, mimari-p28f §8.2 "görünür SKIP"): tek koşu -v; her `--- SKIP` satırı ::warning:: + step summary
      # (annotation adım başına sınırlı, tam liste summary'de). ZORUNLU: bu runner'da izin (Ekran Kaydı / Erişilebilirlik) ya da
      # etkin ekran gerektirmeyen, koşullu t.Skip yolu OLMAYAN testler — PASS değilse (SKIP ya da hiç koşmadı = ad değişti) kırmızı.
      # İzin/ekran bağımlı (SCK, AX enjeksiyon/musluk, CGBind, EnvProbe, Monitors, getconf, spctl, ölçüm) SKIP'leri yalnız uyarıdır.
      # Bir zorunlu testin adını değiştiren/kaldıran bu listeyi de günceller.
      - name: go test (darwin/arm64; MallocScribble + NSZombieEnabled; -v, SKIP görünür, zorunlu PASS)
        env:
          MallocScribble: "1"
          NSZombieEnabled: "YES"
          CGO_ENABLED: "0"
        run: |
          set +e -o pipefail
          out="$RUNNER_TEMP/go-test-darwin.txt"
          go test -count=1 -v ./... 2>&1 | tee "$out"
          rc=$?
          set -e
          skips="$(grep -E -- '^[[:space:]]*--- SKIP: ' "$out" || true)"
          if [ -n "$skips" ]; then
            printf '%s\n' "$skips" | sed -E 's/^[[:space:]]*--- SKIP: /::warning::go test SKIP (darwin, izin\/ekran yok olabilir): /'
            { echo "### go test (darwin) SKIP listesi"; echo '```'; printf '%s\n' "$skips"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          zorunlu="TestP28fOpenAllowList TestP28fClassAndSelectorFailClosed TestP28fNSStringRoundTripAndLimits
            TestP28fAsyncRunsOnQueueAndConsumesHandle
            TestP28fK2AC392VTEncodeKeyframesNoLoss TestP28fK2VTRejectsWrongSize TestP28fK2VTSessionTableCleared TestP28fK2SessionLockedRule
            TestAC393P28fClipRoundTripPlainText TestAC393P28fClipReadLimits TestSP28f12ClipSensitiveMarksNotRead
            TestAC393P28fClipWriteMarksTransient TestAC393P28fClipWriteValidation TestAC393P28fClipClosed
            TestAC117P28fQuarantineValue TestAC117P28fQuarantineWrittenToFile TestAC117P28fQuarantineMissingFileFails
            TestAC394P28fRemoveTraces TestAC392P28fDownloadsDir
            TestAC117P28fTransferPlacesQuarantinedFile TestAC117P28fStreamQuarantineFailureCorrupt
            TestAC393P28fLPFixedArgsStdinEnv TestAC393P28fLPInputValidation TestAC393P28fLPErrors TestAC393P28fLPCancel
            TestAC393P28fDarwinPrinterInspectAndPrint
            TestSP28f10ControlReadyMatchesPermission TestSP28f1LocalClickWhitelist TestAC48MacKeyTable
            TestAC48ModifierMappingCtrlToCommand TestAC48TurkishTextUnicode TestAC48AltGrTextOnMac
            TestAC49MacCoordinatesDragAndDoubleClick TestAC101MacClosedGateNoEvents TestP28fAccessibilityShortcutsNeverInjected
            TestP28fRestartRoundTrip TestP28fRestartRejects TestP28fRestartPurge
            TestP28fClassifyClick TestP28fIndicatorHealth TestP28fFooterAndInputLimit TestP28fTestBand
            TestYP28fK1MouseKeysDropsKeypad TestYP28fK1OwnWindowDropsClickAndKeypad TestYP28fK1NoProbeAndMouseKeysState
            TestYP28fK1rOwnWindowDropsMouseKeysLettersWhenOff TestYP28fK1rLastMoveTargetOverOwnWindow TestYP28fK1FlipRect
            TestYP28fK1MacProbeReads TestAC104DP28fK1ArmBeforeGateOpen TestP28fExpectedTeamID
            TestAC105P28fSecureInputMapsToElevated"
          fail=0
          for t in $zorunlu; do
            if grep -Eq -- "^--- PASS: $t \(" "$out"; then continue; fi
            if grep -Eq -- "^--- SKIP: $t \(" "$out"; then
              echo "::error::$t SKIP: izin gerektirmeyen zorunlu darwin testi bu runner'da koşmalı, SKIP kabul edilmez"
            else
              echo "::error::$t PASS değil ya da hiç koşmadı (kaldı / ad değişti → listeyi güncelle)"
            fi
            fail=1
          done
          [ "$rc" = 0 ] || { echo "::error::go test (darwin) çıkış kodu $rc"; exit "$rc"; }
          exit "$fail"
      - name: go test internal/darwin (x86_64, Rosetta)
        env:
          CGO_ENABLED: "0"
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            GOARCH=amd64 go test -count=1 ./internal/darwin/...
          else
            echo "::warning::Rosetta yok: x86_64 bağlama testleri bu koşuda KOŞMADI (elle: arch -x86_64, runbook §28f)"
          fi
      - name: iz testi paketi (.invalid, testBuild yok, prod profili ad-hoc)
        run: |
          for a in arm64 amd64; do build/build-darwin.sh "$PLACEHOLDER_SERVER_URL" 0.0.0 "$a" "$RUNNER_TEMP/trace-thin/noktadestek-$a"; done
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          build/macos/package.sh adhoc "$RUNNER_TEMP/trace-thin/noktadestek-arm64" "$RUNNER_TEMP/trace-thin/noktadestek-amd64" 0.0.0 prod \
            "$RUNNER_TEMP/trace-pkg" Destek-12345678.zip
          # Arşiv İzlencesi davranışı: zip adıyla klasör (kod klasör adından okunur, AC-97).
          ditto -x -k "$RUNNER_TEMP/trace-pkg/Destek-12345678.zip" "$RUNNER_TEMP/trace/Destek-12345678"
      - name: trace-check-mac (AC-394; snapshot → argümansız aç → kapat → compare)
        run: |
          [ -f "$TRACE_MAC" ] || { echo "::error::$TRACE_MAC yok (sözleşme: docs/implementation.md P28f K5)"; exit 1; }
          app="$RUNNER_TEMP/trace/Destek-12345678/Nokta Destek.app"; snap="$RUNNER_TEMP/trace/once.txt"
          bash "$TRACE_MAC" snapshot "$snap"
          since="$(date '+%Y-%m-%d %H:%M:%S')"
          "$app/Contents/MacOS/noktadestek" & pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "istemci açık; SIGTERM"; kill -TERM "$pid" 2>/dev/null || true
            for _i in $(seq 1 15); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then echo "::warning::istemci SIGTERM ile kapanmadı; zorla"; kill -KILL "$pid" || true; fi
          fi
          wait "$pid" 2>/dev/null; echo "istemci çıkış kodu $?"
          sleep 2
          bash "$TRACE_MAC" compare "$snap" --since "$since" --bundle "$app" --marker 12345678

  # P28g K8a (mimari-p28g §8.2 build-linux; S-P28g-9): tek ELF GO_IMAGE'da (CGO_ENABLED=0, purego). Sunucu adresi tablosu build-mac
  # ile aynı: v* etiket push'u → vars.AGENT_SERVER_URL, prod (build-linux.sh yalnız GITHUB_REF_TYPE=tag + v<sürüm> ile derler) ·
  # main'de elle tetikleme + staging adresi → STG_SERVER_URL + `test` · geri kalan (PR, main push, yer tutucu) → PLACEHOLDER + `test`.
  # main push'a prod adresi GÖMÜLMEZ.
  build-linux:
    name: build-linux ${{ matrix.n }}/2
    if: inputs.resign_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        n: [1, 2]
    container:
      image: golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: sürüm + sunucu adresi + kip
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VAR_SERVER_URL: ${{ vars.AGENT_SERVER_URL }}
          GIT_REF: ${{ github.ref }}
          IN_SERVER_URL: ${{ inputs.server_url }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ] && [ "$EVENT" != push ]; then
            echo "::error::etiket derlemesi yalnız etiket push'unda"; exit 1
          fi
          server="$PLACEHOLDER_SERVER_URL"; version=0.0.0; mode="test"
          if [ "$REF_TYPE" = tag ]; then
            echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::etiket vX.Y.Z olmalı"; exit 1; }
            [ -n "$VAR_SERVER_URL" ] || { echo "::error::Release için repo değişkeni AGENT_SERVER_URL gerekli"; exit 1; }
            server="$VAR_SERVER_URL"; version="${REF_NAME#v}"; mode=prod
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$IN_SERVER_URL" ] && [ "$IN_SERVER_URL" != yer-tutucu ]; then
            [ "$IN_SERVER_URL" = "$STG_SERVER_URL" ] || { echo "::error::server_url yalnız $STG_SERVER_URL olabilir"; exit 1; }
            [ "$GIT_REF" = refs/heads/main ] || { echo "::error::staging ikilisi yalnız main dalından ($GIT_REF)"; exit 1; }
            printf '%s' "$IN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version x.y.z olmalı"; exit 1; }
            server="$STG_SERVER_URL"; version="$IN_VERSION"
          fi
          # P29 K6 (§9.6): prod (etiket) -> prod.pub, staging adresi -> staging.pub, diğerleri gömülmez (güncelleyici kapalı).
          upd=""; [ "$mode" = prod ] && upd=prod; [ "$server" = "$STG_SERVER_URL" ] && upd=staging
          { echo "version=$version"; echo "server=$server"; echo "mode=$mode"; echo "updenv=$upd"; } >> "$GITHUB_OUTPUT"
      - name: build/build-linux.sh + check-linux-elf.sh
        env:
          SERVER: ${{ steps.meta.outputs.server }}
          VERSION: ${{ steps.meta.outputs.version }}
          MODE: ${{ steps.meta.outputs.mode }}
          UPDATE_ENV: ${{ steps.meta.outputs.updenv }}
          # P28g K10 (mimari-p28g §5.2b m.7, runbook §28g.6): Wayland kontrol anahtarı. Repo değişkeni LINUX_WAYLAND_CONTROL
          # (on|off). Etiket (prod) derlemesinde tanımsızsa 'unset' → build-linux.sh durur (D-P28g-K3-2: prod'da açık karar şart);
          # etiket dışı (staging/test) derlemede tanımsız → on. E-7 (b)/(c) gerçek GNOME Wayland'de GEÇMEDİYSE off. build-meta 4.
          # satırı; reproducible-linux iki derlemenin build-meta'sını cmp ile karşılaştırdığından ikisi aynı değeri kullanmak zorundadır.
          WAYLAND_CONTROL: ${{ vars.LINUX_WAYLAND_CONTROL || (github.ref_type == 'tag' && 'unset' || 'on') }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          kip="test"; [ "$MODE" = prod ] && kip=""
          # kip boşsa (prod) build-linux.sh yalnız GITHUB_REF_TYPE=tag + GITHUB_REF_NAME=v<sürüm> ile derler (S-P28g-9).
          # WAYLAND_CONTROL on|off dışında build-linux.sh durur.
          # shellcheck disable=SC2086
          apps/agent-win/build/build-linux.sh "$SERVER" "$VERSION" "$RUNNER_TEMP/out/noktadestek-linux" $kip
          apps/agent-win/build/check-linux-elf.sh "$RUNNER_TEMP/out/noktadestek-linux" --server "$SERVER"
          printf '%s\n%s\n%s\n%s\n' "$SERVER" "$VERSION" "$MODE" "$WAYLAND_CONTROL" > "$RUNNER_TEMP/out/build-meta.txt"
          sha256sum "$RUNNER_TEMP/out/noktadestek-linux"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-linux-build-${{ matrix.n }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  # P28g K8a (§8.2 reproducible-linux; S-P28g-9): iki derleme aynı SHA + ELF denetimi (prod: adres = AGENT_SERVER_URL, staging ve
  # yer tutucu .invalid adresi yok — düz ".invalid" Go sembollerinde (http2…invalidate) geçtiğinden tam adres aranır, K8b) + adlandırma. Çıktılar K8b'nin attest-linux / release / publish-linux.sh işleri içindir (docs/implementation.md
  # "P28g K8a" iskelet). Release'e bağlama K8b'de; approve bu işi bekler.
  reproducible-linux:
    name: tekrarlanabilirlik (linux x86_64)
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.cmp.outputs.sha }}
      version: ${{ steps.cmp.outputs.version }}
      mode: ${{ steps.cmp.outputs.mode }}
      file: ${{ steps.cmp.outputs.file }}
      artifact: ${{ steps.cmp.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, sparse-checkout: apps/agent-win/build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: agent-linux-build-*, path: builds }
      - name: iki derleme aynı SHA-256 + ELF denetimi; dosya adı
        id: cmp
        env:
          REF_TYPE: ${{ github.ref_type }}
          VAR_SERVER_URL: ${{ vars.AGENT_SERVER_URL }}
        run: |
          cmp builds/agent-linux-build-1/build-meta.txt builds/agent-linux-build-2/build-meta.txt || { echo "::error::build-meta farklı"; exit 1; }
          f1=builds/agent-linux-build-1/noktadestek-linux; f2=builds/agent-linux-build-2/noktadestek-linux
          x=$(sha256sum "$f1" | cut -d' ' -f1); y=$(sha256sum "$f2" | cut -d' ' -f1)
          echo "build1=$x build2=$y"
          [ "$x" = "$y" ] || { echo "::error::linux tekrarlanabilir build başarısız: SHA-256 farklı"; exit 1; }
          meta=builds/agent-linux-build-1/build-meta.txt
          server="$(sed -n 1p "$meta")"; ver="$(sed -n 2p "$meta")"; mode="$(sed -n 3p "$meta")"; wl="$(sed -n 4p "$meta")"
          case "$wl" in on|off) ;; *) echo "::error::build-meta Wayland kontrol anahtarı '$wl' (on|off)"; exit 1 ;; esac
          if [ "$REF_TYPE" = tag ]; then
            [ "$mode" = prod ] && [ "$server" = "$VAR_SERVER_URL" ] || { echo "::error::etiket derlemesi prod kipinde ve AGENT_SERVER_URL adresli olmalı"; exit 1; }
            apps/agent-win/build/check-linux-elf.sh "$f1" --server "$server" --forbid "$STG_SERVER_URL" --forbid "$PLACEHOLDER_SERVER_URL"
            file="NoktaDestek-linux-x86_64-$ver"; artifact=agent-linux
          else
            [ "$mode" = test ] || { echo "::error::etiket dışı derleme test kipinde olmalı (S-P28g-9)"; exit 1; }
            apps/agent-win/build/check-linux-elf.sh "$f1" --server "$server"
            file="NoktaDestek-linux-x86_64-stg-$ver"
            if [ "$server" = "$STG_SERVER_URL" ]; then artifact=agent-linux-stg; else artifact=agent-linux-test; fi
          fi
          printf '%s' "$file" | grep -Eq '^NoktaDestek-linux-x86_64-(stg-)?[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::dosya adı $file"; exit 1; }
          mkdir dist && cp "$f1" "dist/$file" && cp "$meta" dist/
          (cd dist && sha256sum "$file" > SHA256SUMS && cat SHA256SUMS)
          { echo "### $file ($artifact; $mode, $server; Wayland kontrolü: $wl)"; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo "sha=$x"; echo "version=$ver"; echo "mode=$mode"; echo "file=$file"; echo "artifact=$artifact"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cmp.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # P28g K8a (§8.2 test-linux-gui, §9; D-P28g-T2-2, §14 m.2, T6): Ubuntu 22.04 / 24.04 imajı (taban digest sabit; Go GO_IMAGE'dan)
  # içinde Xvfb + başsız mutter/portal ile `go test -tags linuxgui`, GStreamer envanteri, XI2 ofsetleri, ELF yükleme + ortam pozitif
  # kontrolü, iz testi ve zorunlu liste (test/linux/gui-tests.txt). Mantık YAML'de değil test/linux/ betiklerinde (yerel prova aynı:
  # runbook §28g). Etikette P28G_STRICT=1: "bekleyen" testler ve eksik iz betiği kırmızı.
  test-linux-gui:
    name: test-linux-gui (Ubuntu ${{ matrix.rel }})
    if: inputs.resign_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        rel: ["2204", "2404"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: test/linux/gui.sh ${{ matrix.rel }}
        env:
          REL: ${{ matrix.rel }}
          P28G_STRICT: ${{ github.ref_type == 'tag' && '1' || '0' }}
        run: |
          set +e
          apps/agent-win/test/linux/gui.sh "$REL" "$RUNNER_TEMP/gui"
          rc=$?
          cat "$RUNNER_TEMP"/gui/ozet-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-linux-gui-${{ matrix.rel }}
          path: ${{ runner.temp }}/gui/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: build ${{ matrix.n }}/2
    if: inputs.resign_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        n: [1, 2]
    container:
      image: golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: sürüm + sunucu adresi
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VAR_SERVER_URL: ${{ vars.AGENT_SERVER_URL }}
          GIT_REF: ${{ github.ref }}
          IN_SERVER_URL: ${{ inputs.server_url }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ] && [ "$EVENT" != push ]; then
            echo "::error::etiket derlemesi yalnız etiket push'unda (elle tetiklemede Release exe'si üretilmez)"; exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::etiket vX.Y.Z olmalı"; exit 1; }
            version="${REF_NAME#v}"
            [ -n "$VAR_SERVER_URL" ] || { echo "::error::Release için repo değişkeni AGENT_SERVER_URL gerekli"; exit 1; }
          else
            version=0.0.0
          fi
          # S6-4: incelenmemiş kod (PR, elle tetikleme) gerçek adrese bağlanan exe üretmez.
          server="$PLACEHOLDER_SERVER_URL"
          if [ "$EVENT" = push ] && [ -n "$VAR_SERVER_URL" ]; then server="$VAR_SERVER_URL"; fi
          # P13c: elle tetikleme + staging adresi -> yalnız main dalı, yalnız STG_SERVER_URL, sürüm x.y.z.
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$IN_SERVER_URL" ] && [ "$IN_SERVER_URL" != yer-tutucu ]; then
            [ "$IN_SERVER_URL" = "$STG_SERVER_URL" ] || { echo "::error::server_url yalnız $STG_SERVER_URL olabilir"; exit 1; }
            [ "$GIT_REF" = refs/heads/main ] || { echo "::error::staging exe yalnız main dalından ($GIT_REF)"; exit 1; }
            printf '%s' "$IN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version x.y.z olmalı"; exit 1; }
            server="$STG_SERVER_URL"; version="$IN_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          # P29 K6 (§9.6): güncelleme açık anahtarı yalnız gerçek adresli derlemeye (prod adresi -> prod.pub, staging -> staging.pub);
          # PR / yer tutucu -> gömülmez (güncelleyici kapalı). .pub yoksa build-ldflags uyarır, kapalı derler.
          upd=""; [ "$server" = "$VAR_SERVER_URL" ] && [ -n "$VAR_SERVER_URL" ] && upd=prod; [ "$server" = "$STG_SERVER_URL" ] && upd=staging
          echo "updenv=$upd" >> "$GITHUB_OUTPUT"
      - name: build/build.sh
        env:
          SERVER: ${{ steps.meta.outputs.server }}
          VERSION: ${{ steps.meta.outputs.version }}
          UPDATE_ENV: ${{ steps.meta.outputs.updenv }}
        run: |
          # Konteyner root, çalışma alanı runner kullanıcısının: VCS damgası için git güvenli dizin (build.sh değişmez).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          apps/agent-win/build/build.sh "$SERVER" "$VERSION" "$RUNNER_TEMP/out/NoktaDestek.exe"
          # P27 K9: gözetimsiz erişim servis ikilisi (aynı sunucu adresi + sürüm).
          apps/agent-win/build/build.sh "$SERVER" "$VERSION" "$RUNNER_TEMP/out/NoktaDestekServis.exe" noktadestek-servis
          printf '%s\n%s\n' "$SERVER" "$VERSION" > "$RUNNER_TEMP/out/build-meta.txt"
          sha256sum "$RUNNER_TEMP/out/NoktaDestek.exe" "$RUNNER_TEMP/out/NoktaDestekServis.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-win-build-${{ matrix.n }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  reproducible:
    name: tekrarlanabilirlik + SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
      exe: ${{ steps.name.outputs.exe }}
      servis_exe: ${{ steps.name.outputs.servis_exe }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: agent-win-build-*, path: builds }
      - name: iki build aynı SHA-256 + boyut/packer kontrolü (NoktaDestek.exe + NoktaDestekServis.exe)
        run: |
          for e in NoktaDestek.exe NoktaDestekServis.exe; do
            a=$(sha256sum "builds/agent-win-build-1/$e" | cut -d' ' -f1)
            b=$(sha256sum "builds/agent-win-build-2/$e" | cut -d' ' -f1)
            echo "$e build1=$a"; echo "$e build2=$b"
            [ "$a" = "$b" ] || { echo "::error::$e tekrarlanabilir build başarısız: SHA-256 farklı"; exit 1; }
            f="builds/agent-win-build-1/$e"
            size=$(stat -c %s "$f"); echo "$e boyut=$size"
            [ "$size" -le 41943040 ] || { echo "::error::$e 40 MB'ı aşıyor (AC-96)"; exit 1; }
            [ "$(head -c2 "$f")" = MZ ] || { echo "::error::$e PE değil"; exit 1; }
            if grep -aq 'UPX!' "$f"; then echo "::error::$e UPX/packer izi (ADR-0010)"; exit 1; fi
            # P27 K9: servis ikilisi yükseltme istemez (kurulum UAC runas ile; manifest asInvoker).
            grep -aq 'requestedExecutionLevel level="asInvoker"' "$f" || { echo "::error::$e manifest asInvoker değil"; exit 1; }
          done
      - name: artifact adı (P13c — staging adresli derleme ayrı ad, Release'e gitmez)
        id: name
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          meta=builds/agent-win-build-1/build-meta.txt
          ver="$(sed -n 2p "$meta")"
          if [ "$(sed -n 1p "$meta")" = "$STG_SERVER_URL" ]; then
            exe="NoktaDestek-stg-$ver.exe"; sexe="NoktaDestekServis-stg-$ver.exe"; artifact=agent-win-stg
          elif [ "$REF_TYPE" = tag ]; then
            # P27 K9 (mimari-p27 §9 K9): Release'te servis ikilisi sürümlü ad taşır; NoktaDestek.exe adı değişmez (Caddy yolu).
            exe=NoktaDestek.exe; sexe="NoktaDestekServis-$ver.exe"; artifact=agent-win
          else
            exe=NoktaDestek.exe; sexe=NoktaDestekServis.exe; artifact=agent-win
          fi
          printf '%s' "$exe" | grep -Eq '^NoktaDestek(-stg-[0-9]+\.[0-9]+\.[0-9]+)?\.exe$' || { echo "::error::exe adı $exe"; exit 1; }
          printf '%s' "$sexe" | grep -Eq '^NoktaDestekServis(-stg)?(-[0-9]+\.[0-9]+\.[0-9]+)?\.exe$' || { echo "::error::servis exe adı $sexe"; exit 1; }
          mkdir dist && cp builds/agent-win-build-1/NoktaDestek.exe "dist/$exe" && cp "$meta" dist/
          cp builds/agent-win-build-1/NoktaDestekServis.exe "dist/$sexe"
          (cd dist && sha256sum "$exe" "$sexe" > SHA256SUMS && cat SHA256SUMS)
          { echo "### $exe + $sexe ($artifact)"; echo '```'; cat dist/SHA256SUMS; cat dist/build-meta.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo "exe=$exe"; echo "servis_exe=$sexe"; echo "artifact=$artifact"; } >> "$GITHUB_OUTPUT"
      - name: onaylayan için kontrol listesi (yalnız etiket; S17-2, S-P17-3)
        # Onay beklenirken koşu sayfasında görünsün diye onay işinden ÖNCE yazılır. Kutular bilerek boş: kontrol kanıtı
        # değildir; onaylayan maddeleri kontrol edip sonucu onay yorumuna yazar (runbook §24.4).
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          {
            echo "### Yayın ön koşulu (S17-2) — onay vermeden önce kontrol edin (runbook §24.1)"
            echo "- [ ] İstemcinin gerektirdiği sunucu paketi prod'da (0.11.0 → P15; 0.13.0 → P28a; 0.14.0 → P28b; 0.15.0 → P28u + migration 20261124000000_p28u_unattended_consent; 0.16.0 → P28e + migration 20261125000000_p28e_recordings; 0.17.0 → P28c, migration yok)"
            echo "- [ ] 0.15.0 ve sonrası: Windows 10 + 11 elle turu GEÇTİ (runbook §28u.8: diyalogsuz açılış ≤ 3 sn + gösterge, yerel kapatma anahtarı, kilit/oturum kapatma + 1006/1007, K6s elle spike; r3: onay diyaloğu/örtü maddeleri yok, 1008 yazılmaz)"
            echo "- [ ] P28u r3 servisi (rs.cap.direct1) ve sonrası: sunucu P28u r3 prod'da ve servis AYNI pencerede yayınlanır (runbook §28u.10) — r3 sunucusu direct1 bildirmeyen servise 409 DEVICE_OUTDATED verir; P28u..P28f imajına geri dönüşte S-P28u-r3-3 notu (§28u.7)"
            echo "- [ ] 0.16.0 ve sonrası: Windows 10 + 11 kayıt elle turu GEÇTİ (runbook §28e.8: rıza kutusu işaretsiz, şerit/gösterge + Kaydı durdur ≤ 2 sn, gösterge eki (r3: gözetimsiz diyalog satırı yok), olay 1009, 1 sa kayıt ≤ 1 GB)"
            echo "- [ ] 0.17.0 ve sonrası: Windows çoklu teknisyen elle turu + AC-371 ölçümü GEÇTİ (runbook §28c.7/§28c.8: roster adları, Çıkar, devir, gözetimsiz göstergede adlar (r3: silent katılım gerekçesi/dört göz e-postası yok); kontrol sahibi ≥ 15 FPS, diğerleri ≥ 5 FPS)"
            echo "- [ ] 0.19.0 ve sonrası: sunucu P28f prod'da (clientOs, availability, OS_PERMISSION; migration yok) — eski sunucu clientOs'u yok sayar"
            echo "- [ ] 0.20.0 ve sonrası: sunucu P28g prod'da (os=linux, availability linux, WAYLAND_NO_CONTROL; migration yok); Linux elle E-listesi (mimari-p28g §12.1) staging TEST ikilisiyle GEÇTİ"
            echo "- [ ] 0.20.0 ve sonrası (mimari-p28g §5.2b m.7): Linux ikilisinin Wayland kontrol anahtarı (reproducible-linux özetindeki 'Wayland kontrolü: on|off'; repo değişkeni LINUX_WAYLAND_CONTROL; etiket derlemesinde tanımlı olmak zorunda). **on** ise E-7 (b) ve (c) gerçek GNOME Wayland makinesinde (24.04 + 22.04) GEÇTİ mi? Geçmediyse **Reject**, LINUX_WAYLAND_CONTROL=off yapıp yeni etiket (Wayland yalnız görüntü; X11 etkilenmez) (runbook §28g.6)"
            echo "- [ ] macOS (r4): package-mac özetindeki imza dalı + zip SHA'sını okuyun. APPLE_TEAM_ID tanımsız → macOS **ad-hoc** Release (Gatekeeper 'Yine de Aç'); E-listesi (mimari-p28f §15.7) aynı commit'in staging TEST paketiyle macOS 14 + 15'te GEÇTİ mi? Tanımlıysa Developer ID + D-listesi (runbook §28f.6)"
            echo "- [ ] Aynı commit'ten staging exe ile duman testi GEÇTİ (runbook §24.2)"
            echo "- [ ] qa GEÇTİ, güvenlik Kritik/Yüksek 0; bekleyen eski etiket koşusu yok"
            echo
            echo "Biri eksikse agent-release onayında **Reject**. Onay yorumuna P15 prod commit'ini yazın."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  approve:
    name: "ONAY: sunucu ön koşulu prod'da mı (runbook §24.1) — onaydan sonra imza + Release"
    # S17-2 (mimari-e11 §8, bağlayıcı): istemcinin gerektirdiği sunucu paketi (0.11.0 için P15) prod'da değilse ONAYLAMAYIN;
    # "Reject" edin. Eski sunucu `share.state`'i strictObject ile doğrular, yeni alanlar reddedilir.
    # S-P17-2: tek insan kapısı bu iştir ve imzalamadan (sign), attestation'dan ve Release'ten ÖNCE gelir: Reject edilen
    # etiket için imzalı ikili hiç üretilmez. Ortam onayı (required reviewers, deployment tags `v*`) repo ayarında
    # (runbook §11.1). Kontrol listesi `reproducible` işinin özetindedir.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.check.result == 'success' &&
      needs.test-windows.result == 'success' && needs.reproducible.result == 'success' &&
      needs.libopus-wasm.result == 'success' && needs.reproducible-mac.result == 'success' &&
      needs.package-mac.result == 'success' && needs.test-macos.result == 'success' &&
      needs.reproducible-linux.result == 'success' && needs.test-linux-gui.result == 'success'
    # P28f (§8.2 sıra): (reproducible ‖ reproducible-mac + package-mac + test-macos) → approve → (sign ‖ sign-mac) → attest → release.
    # P28g K8a: Linux derleme + GUI testleri de onaydan önce yeşil olmalı (attest-linux / Release K8b'de).
    needs: [check, test-windows, reproducible, libopus-wasm, reproducible-mac, package-mac, test-macos, reproducible-linux, test-linux-gui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: agent-release
    permissions:
      contents: read
    steps:
      - name: sürüm artışı (yeni etiket > en yüksek Release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Sürüm geriye gidemez: yeni etiket mevcut en yüksek Release sürümünden büyük olmalı (karışık sürüm ve
          # MIN_AGENT_VERSION / kabul kodu eşiği yanlış istemciye uygulanmasın). Rollback yeni etiketle değil §11.4 ile.
          # İmzadan önce denetlenir: reddedilecek sürüm imzalanmaz.
          tags=$(gh release list --repo "$REPO" --limit 100 --exclude-drafts --json tagName --jq '.[].tagName')
          top=$(printf '%s\n' "$tags" | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -n "$top" ]; then
            hi=$(printf '%s\n%s\n' "$top" "${TAG#v}" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            [ "$hi" = "${TAG#v}" ] && [ "$top" != "${TAG#v}" ] || { echo "::error::$TAG mevcut en yüksek Release v$top'tan büyük değil"; exit 1; }
          fi
          echo "onaylandı: $TAG (onaylayan ve yorum: Environments → agent-release → deployment geçmişi)" >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: SignPath imzası + signtool verify (AC-252; hesap yoksa atlanır)
    # AC-252 (mimari-e11 §8.1): yalnız Release etiketi push'unda, agent-release ONAYINDAN SONRA ve repo değişkeni
    # SIGNPATH_ORGANIZATION_ID tanımlıysa. Değişken yoksa iş "skipped" olur; attest/release imzasız ikiliyle sürer
    # (ADR-0010), AC-252 "uygulanamaz" kapanır.
    # S-P17-2: `SIGNPATH_API_TOKEN` yalnız `agent-sign` ORTAM secret'ıdır (deployment policy yalnız `v*` etiketi); dal
    # push'unda değiştirilmiş bir iş akışı bu ortama giremez, token'ı okuyamaz. SignPath politikası ayrıca kökeni
    # (refs/tags/v*, bu iş akışı dosyası) doğrular (runbook §24.3).
    # İmzalı ikili tekrarlanabilir DEĞİLDİR (imza eklenir); tekrarlanabilirlik imzasız ikilide (`reproducible`) kanıtlanır,
    # imzasız SHA-256 Release notunda yazılır. SHA256SUMS ve attestation İMZALI ikiliden üretilir (runbook §24.3).
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != '' &&
      needs.approve.result == 'success'
    needs: [reproducible, approve]
    runs-on: windows-2025
    timeout-minutes: 30
    environment: agent-sign
    permissions:
      contents: read
      actions: read # SignPath bağlayıcısı bu koşunun iş/artifact bilgisini github.token ile okur
    outputs:
      artifact: ${{ steps.out.outputs.artifact }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.reproducible.outputs.artifact }}", path: unsigned }
      - name: ön kontrol (yapılandırma + imzasız SHA256SUMS)
        shell: bash
        env:
          ART: ${{ needs.reproducible.outputs.artifact }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          [ "$ART" = agent-win ] || { echo "::error::yalnız Release artifact'i (agent-win) imzalanır (bulunan: $ART)"; exit 1; }
          [ -n "$PROJECT" ] && [ -n "$POLICY" ] || { echo "::error::SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG repo değişkeni eksik"; exit 1; }
          [ "$TOKEN_SET" = true ] || { echo "::error::SIGNPATH_API_TOKEN agent-sign ortam secret'ı eksik (runbook §24.3)"; exit 1; }
          cd unsigned && sha256sum -c SHA256SUMS
      - id: up
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-win-unsigned
          # P27 K9: iki PE tek artifact'te; SignPath artifact yapılandırması ikisini de imzalar (runbook §24.3 / §27.6).
          path: |
            unsigned/NoktaDestek.exe
            unsigned/${{ needs.reproducible.outputs.servis_exe }}
          if-no-files-found: error
          retention-days: 1
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.up.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: signtool verify /pa (Authenticode zinciri + zaman damgası)
        shell: pwsh
        env:
          SERVIS_EXE: ${{ needs.reproducible.outputs.servis_exe }}
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { Write-Output "::error::signtool.exe bulunamadı (Windows SDK)"; exit 1 }
          foreach ($n in @('NoktaDestek.exe', $env:SERVIS_EXE)) {
            $exe = Join-Path $PWD "signed/$n"
            if (-not (Test-Path $exe)) { Write-Output "::error::SignPath çıktısında $n yok"; exit 1 }
            & $st.FullName verify /pa /tw /v $exe
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::$n signtool verify /pa başarısız"; exit 1 }
            $sig = Get-AuthenticodeSignature -FilePath $exe
            if ($sig.Status -ne 'Valid') { Write-Output "::error::$n Authenticode durumu $($sig.Status)"; exit 1 }
            Write-Output "$n imzalayan: $($sig.SignerCertificate.Subject)"
          }
      - name: SHA256SUMS (imzalı ikiliden) + boyut/packer kontrolü
        id: out
        shell: bash
        env:
          SERVIS_EXE: ${{ needs.reproducible.outputs.servis_exe }}
        run: |
          mkdir dist && cp unsigned/build-meta.txt dist/
          for e in NoktaDestek.exe "$SERVIS_EXE"; do
            f="signed/$e"
            size=$(stat -c %s "$f"); echo "$e boyut=$size"
            [ "$size" -le 41943040 ] || { echo "::error::imzalı $e 40 MB'ı aşıyor (AC-96)"; exit 1; }
            [ "$(head -c2 "$f")" = MZ ] || { echo "::error::$e PE değil"; exit 1; }
            if grep -aq 'UPX!' "$f"; then echo "::error::$e UPX/packer izi (ADR-0010)"; exit 1; fi
            cp "$f" "dist/$e"
          done
          # İmzasız (tekrarlanabilir) özetler: satır biçimi "<sha>  <ad>" (iki ikili).
          cp unsigned/SHA256SUMS dist/unsigned-sha256.txt
          (cd dist && sha256sum NoktaDestek.exe "$SERVIS_EXE" > SHA256SUMS && cat SHA256SUMS)
          { echo "### NoktaDestek.exe + $SERVIS_EXE (imzalı, agent-win-signed)"; echo '```'; cat dist/SHA256SUMS
            echo "imzasız (tekrarlanabilir) SHA-256:"; cat dist/unsigned-sha256.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "artifact=agent-win-signed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-win-signed
          path: dist/
          if-no-files-found: error
          # S-P17-2: imzalı kopya yalnız hemen ardından koşan release işi için; kalıcı kopya Release'tedir.
          retention-days: 1

  # P28f K8b (mimari-p28f §8.2 sign-mac, §5.1 T11; ADR-0037 m.6; S-P28f-6): Developer ID + hardened runtime + --timestamp,
  # notarytool (30 dk), staple, spctl "Notarized Developer ID", TeamIdentifier = vars.APPLE_TEAM_ID. vars.APPLE_TEAM_ID yoksa
  # iş "skipped" olur; r4: Release'e package-mac'in ad-hoc prod zip'i (agent-mac-adhoc) girer (attest-mac onaya bağlı). GÜVENLİK SINIRI `if:` DEĞİL ORTAMDIR: `agent-mac-sign`
  # deployment policy yalnız `v*` etiketleri + zorunlu onaylayıcı (kendi onayı yasak) + etiket ruleset'i (runbook §28f.3). Girdi
  # reproducible-mac ÇIKTISINDAKİ SHA'larla doğrulanır; bundle + zip BU işte etiket commit'indeki package.sh ile üretilir.
  # Sırlar yalnız Apple araçlarına (security, codesign, notarytool) gider; üçüncü taraf Action yok, `set -x` yok; .p12/.p8/keychain
  # `if: always()` ile silinir.
  sign-mac:
    name: sign-mac (Developer ID + notarize + staple; APPLE_TEAM_ID yoksa atlanır)
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && vars.APPLE_TEAM_ID != '' &&
      needs.reproducible-mac.outputs.signing == 'notarized' &&
      needs.approve.result == 'success' && needs.reproducible-mac.result == 'success'
    needs: [reproducible-mac, approve]
    runs-on: macos-15
    timeout-minutes: 50
    environment: agent-mac-sign
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/agent-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-mac-thin, path: "${{ runner.temp }}/thin" }
      - name: girdi doğrulaması (reproducible-mac SHA + build-meta)
        env:
          WANT_ARM64: ${{ needs.reproducible-mac.outputs.sha_arm64 }}
          WANT_AMD64: ${{ needs.reproducible-mac.outputs.sha_amd64 }}
          VERSION: ${{ needs.reproducible-mac.outputs.version }}
          MODE: ${{ needs.reproducible-mac.outputs.mode }}
          TAG: ${{ github.ref_name }}
          VAR_SERVER_URL: ${{ vars.AGENT_SERVER_URL }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          [ "$(shasum -a 256 "$RUNNER_TEMP/thin/noktadestek-arm64" | cut -d' ' -f1)" = "$WANT_ARM64" ] || { echo "::error::arm64 SHA uyuşmuyor"; exit 1; }
          [ "$(shasum -a 256 "$RUNNER_TEMP/thin/noktadestek-amd64" | cut -d' ' -f1)" = "$WANT_AMD64" ] || { echo "::error::amd64 SHA uyuşmuyor"; exit 1; }
          [ "$MODE" = prod ] && [ "v$VERSION" = "$TAG" ] || { echo "::error::kip/sürüm etiketle uyuşmuyor ($MODE $VERSION $TAG)"; exit 1; }
          [ "$(sed -n 1p "$RUNNER_TEMP/thin/build-meta.txt")" = "$VAR_SERVER_URL" ] || { echo "::error::gömülü adres AGENT_SERVER_URL değil"; exit 1; }
          # D-P28f-K3: ince ikililere gömülü beklenen Team ID (build-meta 4. satır) = imzalayan ekip.
          [ "$(sed -n 4p "$RUNNER_TEMP/thin/build-meta.txt")" = "$TEAM" ] || { echo "::error::gömülü Team ID vars.APPLE_TEAM_ID değil"; exit 1; }
      - name: ön kontrol (sırlar tanımlı mı; değer basılmaz)
        env:
          P12_SET: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' }}
          P12PW_SET: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' }}
          P8_SET: ${{ secrets.APPLE_NOTARY_KEY_P8 != '' }}
          KID_SET: ${{ secrets.APPLE_NOTARY_KEY_ID != '' }}
          ISS_SET: ${{ secrets.APPLE_NOTARY_ISSUER_ID != '' }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for v in P12_SET P12PW_SET P8_SET KID_SET ISS_SET; do
            [ "$(printenv "$v")" = true ] || { echo "::error::agent-mac-sign ortam secret'ı eksik: $v (runbook §28f.3)"; exit 1; }
          done
          printf '%s' "$TEAM" | grep -Eq '^[A-Z0-9]{10}$' || { echo "::error::APPLE_TEAM_ID 10 karakter A-Z0-9 olmalı"; exit 1; }
      - name: geçici keychain + Developer ID içe aktarma
        id: kc
        env:
          P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PW: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          umask 077
          kc="$RUNNER_TEMP/imza.keychain-db"; kcpw="$(openssl rand -hex 24)"
          printf '%s' "$P12_B64" | base64 -D > "$RUNNER_TEMP/imza.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/imza.p12" -k "$kc" -P "$P12_PW" -f pkcs12 -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/imza.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          n=$(security find-identity -v -p codesigning "$kc" | grep -c "Developer ID Application: .*($TEAM)" || true)
          [ "$n" = 1 ] || { echo "::error::keychain'de ($TEAM) için tek Developer ID Application kimliği yok (bulunan: $n)"; exit 1; }
          id=$(security find-identity -v -p codesigning "$kc" | grep "Developer ID Application: .*($TEAM)" | awk '{print $2}')
          { echo "keychain=$kc"; echo "identity=$id"; } >> "$GITHUB_OUTPUT"
      - name: bundle + Developer ID imza + check
        env:
          VERSION: ${{ needs.reproducible-mac.outputs.version }}
          ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          CODESIGN_KEYCHAIN: ${{ steps.kc.outputs.keychain }}
          IDENTITY: ${{ steps.kc.outputs.identity }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          s="$RUNNER_TEMP/pkg/stage"; app="$s/Nokta Destek.app"
          build/macos/package.sh bundle "$RUNNER_TEMP/thin/noktadestek-arm64" "$RUNNER_TEMP/thin/noktadestek-amd64" "$VERSION" prod "$s"
          build/macos/package.sh sign "$app" "$IDENTITY"
          build/macos/package.sh check "$app" prod "$VERSION" "$TEAM"
          build/macos/package.sh zip "$s" "$RUNNER_TEMP/pkg/notarize-$ZIP"
      - name: notarytool submit --wait (30 dk) + staple
        id: notary
        env:
          P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          KID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISS: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          ZIP: ${{ needs.reproducible-mac.outputs.zip }}
        run: |
          umask 077
          printf '%s\n' "$P8" > "$RUNNER_TEMP/notary.p8"
          out="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$RUNNER_TEMP/pkg/notarize-$ZIP" --key "$RUNNER_TEMP/notary.p8" --key-id "$KID" --issuer "$ISS" \
            --wait --timeout 30m --output-format json > "$out" || true
          sid=$(jq -r '.id // empty' "$out"); st=$(jq -r '.status // empty' "$out")
          echo "notarization: id=$sid status=$st"
          if [ "$st" != Accepted ]; then
            [ -z "$sid" ] || xcrun notarytool log "$sid" --key "$RUNNER_TEMP/notary.p8" --key-id "$KID" --issuer "$ISS" || true
            echo "::error::notarization $st (Accepted değil)"; exit 1
          fi
          app="$RUNNER_TEMP/pkg/stage/Nokta Destek.app"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          echo "sid=$sid" >> "$GITHUB_OUTPUT"
      - name: staple sonrası zip + spctl + TeamIdentifier + SHA256SUMS
        env:
          VERSION: ${{ needs.reproducible-mac.outputs.version }}
          ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          SID: ${{ steps.notary.outputs.sid }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          s="$RUNNER_TEMP/pkg/stage"; app="$s/Nokta Destek.app"; d="$RUNNER_TEMP/dist"; mkdir "$d"
          build/macos/package.sh check "$app" prod "$VERSION" "$TEAM"
          spctl -a -vv -t exec "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt" || { echo "::error::spctl: Notarized Developer ID değil"; exit 1; }
          build/macos/package.sh zip "$s" "$d/$ZIP"
          # Son zip'i açıp yeniden denetle (zip içindeki paket = staple'lı paket).
          ditto -x -k "$d/$ZIP" "$RUNNER_TEMP/kontrol"
          build/macos/package.sh check "$RUNNER_TEMP/kontrol/Nokta Destek.app" prod "$VERSION" "$TEAM"
          xcrun stapler validate "$RUNNER_TEMP/kontrol/Nokta Destek.app"
          cp "$RUNNER_TEMP/thin/build-meta.txt" "$d/"
          (cd "$d" && shasum -a 256 "$ZIP" > SHA256SUMS)
          { (cd "$s" && shasum -a 256 "Nokta Destek.app/Contents/MacOS/noktadestek")
            (cd "$RUNNER_TEMP/thin" && shasum -a 256 noktadestek-arm64 noktadestek-amd64); } > "$d/icerik-sha256.txt"
          jq -n --arg team "$TEAM" --arg sid "$SID" --arg ver "$VERSION" --arg zip "$ZIP" \
            '{bundleId:"net.noktabilisim.destek", version:$ver, file:$zip, teamId:$team, notarySubmissionId:$sid,
              notarized:true, stapled:true, gatekeeper:"source=Notarized Developer ID"}' > "$d/notarization.json"
          { echo "### $ZIP (Developer ID + notarize + staple; agent-mac-signed)"; echo '```'; cat "$d/SHA256SUMS" "$d/icerik-sha256.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-mac-signed
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1
      - name: keychain + anahtar dosyaları silme
        if: always()
        env:
          KC: ${{ steps.kc.outputs.keychain }}
        run: |
          [ -z "$KC" ] || security delete-keychain "$KC" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/imza.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/imza.keychain-db"

  # P28f K8b + r4 (§15.4 m.4; S-r4-3/4): macOS zip attestation'ı. Etiket: YALNIZ approve başarılıysa (sign-mac "skipped" hem
  # "Team ID yok" hem "Reject" olabilir → kapı onaya bağlı) ve dal reproducible-mac `signing`'e göre: notarized → sign-mac başarılı,
  # agent-mac-signed + "notarized" predicate (aynen); adhoc → package-mac başarılı, agent-mac-adhoc; zip SHA = package-mac.zip_sha,
  # zip içi ikili = package-mac.exe_sha; "macos-adhoc" predicate'i İŞ ÇIKTILARINDAN kurulur (artifact'teki adhoc.json yalnız birebir
  # karşılaştırılır). Etiket dışı (main push, staging dispatch): package-mac'in ad-hoc TEST zip'i yalnız build provenance
  # (publish-mac.sh --stg-run doğrular). PR'da yok (id-token yok).
  attest-mac:
    name: macOS attestation
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      ((github.ref_type == 'tag' && needs.approve.result == 'success' &&
        ((needs.reproducible-mac.outputs.signing == 'notarized' && needs.sign-mac.result == 'success') ||
         (needs.reproducible-mac.outputs.signing == 'adhoc' && needs.package-mac.result == 'success'))) ||
       (github.ref_type != 'tag' && needs.package-mac.result == 'success'))
    needs: [reproducible-mac, package-mac, sign-mac, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.pick.outputs.artifact }}
      signing: ${{ steps.pick.outputs.signing }}
    steps:
      - name: attest edilecek artifact (dal = reproducible-mac signing; vars yalnız tutarlılık)
        id: pick
        env:
          REF_TYPE: ${{ github.ref_type }}
          PLAIN: ${{ needs.reproducible-mac.outputs.artifact }}
          SIGNING: ${{ needs.reproducible-mac.outputs.signing }}
          VAR_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            case "$SIGNING" in
              notarized) a=agent-mac-signed; [ -n "$VAR_TEAM" ] || { echo "::error::signing=notarized ama vars.APPLE_TEAM_ID boş"; exit 1; } ;;
              adhoc) a=agent-mac-adhoc; [ -z "$VAR_TEAM" ] || { echo "::error::signing=adhoc ama vars.APPLE_TEAM_ID tanımlı"; exit 1; } ;;
              *) echo "::error::reproducible-mac signing '$SIGNING'"; exit 1 ;;
            esac
          else
            a="$PLAIN"; SIGNING=adhoc
          fi
          case "$a" in agent-mac|agent-mac-stg|agent-mac-signed|agent-mac-adhoc) ;; *) echo "::error::artifact $a"; exit 1 ;; esac
          { echo "artifact=$a"; echo "signing=$SIGNING"; } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ steps.pick.outputs.artifact }}", path: dist }
      - name: SHA256SUMS + notarization.json / ad-hoc predicate (etiket)
        env:
          REF_TYPE: ${{ github.ref_type }}
          SIGNING: ${{ steps.pick.outputs.signing }}
          ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          VERSION: ${{ needs.reproducible-mac.outputs.version }}
          ZSHA: ${{ needs.package-mac.outputs.zip_sha }}
          ESHA: ${{ needs.package-mac.outputs.exe_sha }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cd dist && sha256sum -c SHA256SUMS
          [ -f "$ZIP" ] || { echo "::error::$ZIP yok"; exit 1; }
          if [ "$REF_TYPE" = tag ] && [ "$SIGNING" = notarized ]; then
            [ "$(jq -r .teamId notarization.json)" = "$TEAM" ] && [ "$(jq -r .file notarization.json)" = "$ZIP" ] \
              || { echo "::error::notarization.json teamId/file uyuşmuyor"; exit 1; }
          elif [ "$REF_TYPE" = tag ]; then
            # S-r4-4: bağ iş çıktılarıdır (değiştirilemez); artifact yalnız bunlara eşitse attest edilir.
            if ! printf '%s\n%s' "$ESHA" "$ZSHA" | grep -Ecx '[0-9a-f]{64}' | grep -qx 2; then echo "::error::package-mac zip_sha/exe_sha yok"; exit 1; fi
            [ "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "$ZSHA" ] || { echo "::error::zip SHA package-mac.zip_sha değil"; exit 1; }
            [ "$(unzip -p "$ZIP" "Nokta Destek.app/Contents/MacOS/noktadestek" | sha256sum | cut -d' ' -f1)" = "$ESHA" ] \
              || { echo "::error::zip içi ikili package-mac.exe_sha değil"; exit 1; }
            grep -qxF "$ESHA  Nokta Destek.app/Contents/MacOS/noktadestek" icerik-sha256.txt || { echo "::error::icerik-sha256.txt paket içi satırı exe_sha değil"; exit 1; }
            [ "$(sed -n 3p build-meta.txt)" = prod ] && [ -z "$(sed -n 4p build-meta.txt)" ] || { echo "::error::build-meta prod + boş Team ID değil"; exit 1; }
            jq -n --arg ver "$VERSION" --arg zip "$ZIP" --arg exe "$ESHA" \
              '{bundleId:"net.noktabilisim.destek", version:$ver, file:$zip, signature:"adhoc", notarized:false, executableSha256:$exe}' \
              > "$RUNNER_TEMP/adhoc-predicate.json"
            [ "$(jq -cS . adhoc.json)" = "$(jq -cS . "$RUNNER_TEMP/adhoc-predicate.json")" ] || { echo "::error::artifact adhoc.json iş çıktılarından kurulan predicate değil"; exit 1; }
            cat "$RUNNER_TEMP/adhoc-predicate.json"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.reproducible-mac.outputs.zip }}
      - if: github.ref_type == 'tag' && steps.pick.outputs.signing == 'notarized'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ needs.reproducible-mac.outputs.zip }}
          predicate-type: ${{ env.MAC_NOTARIZED_PREDICATE }}
          predicate-path: dist/notarization.json
      - if: github.ref_type == 'tag' && steps.pick.outputs.signing == 'adhoc'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ needs.reproducible-mac.outputs.zip }}
          predicate-type: ${{ env.MAC_ADHOC_PREDICATE }}
          predicate-path: ${{ runner.temp }}/adhoc-predicate.json

  # P28g K8b (mimari-p28g §8.2, S-P28g-9): Linux ELF attestation'ı. Etiket: yalnız agent-release onayından sonra (Reject edilen etiket
  # attest edilmez); etiket dışı (main push → agent-linux-test, staging dispatch → agent-linux-stg) koşulsuz. PR'da yok (id-token yok).
  # publish-linux.sh --tag `--source-ref refs/tags/<etiket> --signer-workflow agent-win.yml` ile doğrular (iş akışı = etiket iş akışı).
  attest-linux:
    name: Linux attestation
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.reproducible-linux.result == 'success' &&
      (github.ref_type != 'tag' || needs.approve.result == 'success')
    needs: [reproducible-linux, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.reproducible-linux.outputs.artifact }}", path: dist }
      - name: artifact + SHA256SUMS + reproducible-linux SHA
        env:
          REF_TYPE: ${{ github.ref_type }}
          ART: ${{ needs.reproducible-linux.outputs.artifact }}
          FILE: ${{ needs.reproducible-linux.outputs.file }}
          SHA: ${{ needs.reproducible-linux.outputs.sha }}
        run: |
          case "$REF_TYPE:$ART" in tag:agent-linux|branch:agent-linux-stg|branch:agent-linux-test) ;; *) echo "::error::artifact $ART ($REF_TYPE)"; exit 1 ;; esac
          cd dist && sha256sum -c SHA256SUMS
          [ "$(sha256sum "$FILE" | cut -d' ' -f1)" = "$SHA" ] || { echo "::error::$FILE SHA'sı reproducible-linux çıktısı değil"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.reproducible-linux.outputs.file }}

  attest:
    name: build provenance attestation
    # Fork PR'larında id-token yok; yalnız main/etiket push'u ve elle tetikleme. GitHub, attestation'ı private
    # repoda yalnız Enterprise Cloud'da destekler (runbook §11.6). AC-252: `sign` koştuysa imzalı ikili, atlandıysa
    # imzasız ikili attest edilir; `sign` başarısızsa attest (ve Release) koşmaz (fail-closed). Etikette yalnız
    # agent-release onayından sonra (Reject edilen etiket attest edilmez; onaysızken `sign` de "skipped" görünür).
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.reproducible.result == 'success' &&
      (github.ref_type != 'tag' || needs.approve.result == 'success') &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    needs: [reproducible, approve, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.pick.outputs.artifact }}
    steps:
      - name: attest edilecek artifact
        id: pick
        env:
          SIGNED: ${{ needs.sign.outputs.artifact }}
          PLAIN: ${{ needs.reproducible.outputs.artifact }}
        run: echo "artifact=${SIGNED:-$PLAIN}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ steps.pick.outputs.artifact }}", path: dist }
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # P27 K9: iki ikili de (istemci + servis) attest edilir; `signed` modda sunucu listesi bu SHA'lardan yazılır.
        with:
          subject-path: |
            dist/${{ needs.reproducible.outputs.exe }}
            dist/${{ needs.reproducible.outputs.servis_exe }}

  release:
    name: GitHub Release (korumalı v* etiketi; agent-release onayından sonra)
    # İnsan kapısı `approve` işidir (S17-2, S-P17-2); bu iş yalnız onaylanmış + (imzalanmış) + attest edilmiş ikiliyi yayımlar.
    # Ayrı ortam onayı yok (ikinci onay aynı kişiye aynı soruyu sorardı). Etiket yalnız yöneticilerce itilebilir (ruleset).
    # P28f K8b + r4 (§15.4 m.5): macOS zip'i Release'te ZORUNLU — attest-mac başarılı olmalı ("skipped" kabul edilmez). Artifact
    # attest-mac.outputs.artifact: agent-mac-signed (notarized) ya da agent-mac-adhoc (adhoc); dal reproducible-mac signing ile ve
    # vars.APPLE_TEAM_ID ile tutarlı olmalı (uyuşmazlık = hata). sign-mac başarısızsa Release yok (fail-closed).
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.approve.result == 'success' &&
      needs.attest.result == 'success' && (needs.sign-mac.result == 'success' || needs.sign-mac.result == 'skipped') &&
      needs.attest-mac.result == 'success' &&
      needs.reproducible-linux.result == 'success' && needs.attest-linux.result == 'success' &&
      (needs.update-manifest.result == 'success' || needs.update-manifest.result == 'skipped')
    # P28g K8b: Linux ELF'i her Release'te ZORUNLU (imza adımı yok, "skipped" kabul edilmez); attest-linux başarısızsa Release yok.
    # P29 K6 (§9.6, AC-471): update-manifest atlandıysa (UPDATE_SIGNING_ENABLED kapalı) ya da secret boşsa (produced=0) Release
    # manifestsiz sürer (fail-closed: istemci "yayın yok" görür); update-manifest BAŞARISIZSA Release yok.
    needs: [reproducible, approve, attest, reproducible-mac, sign-mac, attest-mac, reproducible-linux, attest-linux, update-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.attest.outputs.artifact }}", path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.attest-mac.outputs.artifact }}", path: distmac }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-linux, path: distlinux }
      # P29 K6: manifestler anahtarsız bu işte Node doğrulayıcısıyla (Go imzalayıcıdan bağımsız) yeniden denetlenir.
      - if: needs.update-manifest.outputs.produced == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
          sparse-checkout: |
            apps/agent-win/build/update-keys
            deploy/agent/verify-manifest.mjs
          sparse-checkout-cone-mode: false
      - if: needs.update-manifest.outputs.produced == '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-update, path: distupd }
      - name: Release oluştur (exe + macOS zip + Linux ELF + SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ART: ${{ needs.attest.outputs.artifact }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SERVIS_EXE: ${{ needs.reproducible.outputs.servis_exe }}
          APPLE_TEAM: ${{ vars.APPLE_TEAM_ID }}
          MAC_ART: ${{ needs.attest-mac.outputs.artifact }}
          MAC_SIGNING: ${{ needs.attest-mac.outputs.signing }}
          REPRO_SIGNING: ${{ needs.reproducible-mac.outputs.signing }}
          MAC_ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          LINUX_ART: ${{ needs.reproducible-linux.outputs.artifact }}
          LINUX_FILE: ${{ needs.reproducible-linux.outputs.file }}
          LINUX_SHA: ${{ needs.reproducible-linux.outputs.sha }}
          VAR_SERVER_URL: ${{ vars.AGENT_SERVER_URL }}
          UPD_PRODUCED: ${{ needs.update-manifest.outputs.produced }}
        run: |
          case "$ART" in agent-win|agent-win-signed) ;; *) echo "::error::Release artifact'i $ART olamaz"; exit 1 ;; esac
          # P28f r4 (AC-500, K-P28f-r4-4, S-r4-3): macOS zip'i ZORUNLU; notarized ⇔ agent-mac-signed ⇔ APPLE_TEAM_ID dolu,
          # adhoc ⇔ agent-mac-adhoc ⇔ APPLE_TEAM_ID boş; dal reproducible-mac signing ile aynı.
          M="$GITHUB_WORKSPACE/distmac"; mac=1
          [ -d "$M" ] || { echo "::error::macOS zip'i yok (etikette zorunlu)"; exit 1; }
          case "$MAC_ART:$MAC_SIGNING" in agent-mac-signed:notarized|agent-mac-adhoc:adhoc) ;; *) echo "::error::macOS artifact/dal tutarsız: $MAC_ART/$MAC_SIGNING"; exit 1 ;; esac
          [ "$MAC_SIGNING" = "$REPRO_SIGNING" ] || { echo "::error::attest-mac dalı ($MAC_SIGNING) reproducible-mac signing ($REPRO_SIGNING) değil"; exit 1; }
          if [ -n "$APPLE_TEAM" ]; then want_sig=notarized; else want_sig=adhoc; fi
          [ "$MAC_SIGNING" = "$want_sig" ] || { echo "::error::dal $MAC_SIGNING ama vars.APPLE_TEAM_ID ile beklenen $want_sig"; exit 1; }
          if [ "$mac" = 1 ]; then
            printf '%s' "$MAC_ZIP" | grep -Eq '^NoktaDestek-macOS-[0-9]+\.[0-9]+\.[0-9]+\.zip$' || { echo "::error::macOS zip adı $MAC_ZIP"; exit 1; }
            [ "$MAC_ZIP" = "NoktaDestek-macOS-${TAG#v}.zip" ] || { echo "::error::macOS zip sürümü etiketle uyuşmuyor"; exit 1; }
            (cd "$M" && sha256sum -c SHA256SUMS)
          fi
          # AC-252: SignPath yapılandırılmışsa imzasız ikili Release'e gitmez.
          [ -z "$SIGNPATH_ORG" ] || [ "$ART" = agent-win-signed ] || { echo "::error::SignPath tanımlı ama ikili imzasız"; exit 1; }
          cd dist && sha256sum -c SHA256SUMS
          server=$(sed -n 1p build-meta.txt)
          if [ "$ART" = agent-win-signed ]; then
            sig="Authenticode imzalı (SignPath, AC-252). İmzasız tekrarlanabilir derlemelerin SHA-256'sı: $(tr '\n' ' ' < unsigned-sha256.txt)"
          else
            sig="imzasız (ADR-0010)"
          fi
          files=(NoktaDestek.exe "$SERVIS_EXE")
          # P28g (AC-403, S-P28g-9): Linux ELF — artifact agent-linux, ad etiketle aynı sürüm, SHA = reproducible-linux, build-meta prod +
          # AGENT_SERVER_URL. SHA256SUMS satırı mac olsun olmasın her zaman eklenir ve aşağıda doğrulanır.
          L="$GITHUB_WORKSPACE/distlinux"
          [ "$LINUX_ART" = agent-linux ] || { echo "::error::Linux artifact'i $LINUX_ART (agent-linux olmalı)"; exit 1; }
          [ "$LINUX_FILE" = "NoktaDestek-linux-x86_64-${TAG#v}" ] || { echo "::error::Linux dosya adı $LINUX_FILE etiketle uyuşmuyor"; exit 1; }
          [ "$(sed -n 3p "$L/build-meta.txt")" = prod ] && [ "$(sed -n 1p "$L/build-meta.txt")" = "$VAR_SERVER_URL" ] \
            || { echo "::error::Linux build-meta prod/AGENT_SERVER_URL değil"; exit 1; }
          (cd "$L" && sha256sum -c SHA256SUMS)
          [ "$(sha256sum "$L/$LINUX_FILE" | cut -d' ' -f1)" = "$LINUX_SHA" ] || { echo "::error::Linux SHA reproducible-linux çıktısı değil"; exit 1; }
          cp "$L/$LINUX_FILE" .
          awk -v f="$LINUX_FILE" '$2 == f' "$L/SHA256SUMS" | grep -q . || { echo "::error::Linux SHA256SUMS'ta $LINUX_FILE yok"; exit 1; }
          awk -v f="$LINUX_FILE" '$2 == f' "$L/SHA256SUMS" >> SHA256SUMS
          files+=("$LINUX_FILE")
          if [ "$mac" = 1 ]; then
            cp "$M/$MAC_ZIP" .
            # SHA256SUMS: zip satırı + paket içi ikili satırı (Hakkında parmak izi, AC-128). Paket içi satırın dosyası Release'te
            # yoktur → doğrulama `sha256sum -c --ignore-missing` (Release notu).
            awk -v z="$MAC_ZIP" '$2 == z' "$M/SHA256SUMS" | grep -q . || { echo "::error::macOS SHA256SUMS'ta $MAC_ZIP yok"; exit 1; }
            awk -v z="$MAC_ZIP" '$2 == z' "$M/SHA256SUMS" >> SHA256SUMS
            grep -F '  Nokta Destek.app/Contents/MacOS/noktadestek' "$M/icerik-sha256.txt" >> SHA256SUMS
            sha256sum -c --ignore-missing SHA256SUMS
            files+=("$MAC_ZIP")
          fi
          # P29 K6: manifest çifti (ikili başına; K-P29-2) — sha256 = bu Release'teki ikili, sürüm = etiket, env = prod.
          upd="yok (UPDATE_SIGNING_ENABLED kapalı ya da anahtar tanımsız — istemciler bu sürümü otomatik almaz)"
          if [ "$UPD_PRODUCED" = 1 ]; then
            U="$GITHUB_WORKSPACE/distupd"
            (cd "$U" && sha256sum -c SHA256SUMS)
            (cd "$U" && node "$GITHUB_WORKSPACE/src/deploy/agent/verify-manifest.mjs" --pubkeys-file "$GITHUB_WORKSPACE/src/apps/agent-win/build/update-keys/prod.pub" \
              --env prod --expect-name --expect-version "${TAG#v}" update-*.json) > upd.jsonl
            while read -r j; do
              m=$(jq -r .file <<<"$j"); want=$(jq -r .sha256 <<<"$j")
              case "$m" in
                update-client-windows-amd64.json) b=NoktaDestek.exe ;; update-service-windows-amd64.json) b="$SERVIS_EXE" ;;
                update-client-linux-amd64.json) b="$LINUX_FILE" ;; update-client-macos-universal.json) b="$MAC_ZIP" ;;
                *) echo "::error::beklenmeyen manifest $m"; exit 1 ;;
              esac
              [ -f "$b" ] && [ "$(sha256sum "$b" | cut -d' ' -f1)" = "$want" ] || { echo "::error::$m sha256 Release'teki $b değil"; exit 1; }
              cp "$U/$m" "$U/$m.sig" .; files+=("$m" "$m.sig"); sha256sum "$m" "$m.sig" >> SHA256SUMS
            done < upd.jsonl
            rm -f upd.jsonl
            upd="var ($(grep -c . <<<"$(ls update-*.json)") ikili; Ed25519 imzalı, env=prod — runbook §31)"
          fi
          sha256sum -c --ignore-missing SHA256SUMS
          for x in "${files[@]}"; do grep -Eq "^[0-9a-f]{64}  $x\$" SHA256SUMS || { echo "::error::SHA256SUMS'ta $x satırı yok"; exit 1; }; done
          {
            echo "Nokta Destek Windows istemcisi ve gözetimsiz erişim servisi ($SERVIS_EXE) $TAG ($sig). Sunucu: $server"
            echo
            if [ "$MAC_SIGNING" = notarized ]; then
              echo "macOS istemcisi $MAC_ZIP: Developer ID (Team $APPLE_TEAM) + notarize + staple; macOS 13+, universal (Apple Silicon + Intel)."
            else
              echo "macOS istemcisi $MAC_ZIP: ad-hoc imzalı (Apple Developer ID / notarization YOK); ilk açılışta Gizlilik ve Güvenlik → 'Yine de Aç' onayı ve her sürümde Ekran Kaydı/Erişilebilirlik izni yeniden gerekir. macOS 13+, universal."
              echo "Köken: \`gh attestation verify $MAC_ZIP --repo $REPO --signer-workflow $REPO/.github/workflows/agent-win.yml --source-ref refs/tags/$TAG --predicate-type $MAC_ADHOC_PREDICATE\`"
            fi
            echo
            echo "Linux istemcisi $LINUX_FILE: x86_64, imzasız (AC-403); Ubuntu 22.04 / 24.04 (GNOME, X11 ve Wayland). Bütünlük bu Release'teki SHA256SUMS ve attestation ile doğrulanır; indirme sayfasındaki SHA yalnız kolaylıktır."
            echo
            echo '```'; cat SHA256SUMS; echo '```'
            echo
            echo "Güncelleme manifesti: $upd"
            if [ "$mac" = 1 ]; then
              echo
              echo "macOS imzasız (tekrarlanabilir) ince ikililer, S-P28f-17:"
              echo '```'; grep -E '  noktadestek-(arm64|amd64)$' "$M/icerik-sha256.txt"; echo '```'
              echo "Karşılaştırma: aynı etiketten \`build/build-darwin.sh <sunucu> ${TAG#v} <arm64|amd64>\` (GO_IMAGE) → yukarıdaki SHA; paketteki dilim için \`lipo -thin arm64 'Nokta Destek.app/Contents/MacOS/noktadestek' -output a && codesign --remove-signature a\` ve aynı işlemi yeniden derlenen ince ikiliye uygulayıp \`cmp\` (runbook §28f.5; \`build/macos/package.sh compare\`)."
            fi
            echo
            echo "Doğrulama: \`sha256sum -c --ignore-missing SHA256SUMS\` ve her dosya için \`gh attestation verify <dosya> --repo $REPO --signer-workflow $REPO/.github/workflows/agent-win.yml --source-ref refs/tags/$TAG\`"
          } > notes.md
          gh release create "$TAG" "${files[@]}" SHA256SUMS --repo "$REPO" --verify-tag --title "Nokta Destek $TAG" --notes-file notes.md


  # ---------------------------------------------------------------------------------------------------------------------------
  # P29 K6 — imzalı güncelleme manifesti (mimari-p29 §9.6, §14.1, §14.2 T-2; ADR-0040; runbook §31). AC-470/471/472.
  # Güvenlik sınırı `if:` DEĞİL ortamdır: tohum UPDATE_SIGNING_KEY yalnız `agent-update-sign` (prod; deployment refs yalnız `v*`,
  # zorunlu onaylayıcı, yönetici atlatması kapalı) ve `agent-update-sign-stg` (yalnız `main`) ORTAM secret'ıdır. Repo değişkenleri
  # UPDATE_SIGNING_ENABLED / UPDATE_SIGNING_ENABLED_STG ('1') işleri açar; kapalıysa "skipped", Release manifestsiz (fail-closed).
  # T-2: imzalayıcı anahtarsız `update-signer` işinde GOPROXY=off ile derlenir, yalnız stdlib + kendi paketlerimize bağlı olduğu
  # denetlenir; imza işinde checkout yalnız build/update-keys (sparse), persist-credentials:false, önbellek/setup-go yok, başka betik
  # yok; tohum TEK adımda yalnız stdin'e verilir; adım çıktısı dosyaya yazılır ve tohumun base64/base64url/hex biçimleri
  # `grep -F -f` ile aranır (değer argv'ye/diske girmez) -> eşleşme kırmızı; çıktı ancak temizse log'a basılır.
  # İmzalayıcı (apps/agent-win/cmd/update-sign, P29 K3):
  #   sign --key-stdin --env E --platform P --arch A --component C --version V --min-updater V --file <ikili> --out-dir D
  #   sign --key-stdin --from <eski manifest> --out-dir D     (yeniden imza: yalnız issuedAt/expiresAt değişir)
  #   verify --pubkeys <b64url>[,<b64url>] --env E --manifest <m.json> [--file <ikili>]
  # ---------------------------------------------------------------------------------------------------------------------------
  update-signer:
    name: "update-sign derle (anahtarsız; GOPROXY=off, yalnız stdlib)"
    if: >-
      (vars.UPDATE_SIGNING_ENABLED == '1' &&
       ((github.event_name == 'push' && github.ref_type == 'tag') ||
        (github.event_name == 'workflow_dispatch' && inputs.resign_tag != '' && github.ref_type == 'tag'))) ||
      (vars.UPDATE_SIGNING_ENABLED_STG == '1' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       inputs.server_url == 'https://stg.remote.noktabilisim.net' && inputs.resign_tag == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
    outputs:
      sha: ${{ steps.b.outputs.sha }}
    defaults:
      run:
        working-directory: apps/agent-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: bağımlılık denetimi + derleme (ağsız modül çözümü)
        id: b
        env:
          GOPROXY: "off"
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          deps="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/update-sign)"
          bad="$(printf '%s\n' "$deps" | grep -v '^$' | grep -v '^remote-support/agent-win/' || true)"
          [ -z "$bad" ] || { echo "::error::update-sign stdlib dışı bağımlılık içeriyor (T-2): $bad"; exit 1; }
          echo "stdlib dışı bağımlılıklar (yalnız kendi paketlerimiz):"; printf '%s\n' "$deps"
          go build -trimpath -ldflags "-s -w -buildid=" -o "$RUNNER_TEMP/signer/update-sign" ./cmd/update-sign
          sha="$(sha256sum "$RUNNER_TEMP/signer/update-sign" | cut -d' ' -f1)"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "update-sign sha256=$sha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-signer
          path: ${{ runner.temp }}/signer/update-sign
          if-no-files-found: error
          retention-days: 1

  update-manifest:
    name: "update-manifest (prod; agent-update-sign ortamı)"
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && vars.UPDATE_SIGNING_ENABLED == '1' &&
      needs.approve.result == 'success' && needs.update-signer.result == 'success' && needs.attest.result == 'success' &&
      needs.attest-linux.result == 'success' && needs.attest-mac.result == 'success'
    # r4 (K-P28f-r4-7): macOS zip'i (notarized ya da ad-hoc) her etikette var → update-client-macos-universal.json üretilir.
    needs: [update-signer, approve, reproducible, attest, reproducible-mac, attest-mac, reproducible-linux, attest-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: agent-update-sign
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      produced: ${{ steps.sign.outputs.produced }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/agent-win/build/update-keys
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: update-signer, path: signer }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.attest.outputs.artifact }}", path: win }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-linux, path: linux }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.attest-mac.outputs.artifact }}", path: mac }
      - name: girdiler (imzalayıcı SHA, açık anahtar, SHA256SUMS, son baytlar)
        id: in
        env:
          SIGNER_SHA: ${{ needs.update-signer.outputs.sha }}
          TAG: ${{ github.ref_name }}
          SERVIS_EXE: ${{ needs.reproducible.outputs.servis_exe }}
          LINUX_FILE: ${{ needs.reproducible-linux.outputs.file }}
          MAC_ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          MAC_ART: ${{ needs.attest-mac.outputs.artifact }}
          MAC_SIGNING: ${{ needs.attest-mac.outputs.signing }}
          REPRO_SIGNING: ${{ needs.reproducible-mac.outputs.signing }}
          APPLE_TEAM: ${{ vars.APPLE_TEAM_ID }}
          MIN_UPDATER: ${{ vars.UPDATE_MIN_UPDATER_VERSION || '0.22.0' }}
        run: |
          [ "$(sha256sum signer/update-sign | cut -d' ' -f1)" = "$SIGNER_SHA" ] || { echo "::error::update-sign SHA update-signer çıktısı değil"; exit 1; }
          chmod 0755 signer/update-sign
          pubf=apps/agent-win/build/update-keys/prod.pub
          [ -f "$pubf" ] || { echo "::error::$pubf yok — anahtar üretilmeden UPDATE_SIGNING_ENABLED=1 yapılmaz (runbook §31.2)"; exit 1; }
          keys="$(sed -e 's/\r$//' -e '/^[[:space:]]*#/d' "$pubf" | tr ',' '\n' | tr -d ' \t' | grep -v '^$' | paste -sd, -)"
          printf '%s' "$MIN_UPDATER" | grep -Eq '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$' || { echo "::error::UPDATE_MIN_UPDATER_VERSION x.y.z"; exit 1; }
          (cd win && sha256sum -c SHA256SUMS) && (cd linux && sha256sum -c SHA256SUMS)
          { echo "client windows amd64 win/NoktaDestek.exe"; echo "service windows amd64 win/$SERVIS_EXE"
            echo "client linux amd64 linux/$LINUX_FILE"; } > items.txt
          # r4 (S-r4-3): artifact ∈ {agent-mac-signed, agent-mac-adhoc}, dal tek kaynakla ve vars ile tutarlı.
          case "$MAC_ART:$MAC_SIGNING" in agent-mac-signed:notarized|agent-mac-adhoc:adhoc) ;; *) echo "::error::macOS artifact/dal tutarsız: $MAC_ART/$MAC_SIGNING"; exit 1 ;; esac
          [ "$MAC_SIGNING" = "$REPRO_SIGNING" ] || { echo "::error::attest-mac dalı reproducible-mac signing değil"; exit 1; }
          if [ -n "$APPLE_TEAM" ]; then w=notarized; else w=adhoc; fi
          [ "$MAC_SIGNING" = "$w" ] || { echo "::error::dal $MAC_SIGNING ama vars.APPLE_TEAM_ID ile beklenen $w"; exit 1; }
          [ "$MAC_ZIP" = "NoktaDestek-macOS-${TAG#v}.zip" ] || { echo "::error::macOS zip adı etiketle uyuşmuyor"; exit 1; }
          (cd mac && sha256sum -c SHA256SUMS) && echo "client macos universal mac/$MAC_ZIP" >> items.txt
          cat items.txt
          { echo "keys=$keys"; echo "version=${TAG#v}"; echo "min=$MIN_UPDATER"; } >> "$GITHUB_OUTPUT"
      - name: imzala (tohum yalnız bu adımda, yalnız stdin)
        id: sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          V: ${{ steps.in.outputs.version }}
          MIN: ${{ steps.in.outputs.min }}
          UENV: prod
        run: |
          set +x
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::agent-update-sign ortamında UPDATE_SIGNING_KEY yok — manifest üretilmedi, Release manifestsiz (AC-471)"
            echo "produced=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          raw="$(printf '%s' "$UPDATE_SIGNING_KEY" | tr -d ' \t\r\n')"
          echo "::add-mask::$raw"
          # S-P29-K-1: dolgulu/dolgusuz, std/url base64 tohum -> tüm varyantlar maskelenir ve taranır
          std="$(printf '%s' "$raw" | tr -- '-_' '+/' | tr -d '=')"
          case $(( ${#std} % 4 )) in 0) pad="$std" ;; 2) pad="$std==" ;; 3) pad="$std=" ;; *) pad="" ;; esac
          hex=""; [ -z "$pad" ] || hex="$(printf '%s' "$pad" | base64 -d 2>/dev/null | od -An -tx1 | tr -d ' \n')" || hex=""
          [ "${#hex}" -eq 64 ] || { raw=""; std=""; pad=""; hex=""; echo "::error::UPDATE_SIGNING_KEY 32 baytlık base64 tohum olarak çözülemedi (runbook §31.2)"; exit 1; }
          url="$(printf '%s' "$std" | tr '+/' '-_')"; urlpad="$(printf '%s' "$pad" | tr '+/' '-_')"
          HEX="$(printf '%s' "$hex" | tr 'a-f' 'A-F')"
          for m in "$std" "$pad" "$url" "$urlpad" "$hex" "$HEX"; do echo "::add-mask::$m"; done
          log="$RUNNER_TEMP/sign.log"; rc=0; mkdir -p out
          while read -r c p a f; do
            printf '%s' "$UPDATE_SIGNING_KEY" | signer/update-sign sign --key-stdin --env "$UENV" --platform "$p" --arch "$a" \
              --component "$c" --version "$V" --min-updater "$MIN" --file "$f" --out-dir out >>"$log" 2>&1 || rc=1
          done < items.txt
          leak=0; if grep -qiF -f <(printf '%s\n' "$raw" "$std" "$pad" "$url" "$urlpad" "$hex" | grep -v '^$') "$log"; then leak=1; fi
          raw=""; std=""; pad=""; url=""; urlpad=""; hex=""; HEX=""; unset UPDATE_SIGNING_KEY
          [ "$leak" = 0 ] || { rm -f "$log"; echo "::error::imza adımı çıktısında tohum biçimi bulundu (AC-471) — anahtarı döndürün (runbook §31.3)"; exit 1; }
          cat "$log"; rm -f "$log"
          [ "$rc" = 0 ] || { echo "::error::update-sign sign başarısız"; exit 1; }
          echo "produced=1" >> "$GITHUB_OUTPUT"
      - name: doğrula (repo açık anahtarları + ikili) + SHA256SUMS
        if: steps.sign.outputs.produced == '1'
        env:
          KEYS: ${{ steps.in.outputs.keys }}
        run: |
          while read -r c p a f; do
            signer/update-sign verify --pubkeys "$KEYS" --env prod --manifest "out/update-$c-$p-$a.json" --file "$f"
          done < items.txt
          [ "$(find out -name 'update-*.json' | wc -l)" = "$(wc -l < items.txt)" ] || { echo "::error::manifest sayısı ikili sayısıyla aynı değil"; exit 1; }
          (cd out && sha256sum update-*.json update-*.json.sig > SHA256SUMS && cat SHA256SUMS)
          { echo "### Güncelleme manifestleri (prod)"; echo '```'; for f in out/*.json; do cat "$f"; echo; done; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.sign.outputs.produced == '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/update-*.json
      - if: steps.sign.outputs.produced == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-update
          path: out/
          if-no-files-found: error
          retention-days: 1

  # Staging: main'de elle tetikleme + staging adresi (P13c). Artifact agent-update-stg -> publish-manifest.sh --stg-run <id>.
  update-manifest-stg:
    name: "update-manifest-stg (staging; agent-update-sign-stg ortamı)"
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.server_url == 'https://stg.remote.noktabilisim.net' && vars.UPDATE_SIGNING_ENABLED_STG == '1' &&
      needs.update-signer.result == 'success' && needs.attest.result == 'success' && needs.attest-linux.result == 'success'
    needs: [update-signer, reproducible, attest, reproducible-mac, package-mac, attest-mac, reproducible-linux, attest-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: agent-update-sign-stg
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/agent-win/build/update-keys
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: update-signer, path: signer }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-win-stg, path: win }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-linux-stg, path: linux }
      - if: needs.attest-mac.outputs.artifact == 'agent-mac-stg'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-mac-stg, path: mac }
      - name: ref/adres denetimi + girdiler
        id: in
        env:
          GIT_REF: ${{ github.ref }}
          IN_SERVER_URL: ${{ inputs.server_url }}
          SIGNER_SHA: ${{ needs.update-signer.outputs.sha }}
          WIN_ART: ${{ needs.reproducible.outputs.artifact }}
          LINUX_ART: ${{ needs.reproducible-linux.outputs.artifact }}
          EXE: ${{ needs.reproducible.outputs.exe }}
          SERVIS_EXE: ${{ needs.reproducible.outputs.servis_exe }}
          LINUX_FILE: ${{ needs.reproducible-linux.outputs.file }}
          MAC_ZIP: ${{ needs.reproducible-mac.outputs.zip }}
          MIN_UPDATER: ${{ vars.UPDATE_MIN_UPDATER_VERSION || '0.22.0' }}
        run: |
          [ "$GIT_REF" = refs/heads/main ] && [ "$IN_SERVER_URL" = "$STG_SERVER_URL" ] || { echo "::error::staging manifesti yalnız main + staging adresi"; exit 1; }
          [ "$WIN_ART" = agent-win-stg ] && [ "$LINUX_ART" = agent-linux-stg ] || { echo "::error::artifact staging değil ($WIN_ART/$LINUX_ART)"; exit 1; }
          [ "$(sha256sum signer/update-sign | cut -d' ' -f1)" = "$SIGNER_SHA" ] || { echo "::error::update-sign SHA uyuşmuyor"; exit 1; }
          chmod 0755 signer/update-sign
          pubf=apps/agent-win/build/update-keys/staging.pub
          [ -f "$pubf" ] || { echo "::error::$pubf yok (runbook §31.2)"; exit 1; }
          keys="$(sed -e 's/\r$//' -e '/^[[:space:]]*#/d' "$pubf" | tr ',' '\n' | tr -d ' \t' | grep -v '^$' | paste -sd, -)"
          [ "$(sed -n 1p win/build-meta.txt)" = "$STG_SERVER_URL" ] || { echo "::error::Windows build-meta staging adresi değil"; exit 1; }
          (cd win && sha256sum -c SHA256SUMS) && (cd linux && sha256sum -c SHA256SUMS)
          { echo "client windows amd64 win/$EXE"; echo "service windows amd64 win/$SERVIS_EXE"
            echo "client linux amd64 linux/$LINUX_FILE"; } > items.txt
          if [ -d mac ]; then (cd mac && sha256sum -c SHA256SUMS) && echo "client macos universal mac/$MAC_ZIP" >> items.txt; fi
          { echo "keys=$keys"; echo "version=$(sed -n 2p win/build-meta.txt)"; echo "min=$MIN_UPDATER"; } >> "$GITHUB_OUTPUT"
      - name: imzala (tohum yalnız bu adımda, yalnız stdin)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          V: ${{ steps.in.outputs.version }}
          MIN: ${{ steps.in.outputs.min }}
          UENV: staging
        run: |
          set +x
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::agent-update-sign-stg ortamında UPDATE_SIGNING_KEY yok (UPDATE_SIGNING_ENABLED_STG=1 iken zorunlu)"; exit 1; }
          raw="$(printf '%s' "$UPDATE_SIGNING_KEY" | tr -d ' \t\r\n')"
          echo "::add-mask::$raw"
          # S-P29-K-1: dolgulu/dolgusuz, std/url base64 tohum -> tüm varyantlar maskelenir ve taranır
          std="$(printf '%s' "$raw" | tr -- '-_' '+/' | tr -d '=')"
          case $(( ${#std} % 4 )) in 0) pad="$std" ;; 2) pad="$std==" ;; 3) pad="$std=" ;; *) pad="" ;; esac
          hex=""; [ -z "$pad" ] || hex="$(printf '%s' "$pad" | base64 -d 2>/dev/null | od -An -tx1 | tr -d ' \n')" || hex=""
          [ "${#hex}" -eq 64 ] || { raw=""; std=""; pad=""; hex=""; echo "::error::UPDATE_SIGNING_KEY 32 baytlık base64 tohum olarak çözülemedi (runbook §31.2)"; exit 1; }
          url="$(printf '%s' "$std" | tr '+/' '-_')"; urlpad="$(printf '%s' "$pad" | tr '+/' '-_')"
          HEX="$(printf '%s' "$hex" | tr 'a-f' 'A-F')"
          for m in "$std" "$pad" "$url" "$urlpad" "$hex" "$HEX"; do echo "::add-mask::$m"; done
          log="$RUNNER_TEMP/sign.log"; rc=0; mkdir -p out
          while read -r c p a f; do
            printf '%s' "$UPDATE_SIGNING_KEY" | signer/update-sign sign --key-stdin --env "$UENV" --platform "$p" --arch "$a" \
              --component "$c" --version "$V" --min-updater "$MIN" --file "$f" --out-dir out >>"$log" 2>&1 || rc=1
          done < items.txt
          leak=0; if grep -qiF -f <(printf '%s\n' "$raw" "$std" "$pad" "$url" "$urlpad" "$hex" | grep -v '^$') "$log"; then leak=1; fi
          raw=""; std=""; pad=""; url=""; urlpad=""; hex=""; HEX=""; unset UPDATE_SIGNING_KEY
          [ "$leak" = 0 ] || { rm -f "$log"; echo "::error::imza adımı çıktısında tohum biçimi bulundu (AC-471) — anahtarı döndürün (runbook §31.3)"; exit 1; }
          cat "$log"; rm -f "$log"
          [ "$rc" = 0 ] || { echo "::error::update-sign sign başarısız"; exit 1; }
      - name: doğrula + SHA256SUMS
        env:
          KEYS: ${{ steps.in.outputs.keys }}
        run: |
          while read -r c p a f; do
            signer/update-sign verify --pubkeys "$KEYS" --env staging --manifest "out/update-$c-$p-$a.json" --file "$f"
          done < items.txt
          (cd out && sha256sum update-*.json update-*.json.sig > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/update-*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-update-stg
          path: out/
          if-no-files-found: error
          retention-days: 30

  # Yeniden imza (§9.3, §14.2, §14.5 T-7): üç iş. (1) anahtarsız hazırlık: etiket doğrulanır, Release'in manifestleri indirilir ve
  # Node doğrulayıcısıyla (imza + kanonik; --now = issuedAt, süresi dolmuş olabilir) denetlenir. (2) anahtarlı imza
  # (`sign --from`, contents: read; yalnız issuedAt/expiresAt değişir). (3) anahtarsız yükleme (contents: write; --same-as + --clobber).
  update-resign-prep:
    name: "update-resign 1/3: hazırlık (anahtarsız)"
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.resign_tag != '' && vars.UPDATE_SIGNING_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/agent-win/build/update-keys
            deploy/agent/verify-manifest.mjs
          sparse-checkout-cone-mode: false
      - name: etiket + eski manifestler (imza doğrulamalı)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESIGN_TAG: ${{ inputs.resign_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          printf '%s' "$RESIGN_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::resign_tag vX.Y.Z olmalı"; exit 1; }
          [ "$REF_TYPE" = tag ] && [ "$REF_NAME" = "$RESIGN_TAG" ] || { echo "::error::koşu $RESIGN_TAG etiket ref'inde başlatılmalı (--ref $RESIGN_TAG)"; exit 1; }
          mkdir old
          gh release download "$RESIGN_TAG" --repo "$REPO" -p 'update-*.json' -p 'update-*.json.sig' -D old \
            || { echo "::error::$RESIGN_TAG Release'inde manifest yok (ilk imza yapılmamış — yeniden imza yerine yeni sürüm)"; exit 1; }
          for f in old/update-*.json; do
            (cd old && node "$GITHUB_WORKSPACE/deploy/agent/verify-manifest.mjs" \
              --pubkeys-file "$GITHUB_WORKSPACE/apps/agent-win/build/update-keys/prod.pub" --env prod --expect-name \
              --expect-version "${RESIGN_TAG#v}" --now "$(jq -r .issuedAt "$f")" "$(basename "$f")")
          done
          rm -f old/*.sig; ls -l old
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-resign-input
          path: old/
          if-no-files-found: error
          retention-days: 1

  update-resign:
    name: "update-resign 2/3: imza (agent-update-sign ortamı)"
    if: needs.update-resign-prep.result == 'success' && needs.update-signer.result == 'success'
    needs: [update-signer, update-resign-prep]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: agent-update-sign
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/agent-win/build/update-keys
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: update-signer, path: signer }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: update-resign-input, path: in }
      - name: girdiler
        id: in
        env:
          SIGNER_SHA: ${{ needs.update-signer.outputs.sha }}
        run: |
          [ "$(sha256sum signer/update-sign | cut -d' ' -f1)" = "$SIGNER_SHA" ] || { echo "::error::update-sign SHA uyuşmuyor"; exit 1; }
          chmod 0755 signer/update-sign
          keys="$(sed -e 's/\r$//' -e '/^[[:space:]]*#/d' apps/agent-win/build/update-keys/prod.pub | tr ',' '\n' | tr -d ' \t' | grep -v '^$' | paste -sd, -)"
          echo "keys=$keys" >> "$GITHUB_OUTPUT"; ls -l in
      - name: yeniden imzala (tohum yalnız bu adımda, yalnız stdin)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set +x
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::agent-update-sign ortamında UPDATE_SIGNING_KEY yok"; exit 1; }
          raw="$(printf '%s' "$UPDATE_SIGNING_KEY" | tr -d ' \t\r\n')"
          echo "::add-mask::$raw"
          # S-P29-K-1: dolgulu/dolgusuz, std/url base64 tohum -> tüm varyantlar maskelenir ve taranır
          std="$(printf '%s' "$raw" | tr -- '-_' '+/' | tr -d '=')"
          case $(( ${#std} % 4 )) in 0) pad="$std" ;; 2) pad="$std==" ;; 3) pad="$std=" ;; *) pad="" ;; esac
          hex=""; [ -z "$pad" ] || hex="$(printf '%s' "$pad" | base64 -d 2>/dev/null | od -An -tx1 | tr -d ' \n')" || hex=""
          [ "${#hex}" -eq 64 ] || { raw=""; std=""; pad=""; hex=""; echo "::error::UPDATE_SIGNING_KEY 32 baytlık base64 tohum olarak çözülemedi (runbook §31.2)"; exit 1; }
          url="$(printf '%s' "$std" | tr '+/' '-_')"; urlpad="$(printf '%s' "$pad" | tr '+/' '-_')"
          HEX="$(printf '%s' "$hex" | tr 'a-f' 'A-F')"
          for m in "$std" "$pad" "$url" "$urlpad" "$hex" "$HEX"; do echo "::add-mask::$m"; done
          log="$RUNNER_TEMP/sign.log"; rc=0; mkdir -p out
          for f in in/update-*.json; do
            printf '%s' "$UPDATE_SIGNING_KEY" | signer/update-sign sign --key-stdin --from "$f" --out-dir out >>"$log" 2>&1 || rc=1
          done
          leak=0; if grep -qiF -f <(printf '%s\n' "$raw" "$std" "$pad" "$url" "$urlpad" "$hex" | grep -v '^$') "$log"; then leak=1; fi
          raw=""; std=""; pad=""; url=""; urlpad=""; hex=""; HEX=""; unset UPDATE_SIGNING_KEY
          [ "$leak" = 0 ] || { rm -f "$log"; echo "::error::imza adımı çıktısında tohum biçimi bulundu (AC-471) — anahtarı döndürün (runbook §31.3)"; exit 1; }
          cat "$log"; rm -f "$log"
          [ "$rc" = 0 ] || { echo "::error::update-sign sign --from başarısız"; exit 1; }
      - name: doğrula
        env:
          KEYS: ${{ steps.in.outputs.keys }}
        run: for f in out/update-*.json; do signer/update-sign verify --pubkeys "$KEYS" --env prod --manifest "$f"; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/update-*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-update-resigned
          path: out/
          if-no-files-found: error
          retention-days: 1

  update-resign-upload:
    name: "update-resign 3/3: Release'e yükle (anahtarsız)"
    if: needs.update-resign.result == 'success'
    needs: [update-resign-prep, update-resign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/agent-win/build/update-keys
            deploy/agent/verify-manifest.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agent-update-resigned, path: out }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: update-resign-input, path: in }
      - name: Node doğrulama (--same-as eski) + SHA256SUMS + gh release upload --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESIGN_TAG: ${{ inputs.resign_tag }}
        run: |
          printf '%s' "$RESIGN_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::resign_tag"; exit 1; }
          V="$GITHUB_WORKSPACE/deploy/agent/verify-manifest.mjs"; K="$GITHUB_WORKSPACE/apps/agent-win/build/update-keys/prod.pub"
          [ "$(find out -name 'update-*.json' | wc -l)" = "$(find in -name 'update-*.json' | wc -l)" ] || { echo "::error::manifest sayısı farklı"; exit 1; }
          files=()
          for f in out/update-*.json; do
            n="$(basename "$f")"
            (cd out && node "$V" --pubkeys-file "$K" --env prod --expect-name --expect-version "${RESIGN_TAG#v}" --min-remaining-days 20 \
              --same-as "$GITHUB_WORKSPACE/in/$n" "$n")
            files+=("$f" "$f.sig")
          done
          mkdir rel && gh release download "$RESIGN_TAG" --repo "$REPO" -p SHA256SUMS -D rel
          awk '$2 !~ /^update-/' rel/SHA256SUMS > rel/SHA256SUMS.new
          (cd out && sha256sum update-*.json update-*.json.sig) >> rel/SHA256SUMS.new
          mv rel/SHA256SUMS.new rel/SHA256SUMS && cat rel/SHA256SUMS
          gh release upload "$RESIGN_TAG" "${files[@]}" rel/SHA256SUMS --repo "$REPO" --clobber
          { echo "### $RESIGN_TAG manifestleri yeniden imzalandı"; echo '```'; for f in out/update-*.json; do cat "$f"; echo; done; echo '```'
            echo "Sunucuya: deploy/agent/publish-manifest.sh --tag $RESIGN_TAG --ssh <hedef> (runbook §31.6)"; } >> "$GITHUB_STEP_SUMMARY"
