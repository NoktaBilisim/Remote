# Windows istemci (P6, ADR-0010, G-07, AC-94/96/128): kalite + tekrarlanabilir build + SHA256SUMS + attestation + Release.
# Release etiketi `vX.Y.Z` (AC-94 "korumalı v* etiketi"; tag ruleset + agent-release ortamı `v*`). Etiket = istemci sürümü
# (ldflags config.version). mimari-e11 §8'deki `agent-v0.11.0` yazımı AC-94 ile çelişir; geçerli olan `v0.11.0` (runbook §24).
# P17 AC-252: SignPath imzası koşullu (`vars.SIGNPATH_ORGANIZATION_ID` yoksa `sign` atlanır, imzasız akış aynen sürer).
# Etikette sıra (S-P17-2): reproducible → approve (agent-release, insan onayı) → sign (agent-sign) → attest → release.
# P27 K9 (mimari-p27 §8, §9 K9): ikinci ikili NoktaDestekServis.exe (./cmd/noktadestek-servis, aynı ldflags, manifest
# asInvoker) aynı build/reproducible/sign/attest/release zincirinden geçer; Release adı NoktaDestekServis-<sürüm>.exe.
# Hedef yalnız windows/amd64 (build.sh, vet, govulncheck, lisans); 386/arm64 derlenmez.
# G-18: Action'lar commit SHA ile sabit; varsayılan izin `contents: read`; yazma izinleri yalnız attest/release job'larında.
# Go adımları sabit digest'li resmi imajda koşar (yerel doğrulama komutuyla birebir aynı ortam, runbook §11).
# Go sürümü değişince (go.mod `toolchain`) GO_IMAGE de değişir; `check` job'u uyuşmazlıkta kırmızı olur.
name: agent-win
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # P13c (mimari-e11 §3.3, ADR-0021): staging exe. Yalnız bu iki değer kabul edilir (choice; betik ayrıca doğrular).
      # "yer-tutucu" = eski davranış (çözülmeyen adres). Staging adresi yalnız main dalında; çıktı Release'e GİTMEZ,
      # artifact `agent-win-stg` (NoktaDestek-stg-<sürüm>.exe + SHA256SUMS + build-meta), attestation üretilir.
      server_url:
        description: "Gömülecek sunucu adresi (staging yalnız main dalında)"
        type: choice
        options: ["yer-tutucu", "https://stg.remote.noktabilisim.net"]
        default: "yer-tutucu"
      version:
        description: "Staging exe sürümü x.y.z (MIN_AGENT_VERSION'dan düşük olmamalı)"
        type: string
        default: "0.0.0"
permissions:
  contents: read
concurrency:
  group: agent-win-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  GO_IMAGE: golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
  GO_VERSION: "1.26.11"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
  # Gerçek AGENT_SERVER_URL yalnız `push` (main dalı veya v* etiketi) derlemelerine gömülür (S6-4). PR (aynı repo dahil),
  # workflow_dispatch ve test-windows iz testi bu adresi kullanır: .invalid TLD çözülmez, exe hiçbir sunucuya bağlanamaz
  # (ldflags; config yalnız https://host[:port] kabul eder).
  PLACEHOLDER_SERVER_URL: https://destek.example.invalid:4450
  # P13c: elle tetiklemede gömülebilecek TEK gerçek adres (staging). Başka adres kabul edilmez (S6-4 korunur: main dalı =
  # incelenmiş kod; staging sunucusu prod verisine erişemez).
  STG_SERVER_URL: https://stg.remote.noktabilisim.net

jobs:
  check:
    name: gofmt + vet + test -race + govulncheck + lisans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
    defaults:
      run:
        working-directory: apps/agent-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: toolchain go.mod ile aynı mı
        run: |
          want="go$(sed -n 's/^toolchain go//p' go.mod)"
          test "$(go env GOVERSION)" = "$want" || { echo "::error::imaj $(go env GOVERSION), go.mod $want — GO_IMAGE'i güncelleyin"; exit 1; }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: windows/amd64 vet
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: araçlar (sürüm sabit; sum.golang.org doğrular)
        run: |
          GOFLAGS='' go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOFLAGS='' go install github.com/google/go-licenses/v2@v2.0.1
          GOFLAGS='' go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      # PT-K16: go.mod değişmez (araç modül dışı, @sürüm sabit). `GOOS=windows go run …` aracı windows exe olarak derler ve
      # linux'ta koşamaz; bu yüzden araç host için bir kez kurulur, hedef GOOS ile paket yüklemesi seçilir. Uyarı 0 olmalı.
      - name: staticcheck (linux + windows/amd64)
        run: |
          staticcheck ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 staticcheck ./...
      - name: govulncheck (windows/amd64 + linux; erişilebilir zafiyet 0)
        run: |
          GOOS=windows GOARCH=amd64 govulncheck ./...
          govulncheck ./...
      - name: lisans (AGPL/GPL/bilinmeyen yasak)
        run: GOOS=windows GOARCH=amd64 go-licenses check ./... --ignore remote-support/agent-win --disallowed_types=forbidden,restricted,unknown

  test-windows:
    name: go test (Windows)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/agent-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - run: go test -count=1 ./...
      # P17 QA Tur 1 / devops 1: AC-248/249 testleri günlükte PASS/SKIP olarak görünür koşar. WGC duman testi (gerçek kare
      # alımının tek otomatik kanıtı) SKIP olursa uyarı basılır; iş kırmızı olmaz (runner oturumu WGC desteklemeyebilir,
      # kanıt o durumda Windows VM elle turundan gelir — runbook §24).
      - name: AC-248/249 testleri (-v, SKIP görünür)
        shell: bash
        run: |
          go test -count=1 -v -run 'TestAC248|TestAC249' ./internal/... | tee "$RUNNER_TEMP/ac248-249.txt"
          if grep -q -- '--- SKIP: TestAC248WGCWindowSmoke' "$RUNNER_TEMP/ac248-249.txt"; then
            echo "::warning::TestAC248WGCWindowSmoke SKIP: WGC gerçek kare kanıtı bu koşuda YOK (Windows VM elle turu gerekli)"
          fi
          grep -q -- '--- PASS: TestAC248WGCWindowSmoke' "$RUNNER_TEMP/ac248-249.txt" || grep -q -- '--- SKIP: TestAC248WGCWindowSmoke' "$RUNNER_TEMP/ac248-249.txt" \
            || { echo "::error::TestAC248WGCWindowSmoke koşmadı (ad değişti mi?)"; exit 1; }
          if grep -- '--- SKIP: TestAC249' "$RUNNER_TEMP/ac248-249.txt"; then
            echo "::warning::AC-249 testlerinden SKIP olan var (yukarıdaki satırlar)"
          fi
      # P20 K7 (mimari-e11 §8d.8/§8d.9; G-P20-1/14 tanılaması): runner'ın gerçek ACL'leri ve süreç bütünlük düzeyi günlüğe
      # yazılır. Runner yönetici + yükseltilmiş belirteçle koşar; autorun testleri yükseltilmiş süreç reddini (Enable) değil
      # Inspect + Evaluate kararını sınar. Gerçek C:\ fikstürü kırmızıysa önce bu çıktı varsayılan Windows ACL'iyle karşılaştırılır.
      - name: ACL tanılama (icacls C:\, profil, İndirilenler, Public; bütünlük düzeyi)
        shell: pwsh
        run: |
          whoami /groups | Select-String 'Mandatory Label'
          $dl = Join-Path $env:USERPROFILE 'Downloads'
          foreach ($p in 'C:\', 'C:\Users', $env:USERPROFILE, $dl, 'C:\Users\Public') {
            if (Test-Path -LiteralPath $p) { icacls $p } else { Write-Output "(yok) $p" }
          }
      # P20 K7 (AC-253/254; G-P20-1/2/14/16): autorun + remember (+ tray) Windows testleri günlükte PASS/SKIP olarak görünür.
      # ZORUNLU testler bu runner'da gerçekten koşmalı (PASS); SKIP veya hiç koşmaması = kırmızı (ad sözleşmesi:
      # docs/implementation.md "P20 K7"). Gerçek HKCU Run testi geçici `NoktaDestekTest-<rastgele>` adıyla yazar ve siler;
      # tepsi duman testi etkileşimsiz oturumda koşmaz (elle test, runbook §24.9) — diğer SKIP'ler uyarıdır.
      - name: AC-253/254 testleri (-v; HKCU Run, icacls Users:M reddi, gerçek C:\ ACL, 2 süreç × 100 tur kilit)
        shell: bash
        run: |
          out="$RUNNER_TEMP/ac253-254.txt"
          go test -count=1 -v -run 'TestAC253|TestAC254' ./internal/... | tee "$out"
          bad=0
          for t in TestAC253WindowsRegistryRoundTrip TestAC253WindowsUsersModifyFolderRejected TestAC253WindowsRealCDriveACL TestAC254GP2016TwoProcessesNoLostUpdate; do
            if grep -q -- "--- PASS: $t (" "$out"; then continue; fi
            if grep -q -- "--- SKIP: $t (" "$out"; then
              echo "::error::$t SKIP: bu kanıt yalnız Windows CI'dan gelir, SKIP kabul edilmez"
            else
              echo "::error::$t koşmadı (ad değişti mi? sözleşme: docs/implementation.md P20 K7)"
            fi
            bad=1
          done
          if grep -- '--- SKIP: TestAC25[34]' "$out"; then
            echo "::warning::AC-253/254 testlerinden SKIP olan var (yukarıdaki satırlar; tepsi duman testi elle turda)"
          fi
          exit "$bad"
      - name: HKCU Run'da test değeri kalmadı
        shell: pwsh
        run: |
          $k = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
          $left = @((Get-Item -LiteralPath $k).GetValueNames() | Where-Object { $_ -like 'NoktaDestek*' })
          if ($left.Count -gt 0) {
            Write-Output "::error::testler HKCU Run'da değer bıraktı: $($left -join ', ')"
            foreach ($n in $left) { Remove-ItemProperty -LiteralPath $k -Name $n }
            exit 1
          }
          Write-Output 'HKCU Run temiz (NoktaDestek* değer yok)'
      # AC-108 / P6 DoD "trace-check.ps1 temiz": yer tutucu adresli exe (gerçek sunucuya istek atmaz) dosya adından kodla
      # açılır → resolve ağ hatası → kod penceresi → WM_CLOSE ile kapatılır → önce/sonra farkı. Dosya aktarımı ve oturum
      # akışı burada yok; tam senaryo Windows VM elle testinde (runbook §11.8).
      - name: iz testi için exe dizini
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'trace') | Out-Null
      - name: iz testi için exe (yer tutucu adres)
        shell: bash
        run: build/build.sh "$PLACEHOLDER_SERVER_URL" 0.0.0 "$RUNNER_TEMP/trace/Destek-12345678.exe"
      - name: trace-check (AC-108)
        shell: pwsh
        run: |
          $dir  = Join-Path $env:RUNNER_TEMP 'trace'
          $exe  = Join-Path $dir 'Destek-12345678.exe'
          $snap = Join-Path $dir 'once.json'
          ./test/trace-check.ps1 -Mode Snapshot -SnapshotPath $snap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle   # çıkış kodunu okuyabilmek için
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) {
            Write-Output "istemci kendiliğinden kapandı, çıkış kodu $($p.ExitCode)"
          } else {
            Write-Output "istemci açık: pencere='$($p.MainWindowTitle)' handle=$($p.MainWindowHandle)"
            [void]$p.CloseMainWindow()
            if ($p.WaitForExit(15000)) {
              Write-Output "WM_CLOSE ile kapandı, çıkış kodu $($p.ExitCode)"
            } else {
              Write-Output "::warning::istemci WM_CLOSE ile kapanmadı (masaüstü penceresi yok?); zorla sonlandırıldı"
              Stop-Process -Id $p.Id -Force
              [void]$p.WaitForExit(10000)
            }
          }
          Start-Sleep -Seconds 2
          ./test/trace-check.ps1 -Mode Compare -SnapshotPath $snap -ExePath $exe
          exit $LASTEXITCODE
      # P20 K7 (AC-253/254, mimari-e11 §8d.3/§8d.9): trace-check `-Tray`/`-Autostart` kuralları gerçek Windows'ta sınanır.
      # İstemcinin tepsi + Windows açılışı izi (kayitlar.bin, kayitlar.lock, HKCU Run `NoktaDestek` = "<exe>" --tray) elle
      # oluşturulur, beklenen çıkış kodları denetlenir, "Bu bilgisayarı unut" sonrası (hepsi silinmiş) temiz olmalı.
      # Tepsi/Run'ı istemcinin kendisinin yazması UI ister → elle iz testi (runbook §24.9). Değerler finally'de silinir.
      - name: trace-check -Tray/-Autostart öz testi (P20)
        shell: pwsh
        run: |
          $dir   = Join-Path $env:RUNNER_TEMP 'trace'
          $exe   = Join-Path $dir 'Destek-12345678.exe'
          $snap  = Join-Path $dir 'once-p20.json'
          $store = Join-Path $env:LOCALAPPDATA 'NoktaDestek'
          $runK  = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
          $tc    = Join-Path $PWD 'test/trace-check.ps1'
          if (Test-Path -LiteralPath $store) { Write-Output "::error::$store öz testten önce var (kod modu iz bıraktı?)"; exit 1 }
          if ($null -ne (Get-ItemProperty -LiteralPath $runK -Name NoktaDestek -ErrorAction SilentlyContinue)) {
            Write-Output "::error::HKCU Run NoktaDestek öz testten önce var"; exit 1
          }
          pwsh -NoProfile -File $tc -Mode Snapshot -SnapshotPath $snap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $script:bad = 0
          function Expect([int]$want, [string]$label, [string[]]$tcArgs) {
            Write-Output "--- $label (beklenen çıkış $want)"
            pwsh -NoProfile -File $tc -Mode Compare -SnapshotPath $snap -ExePath $exe @tcArgs
            if ($LASTEXITCODE -ne $want) { Write-Output "::error::$label — çıkış $LASTEXITCODE, beklenen $want"; $script:bad++ }
          }
          $cmd = '"' + [IO.Path]::GetFullPath($exe) + '" --tray'
          try {
            New-Item -ItemType Directory -Path $store | Out-Null
            Set-Content -LiteralPath (Join-Path $store 'kayitlar.bin') -Value 'x'
            Set-Content -LiteralPath (Join-Path $store 'kayitlar.lock') -Value ''
            New-ItemProperty -LiteralPath $runK -Name NoktaDestek -PropertyType String -Value $cmd | Out-Null
            Expect 0 'tepsi + Windows açılışı açık: yalnız kayitlar.bin/lock + Run' @('-Binding', 'on', '-Tray', 'on', '-Autostart', 'on')
            Expect 1 'Run değeri -Autostart off iken iz' @('-Binding', 'on', '-Tray', 'on')
            Expect 2 '-Autostart on tepsisiz = kullanım hatası' @('-Binding', 'on', '-Autostart', 'on')
            Remove-ItemProperty -LiteralPath $runK -Name NoktaDestek
            New-ItemProperty -LiteralPath $runK -Name NoktaDestek -PropertyType ExpandString -Value $cmd | Out-Null
            Expect 1 'REG_EXPAND_SZ Run değeri reddi (G-P20-6)' @('-Binding', 'on', '-Tray', 'on', '-Autostart', 'on')
            Remove-ItemProperty -LiteralPath $runK -Name NoktaDestek
            Expect 1 '-Autostart on ama Run değeri yok' @('-Binding', 'on', '-Tray', 'on', '-Autostart', 'on')
            Expect 0 'tepsi açık, Windows açılışı kapalı' @('-Binding', 'on', '-Tray', 'on')
            Set-Content -LiteralPath (Join-Path $store 'hatirla.bin') -Value 'x'
            Expect 1 'tepside hatirla.bin kalmış (göç silmeli)' @('-Binding', 'on', '-Tray', 'on')
            Expect 0 '-Binding on: 0.11 + 0.12 dosyası birlikte izinli (uyarı)' @('-Binding', 'on')
            Remove-Item -LiteralPath $store -Recurse -Force
            Expect 0 'Bu bilgisayarı unut sonrası temiz' @()
            New-Item -ItemType Directory -Path $store | Out-Null
            Set-Content -LiteralPath (Join-Path $store 'kayitlar.lock') -Value ''
            Expect 1 'unut sonrası kayitlar.lock kalmış' @()
          } finally {
            Remove-ItemProperty -LiteralPath $runK -Name NoktaDestek -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $store -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($script:bad -gt 0) { exit 1 }
          Write-Output 'trace-check P20 öz testi: tüm beklenen çıkış kodları tuttu'
          exit 0 # son Expect'in bilerek 1 dönen $LASTEXITCODE'u adımı düşürmesin
      # P27 K9 (mimari-p27 §5.3, AC-289/340, D-P27-2): trace-check `-Servis` kuralları gerçek Windows'ta sınanır. Gerçek kurulum
      # sunucuda kayıt kodu ister (elle test, runbook §27.7); burada kurulumun bıraktığı iz (hizmet, HKLM, Run, Uninstall, olay
      # kaynağı, Program Files + ProgramData korumalı DACL) yer tutucu adresli servis ikilisiyle elle kurulur, beklenen çıkış
      # kodları denetlenir, hepsi silinince -Servis off temiz olmalı. Hizmet BAŞLATILMAZ. Runner yöneticidir.
      - name: iz testi için servis exe (yer tutucu adres)
        shell: bash
        run: build/build.sh "$PLACEHOLDER_SERVER_URL" 0.0.0 "$RUNNER_TEMP/trace/NoktaDestekServis.exe" noktadestek-servis
      - name: trace-check -Servis öz testi (P27)
        shell: pwsh
        run: |
          $tc   = Join-Path $PWD 'test/trace-check.ps1'
          $snap = Join-Path $env:RUNNER_TEMP 'trace/once-p27.json'
          $pfd  = Join-Path $env:ProgramFiles 'NoktaDestek Servis'
          $exe  = Join-Path $pfd 'NoktaDestekServis.exe'
          $pd   = Join-Path $env:ProgramData 'NoktaDestek Servis'
          $gel  = Join-Path $pd 'Gelen'
          $run  = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
          $un   = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\NoktaDestekServis'
          $ev   = 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\NoktaDestek'
          $hk   = 'HKLM:\SOFTWARE\NoktaDestek'
          $kc   = Join-Path $env:SystemRoot 'Temp\NoktaDestekServis-kaldir-0000000000000000'
          foreach ($x in $pfd, $pd, $un, $ev, $hk, $kc) { if (Test-Path -LiteralPath $x) { Write-Output "::error::$x öz testten önce var"; exit 1 } }
          pwsh -NoProfile -File $tc -Mode Snapshot -SnapshotPath $snap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $script:bad = 0
          function Expect([int]$want, [string]$label, [string[]]$tcArgs) {
            Write-Output "--- $label (beklenen çıkış $want)"
            pwsh -NoProfile -File $tc -Mode Compare -SnapshotPath $snap @tcArgs
            if ($LASTEXITCODE -ne $want) { Write-Output "::error::$label — çıkış $LASTEXITCODE, beklenen $want"; $script:bad++ }
          }
          function SetSddl([string]$p, [string]$sddl) {
            $a = Get-Acl -LiteralPath $p; $a.SetSecurityDescriptorSddlForm($sddl); Set-Acl -LiteralPath $p -AclObject $a
          }
          $q = '"' + $exe + '"'
          try {
            New-Item -ItemType Directory -Path $pfd | Out-Null
            Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'trace/NoktaDestekServis.exe') -Destination $exe
            New-Item -ItemType Directory -Path $pd, $gel | Out-Null
            SetSddl $pd 'O:BAD:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)'
            SetSddl $gel 'O:BAD:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)(A;OICI;0x1200a9;;;AU)'
            Set-Content -LiteralPath (Join-Path $pd 'device.key') -Value 'x'
            New-Item -Path "$hk\Servis" -Force | Out-Null
            New-ItemProperty -LiteralPath $run -Name NoktaDestekServis -PropertyType String -Value "$q --tray" | Out-Null
            New-Item -Path $un -Force | Out-Null
            New-Item -Path $ev -Force | Out-Null
            New-Service -Name NoktaDestekServis -BinaryPathName "$q --service" -StartupType Manual | Out-Null
            Expect 0 'kurulu servis izi (izinli küme + ACL)' @('-Servis', 'on')
            Expect 1 'kurulu servis -Servis off iken iz' @()
            Set-Content -LiteralPath (Join-Path $pd 'device.key.tmp') -Value 'x'
            Expect 1 'device.key.tmp kalmış' @('-Servis', 'on')
            Remove-Item -LiteralPath (Join-Path $pd 'device.key.tmp')
            SetSddl $gel 'O:BAD:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)(A;OICI;0x1200a9;;;AU)(A;OICI;0x1301bf;;;BU)'
            Expect 1 'Gelen\ Users yazma ACE (folder_acl)' @('-Servis', 'on')
            SetSddl $gel 'O:BAD:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)(A;OICI;0x1200a9;;;AU)'
            SetSddl $pd 'O:BAD:AI(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)'
            Expect 1 'ProgramData klasörü DACL korumasız' @('-Servis', 'on')
            SetSddl $pd 'O:BAD:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)'
            & sc.exe config NoktaDestekServis binPath= "$exe --service" | Out-Null
            Expect 1 'ImagePath tırnaksız (D-P27-2)' @('-Servis', 'on')
            & sc.exe config NoktaDestekServis binPath= "$q --service" | Out-Null
            Expect 0 'düzeltilmiş kurulum yine temiz' @('-Servis', 'on')
            & sc.exe delete NoktaDestekServis | Out-Null
            Remove-ItemProperty -LiteralPath $run -Name NoktaDestekServis
            Remove-Item -LiteralPath $hk, $ev -Recurse -Force
            Remove-Item -LiteralPath $pfd, $pd -Recurse -Force
            Expect 1 'kaldırma sonrası Uninstall anahtarı kalmış' @()
            Remove-Item -LiteralPath $un -Recurse -Force
            Expect 0 'kaldırma sonrası temiz (-Servis off)' @()
            # D-P27-K5: kaldırma kopyası klasörü yeniden başlatma kaydı yoksa iz, kayıtlıysa UYARI (çıkış 0).
            New-Item -ItemType Directory -Path $kc | Out-Null
            Expect 1 'kaldırma kopyası kalmış (yeniden başlatma kaydı yok)' @()
            Add-Type -Namespace P27 -Name K5 -MemberDefinition '[DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] public static extern bool MoveFileEx(string a, string b, int f);'
            if (-not [P27.K5]::MoveFileEx($kc, $null, 4)) { Write-Output '::error::MoveFileEx DELAY_UNTIL_REBOOT'; $script:bad++ }
            Expect 0 'kaldırma kopyası yeniden başlatmada silinecek (UYARI)' @()
            Remove-Item -LiteralPath $kc -Force
          } finally {
            & sc.exe delete NoktaDestekServis 2>$null | Out-Null
            Remove-ItemProperty -LiteralPath $run -Name NoktaDestekServis -ErrorAction SilentlyContinue
            foreach ($x in $hk, $ev, $un, $pfd, $pd, $kc) { Remove-Item -LiteralPath $x -Recurse -Force -ErrorAction SilentlyContinue }
          }
          if ($script:bad -gt 0) { exit 1 }
          Write-Output 'trace-check P27 -Servis öz testi: tüm beklenen çıkış kodları tuttu'
          exit 0

  build:
    name: build ${{ matrix.n }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        n: [1, 2]
    container:
      image: golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: sürüm + sunucu adresi
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VAR_SERVER_URL: ${{ vars.AGENT_SERVER_URL }}
          GIT_REF: ${{ github.ref }}
          IN_SERVER_URL: ${{ inputs.server_url }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ] && [ "$EVENT" != push ]; then
            echo "::error::etiket derlemesi yalnız etiket push'unda (elle tetiklemede Release exe'si üretilmez)"; exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::etiket vX.Y.Z olmalı"; exit 1; }
            version="${REF_NAME#v}"
            [ -n "$VAR_SERVER_URL" ] || { echo "::error::Release için repo değişkeni AGENT_SERVER_URL gerekli"; exit 1; }
          else
            version=0.0.0
          fi
          # S6-4: incelenmemiş kod (PR, elle tetikleme) gerçek adrese bağlanan exe üretmez.
          server="$PLACEHOLDER_SERVER_URL"
          if [ "$EVENT" = push ] && [ -n "$VAR_SERVER_URL" ]; then server="$VAR_SERVER_URL"; fi
          # P13c: elle tetikleme + staging adresi -> yalnız main dalı, yalnız STG_SERVER_URL, sürüm x.y.z.
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$IN_SERVER_URL" ] && [ "$IN_SERVER_URL" != yer-tutucu ]; then
            [ "$IN_SERVER_URL" = "$STG_SERVER_URL" ] || { echo "::error::server_url yalnız $STG_SERVER_URL olabilir"; exit 1; }
            [ "$GIT_REF" = refs/heads/main ] || { echo "::error::staging exe yalnız main dalından ($GIT_REF)"; exit 1; }
            printf '%s' "$IN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version x.y.z olmalı"; exit 1; }
            server="$STG_SERVER_URL"; version="$IN_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
      - name: build/build.sh
        env:
          SERVER: ${{ steps.meta.outputs.server }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Konteyner root, çalışma alanı runner kullanıcısının: VCS damgası için git güvenli dizin (build.sh değişmez).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          apps/agent-win/build/build.sh "$SERVER" "$VERSION" "$RUNNER_TEMP/out/NoktaDestek.exe"
          # P27 K9: gözetimsiz erişim servis ikilisi (aynı sunucu adresi + sürüm).
          apps/agent-win/build/build.sh "$SERVER" "$VERSION" "$RUNNER_TEMP/out/NoktaDestekServis.exe" noktadestek-servis
          printf '%s\n%s\n' "$SERVER" "$VERSION" > "$RUNNER_TEMP/out/build-meta.txt"
          sha256sum "$RUNNER_TEMP/out/NoktaDestek.exe" "$RUNNER_TEMP/out/NoktaDestekServis.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-win-build-${{ matrix.n }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  reproducible:
    name: tekrarlanabilirlik + SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
      exe: ${{ steps.name.outputs.exe }}
      servis_exe: ${{ steps.name.outputs.servis_exe }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: agent-win-build-*, path: builds }
      - name: iki build aynı SHA-256 + boyut/packer kontrolü (NoktaDestek.exe + NoktaDestekServis.exe)
        run: |
          for e in NoktaDestek.exe NoktaDestekServis.exe; do
            a=$(sha256sum "builds/agent-win-build-1/$e" | cut -d' ' -f1)
            b=$(sha256sum "builds/agent-win-build-2/$e" | cut -d' ' -f1)
            echo "$e build1=$a"; echo "$e build2=$b"
            [ "$a" = "$b" ] || { echo "::error::$e tekrarlanabilir build başarısız: SHA-256 farklı"; exit 1; }
            f="builds/agent-win-build-1/$e"
            size=$(stat -c %s "$f"); echo "$e boyut=$size"
            [ "$size" -le 41943040 ] || { echo "::error::$e 40 MB'ı aşıyor (AC-96)"; exit 1; }
            [ "$(head -c2 "$f")" = MZ ] || { echo "::error::$e PE değil"; exit 1; }
            if grep -aq 'UPX!' "$f"; then echo "::error::$e UPX/packer izi (ADR-0010)"; exit 1; fi
            # P27 K9: servis ikilisi yükseltme istemez (kurulum UAC runas ile; manifest asInvoker).
            grep -aq 'requestedExecutionLevel level="asInvoker"' "$f" || { echo "::error::$e manifest asInvoker değil"; exit 1; }
          done
      - name: artifact adı (P13c — staging adresli derleme ayrı ad, Release'e gitmez)
        id: name
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          meta=builds/agent-win-build-1/build-meta.txt
          ver="$(sed -n 2p "$meta")"
          if [ "$(sed -n 1p "$meta")" = "$STG_SERVER_URL" ]; then
            exe="NoktaDestek-stg-$ver.exe"; sexe="NoktaDestekServis-stg-$ver.exe"; artifact=agent-win-stg
          elif [ "$REF_TYPE" = tag ]; then
            # P27 K9 (mimari-p27 §9 K9): Release'te servis ikilisi sürümlü ad taşır; NoktaDestek.exe adı değişmez (Caddy yolu).
            exe=NoktaDestek.exe; sexe="NoktaDestekServis-$ver.exe"; artifact=agent-win
          else
            exe=NoktaDestek.exe; sexe=NoktaDestekServis.exe; artifact=agent-win
          fi
          printf '%s' "$exe" | grep -Eq '^NoktaDestek(-stg-[0-9]+\.[0-9]+\.[0-9]+)?\.exe$' || { echo "::error::exe adı $exe"; exit 1; }
          printf '%s' "$sexe" | grep -Eq '^NoktaDestekServis(-stg)?(-[0-9]+\.[0-9]+\.[0-9]+)?\.exe$' || { echo "::error::servis exe adı $sexe"; exit 1; }
          mkdir dist && cp builds/agent-win-build-1/NoktaDestek.exe "dist/$exe" && cp "$meta" dist/
          cp builds/agent-win-build-1/NoktaDestekServis.exe "dist/$sexe"
          (cd dist && sha256sum "$exe" "$sexe" > SHA256SUMS && cat SHA256SUMS)
          { echo "### $exe + $sexe ($artifact)"; echo '```'; cat dist/SHA256SUMS; cat dist/build-meta.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo "exe=$exe"; echo "servis_exe=$sexe"; echo "artifact=$artifact"; } >> "$GITHUB_OUTPUT"
      - name: onaylayan için kontrol listesi (yalnız etiket; S17-2, S-P17-3)
        # Onay beklenirken koşu sayfasında görünsün diye onay işinden ÖNCE yazılır. Kutular bilerek boş: kontrol kanıtı
        # değildir; onaylayan maddeleri kontrol edip sonucu onay yorumuna yazar (runbook §24.4).
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          {
            echo "### Yayın ön koşulu (S17-2) — onay vermeden önce kontrol edin (runbook §24.1)"
            echo "- [ ] İstemcinin gerektirdiği sunucu paketi prod'da (0.11.0 → P15)"
            echo "- [ ] Aynı commit'ten staging exe ile duman testi GEÇTİ (runbook §24.2)"
            echo "- [ ] qa GEÇTİ, güvenlik Kritik/Yüksek 0; bekleyen eski etiket koşusu yok"
            echo
            echo "Biri eksikse agent-release onayında **Reject**. Onay yorumuna P15 prod commit'ini yazın."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  approve:
    name: "ONAY: sunucu ön koşulu prod'da mı (runbook §24.1) — onaydan sonra imza + Release"
    # S17-2 (mimari-e11 §8, bağlayıcı): istemcinin gerektirdiği sunucu paketi (0.11.0 için P15) prod'da değilse ONAYLAMAYIN;
    # "Reject" edin. Eski sunucu `share.state`'i strictObject ile doğrular, yeni alanlar reddedilir.
    # S-P17-2: tek insan kapısı bu iştir ve imzalamadan (sign), attestation'dan ve Release'ten ÖNCE gelir: Reject edilen
    # etiket için imzalı ikili hiç üretilmez. Ortam onayı (required reviewers, deployment tags `v*`) repo ayarında
    # (runbook §11.1). Kontrol listesi `reproducible` işinin özetindedir.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.check.result == 'success' &&
      needs.test-windows.result == 'success' && needs.reproducible.result == 'success'
    needs: [check, test-windows, reproducible]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: agent-release
    permissions:
      contents: read
    steps:
      - name: sürüm artışı (yeni etiket > en yüksek Release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Sürüm geriye gidemez: yeni etiket mevcut en yüksek Release sürümünden büyük olmalı (karışık sürüm ve
          # MIN_AGENT_VERSION / kabul kodu eşiği yanlış istemciye uygulanmasın). Rollback yeni etiketle değil §11.4 ile.
          # İmzadan önce denetlenir: reddedilecek sürüm imzalanmaz.
          tags=$(gh release list --repo "$REPO" --limit 100 --exclude-drafts --json tagName --jq '.[].tagName')
          top=$(printf '%s\n' "$tags" | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -n "$top" ]; then
            hi=$(printf '%s\n%s\n' "$top" "${TAG#v}" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            [ "$hi" = "${TAG#v}" ] && [ "$top" != "${TAG#v}" ] || { echo "::error::$TAG mevcut en yüksek Release v$top'tan büyük değil"; exit 1; }
          fi
          echo "onaylandı: $TAG (onaylayan ve yorum: Environments → agent-release → deployment geçmişi)" >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: SignPath imzası + signtool verify (AC-252; hesap yoksa atlanır)
    # AC-252 (mimari-e11 §8.1): yalnız Release etiketi push'unda, agent-release ONAYINDAN SONRA ve repo değişkeni
    # SIGNPATH_ORGANIZATION_ID tanımlıysa. Değişken yoksa iş "skipped" olur; attest/release imzasız ikiliyle sürer
    # (ADR-0010), AC-252 "uygulanamaz" kapanır.
    # S-P17-2: `SIGNPATH_API_TOKEN` yalnız `agent-sign` ORTAM secret'ıdır (deployment policy yalnız `v*` etiketi); dal
    # push'unda değiştirilmiş bir iş akışı bu ortama giremez, token'ı okuyamaz. SignPath politikası ayrıca kökeni
    # (refs/tags/v*, bu iş akışı dosyası) doğrular (runbook §24.3).
    # İmzalı ikili tekrarlanabilir DEĞİLDİR (imza eklenir); tekrarlanabilirlik imzasız ikilide (`reproducible`) kanıtlanır,
    # imzasız SHA-256 Release notunda yazılır. SHA256SUMS ve attestation İMZALI ikiliden üretilir (runbook §24.3).
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != '' &&
      needs.approve.result == 'success'
    needs: [reproducible, approve]
    runs-on: windows-2025
    timeout-minutes: 30
    environment: agent-sign
    permissions:
      contents: read
      actions: read # SignPath bağlayıcısı bu koşunun iş/artifact bilgisini github.token ile okur
    outputs:
      artifact: ${{ steps.out.outputs.artifact }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.reproducible.outputs.artifact }}", path: unsigned }
      - name: ön kontrol (yapılandırma + imzasız SHA256SUMS)
        shell: bash
        env:
          ART: ${{ needs.reproducible.outputs.artifact }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          [ "$ART" = agent-win ] || { echo "::error::yalnız Release artifact'i (agent-win) imzalanır (bulunan: $ART)"; exit 1; }
          [ -n "$PROJECT" ] && [ -n "$POLICY" ] || { echo "::error::SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG repo değişkeni eksik"; exit 1; }
          [ "$TOKEN_SET" = true ] || { echo "::error::SIGNPATH_API_TOKEN agent-sign ortam secret'ı eksik (runbook §24.3)"; exit 1; }
          cd unsigned && sha256sum -c SHA256SUMS
      - id: up
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-win-unsigned
          # P27 K9: iki PE tek artifact'te; SignPath artifact yapılandırması ikisini de imzalar (runbook §24.3 / §27.6).
          path: |
            unsigned/NoktaDestek.exe
            unsigned/${{ needs.reproducible.outputs.servis_exe }}
          if-no-files-found: error
          retention-days: 1
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.up.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: signtool verify /pa (Authenticode zinciri + zaman damgası)
        shell: pwsh
        env:
          SERVIS_EXE: ${{ needs.reproducible.outputs.servis_exe }}
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { Write-Output "::error::signtool.exe bulunamadı (Windows SDK)"; exit 1 }
          foreach ($n in @('NoktaDestek.exe', $env:SERVIS_EXE)) {
            $exe = Join-Path $PWD "signed/$n"
            if (-not (Test-Path $exe)) { Write-Output "::error::SignPath çıktısında $n yok"; exit 1 }
            & $st.FullName verify /pa /tw /v $exe
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::$n signtool verify /pa başarısız"; exit 1 }
            $sig = Get-AuthenticodeSignature -FilePath $exe
            if ($sig.Status -ne 'Valid') { Write-Output "::error::$n Authenticode durumu $($sig.Status)"; exit 1 }
            Write-Output "$n imzalayan: $($sig.SignerCertificate.Subject)"
          }
      - name: SHA256SUMS (imzalı ikiliden) + boyut/packer kontrolü
        id: out
        shell: bash
        env:
          SERVIS_EXE: ${{ needs.reproducible.outputs.servis_exe }}
        run: |
          mkdir dist && cp unsigned/build-meta.txt dist/
          for e in NoktaDestek.exe "$SERVIS_EXE"; do
            f="signed/$e"
            size=$(stat -c %s "$f"); echo "$e boyut=$size"
            [ "$size" -le 41943040 ] || { echo "::error::imzalı $e 40 MB'ı aşıyor (AC-96)"; exit 1; }
            [ "$(head -c2 "$f")" = MZ ] || { echo "::error::$e PE değil"; exit 1; }
            if grep -aq 'UPX!' "$f"; then echo "::error::$e UPX/packer izi (ADR-0010)"; exit 1; fi
            cp "$f" "dist/$e"
          done
          # İmzasız (tekrarlanabilir) özetler: satır biçimi "<sha>  <ad>" (iki ikili).
          cp unsigned/SHA256SUMS dist/unsigned-sha256.txt
          (cd dist && sha256sum NoktaDestek.exe "$SERVIS_EXE" > SHA256SUMS && cat SHA256SUMS)
          { echo "### NoktaDestek.exe + $SERVIS_EXE (imzalı, agent-win-signed)"; echo '```'; cat dist/SHA256SUMS
            echo "imzasız (tekrarlanabilir) SHA-256:"; cat dist/unsigned-sha256.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "artifact=agent-win-signed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-win-signed
          path: dist/
          if-no-files-found: error
          # S-P17-2: imzalı kopya yalnız hemen ardından koşan release işi için; kalıcı kopya Release'tedir.
          retention-days: 1

  attest:
    name: build provenance attestation
    # Fork PR'larında id-token yok; yalnız main/etiket push'u ve elle tetikleme. GitHub, attestation'ı private
    # repoda yalnız Enterprise Cloud'da destekler (runbook §11.6). AC-252: `sign` koştuysa imzalı ikili, atlandıysa
    # imzasız ikili attest edilir; `sign` başarısızsa attest (ve Release) koşmaz (fail-closed). Etikette yalnız
    # agent-release onayından sonra (Reject edilen etiket attest edilmez; onaysızken `sign` de "skipped" görünür).
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.reproducible.result == 'success' &&
      (github.ref_type != 'tag' || needs.approve.result == 'success') &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    needs: [reproducible, approve, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.pick.outputs.artifact }}
    steps:
      - name: attest edilecek artifact
        id: pick
        env:
          SIGNED: ${{ needs.sign.outputs.artifact }}
          PLAIN: ${{ needs.reproducible.outputs.artifact }}
        run: echo "artifact=${SIGNED:-$PLAIN}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ steps.pick.outputs.artifact }}", path: dist }
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # P27 K9: iki ikili de (istemci + servis) attest edilir; `signed` modda sunucu listesi bu SHA'lardan yazılır.
        with:
          subject-path: |
            dist/${{ needs.reproducible.outputs.exe }}
            dist/${{ needs.reproducible.outputs.servis_exe }}

  release:
    name: GitHub Release (korumalı v* etiketi; agent-release onayından sonra)
    # İnsan kapısı `approve` işidir (S17-2, S-P17-2); bu iş yalnız onaylanmış + (imzalanmış) + attest edilmiş ikiliyi yayımlar.
    # Ayrı ortam onayı yok (ikinci onay aynı kişiye aynı soruyu sorardı). Etiket yalnız yöneticilerce itilebilir (ruleset).
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.approve.result == 'success' &&
      needs.attest.result == 'success'
    needs: [reproducible, approve, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.attest.outputs.artifact }}", path: dist }
      - name: Release oluştur (exe + SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ART: ${{ needs.attest.outputs.artifact }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SERVIS_EXE: ${{ needs.reproducible.outputs.servis_exe }}
        run: |
          case "$ART" in agent-win|agent-win-signed) ;; *) echo "::error::Release artifact'i $ART olamaz"; exit 1 ;; esac
          # AC-252: SignPath yapılandırılmışsa imzasız ikili Release'e gitmez.
          [ -z "$SIGNPATH_ORG" ] || [ "$ART" = agent-win-signed ] || { echo "::error::SignPath tanımlı ama ikili imzasız"; exit 1; }
          cd dist && sha256sum -c SHA256SUMS
          server=$(sed -n 1p build-meta.txt)
          if [ "$ART" = agent-win-signed ]; then
            sig="Authenticode imzalı (SignPath, AC-252). İmzasız tekrarlanabilir derlemelerin SHA-256'sı: $(tr '\n' ' ' < unsigned-sha256.txt)"
          else
            sig="imzasız (ADR-0010)"
          fi
          {
            echo "Nokta Destek Windows istemcisi ve gözetimsiz erişim servisi ($SERVIS_EXE) $TAG ($sig). Sunucu: $server"
            echo
            echo '```'; cat SHA256SUMS; echo '```'
            echo
            echo "Doğrulama: \`sha256sum -c SHA256SUMS\` ve her ikili için \`gh attestation verify <NoktaDestek.exe|$SERVIS_EXE> --repo $REPO --signer-workflow $REPO/.github/workflows/agent-win.yml --source-ref refs/tags/$TAG\`"
          } > notes.md
          gh release create "$TAG" NoktaDestek.exe "$SERVIS_EXE" SHA256SUMS --repo "$REPO" --verify-tag --title "Nokta Destek $TAG" --notes-file notes.md
