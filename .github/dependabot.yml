# G-18: bağımlılık güncellemeleri haftalık PR (npm, gomod — apps/agent-win, Actions, Docker).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/server, /apps/web]
    schedule: { interval: weekly }
  # P28b K6 (R-P28b-3): compose imajları (clamav/clamav digest dahil). clamav PR'ında runbook §28b.6 "imaj güncelleme" adımları
  # (K0 yanıt dizeleri + K6 kapı 1/3/5) koşulmadan birleştirilmez.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /apps/agent-win
    schedule: { interval: weekly }
    groups:
      go-minor-patch: { update-types: [minor, patch] }
