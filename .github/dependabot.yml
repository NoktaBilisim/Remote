# G-18: bağımlılık güncellemeleri haftalık PR (npm, gomod — apps/agent-win, Actions, Docker).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/server, /apps/web]
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /apps/agent-win
    schedule: { interval: weekly }
    groups:
      go-minor-patch: { update-types: [minor, patch] }
