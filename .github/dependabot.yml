# G-18: bağımlılık güncellemeleri haftalık PR (npm, gomod — apps/agent-win, Actions, Docker).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    # P28g K8a: Linux GUI test imajları (Dockerfile.2204/2404 taban digest'i; Go sürümü GO_IMAGE'dan gelir, burada izlenmez).
    directories: [/apps/server, /apps/web, /apps/agent-win/test/linux]
    schedule: { interval: weekly }
  # P28b K6 (R-P28b-3): compose imajları (clamav/clamav digest dahil). clamav PR'ında runbook §28b.6 "imaj güncelleme" adımları
  # (K0 yanıt dizeleri + K6 kapı 1/3/5) koşulmadan birleştirilmez.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
  # P28d K4 (mimari-p28d §11, §14 O-PD-4; runbook §28d.11): github.com/tetratelabs/wazero gruptan hariç → her sürümü AYRI PR.
  # Otomatik birleştirme yok (repo'da auto-merge yapılandırması yoktur; eklenmez). wazero PR'ı el ile incelenir ve birleştirmeden
  # önce runbook §28d.11 "wazero güncelleme" adımları koşulur: FuzzDecode ≥ 30 dk (amd64 derleyici yolu, 0 tuzak),
  # TestP28dK0sCompilerMatchesInterpreter, -race; arm64 JIT bulgusu (K0s-2) yeni sürümde yeniden denenir. libopus (wasm) ve
  # wasi-sdk imajı Dependabot'a görünmez — elle izlenir (runbook §28d.11).
  - package-ecosystem: gomod
    directory: /apps/agent-win
    schedule: { interval: weekly }
    groups:
      go-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["github.com/tetratelabs/wazero"]
