# P28b (mimari-p28b §7.1 r2, ADR-0032; K0 değerleri docs/implementation.md "P28b K0"). `clamav` servisine salt okunur bağlanır.
# clamd yalnız `av` iç ağında (çıkış yok), imza DB'si salt okunur; imajın /init'i KULLANILMAZ (komut compose'da).
# Bu dosyadaki sınırlar sunucu modu tavanı 256 MiB (K-P28b-12) ve bellek değişmezi ile bağlıdır:
#   mem_limit (3g) ≥ imza DB tepe (~1,1 GiB) + /scratch tmpfs (1536m) + pay 0,4 GiB. Bir değer değişirse mimari §7.1 değişmezi
#   yeniden hesaplanır ve runbook §28b güncellenir.

Foreground yes
LogTime yes
LogClean no
# LogFile YOK: Foreground'da log konteyner çıktısına gider (docker logs). Dosya adı/içerik loglanmaz (yalnız imza adı + "stream").

# Yalnız TCP. TCPAddr YAZILMAZ: Alpine'de `localhost` önce ::1'e çözülür; TCPAddr 0.0.0.0 verilirse imajın clamdcheck.sh
# healthcheck'i düşer (K0). İzolasyon ağla sağlanır (port yayımlanmaz, `av` internal). LocalSocket YOK (yalnız /init bekliyordu).
TCPSocket 3310
User clamav

DatabaseDirectory /var/lib/clamav
# INSTREAM akışı ve arşiv açılımları buraya DÜZ METİN yazılır -> boyutu sınırlı tmpfs (compose /scratch, 1536m; O-P28b-3).
TemporaryDirectory /scratch

# Sınırlar (r2): 256 MiB ürün tavanı + pay. Aşımlar AlertExceedsMax ile bulgu olur (sessizce "temiz" sayılmaz).
# K6 kapı 5 / D-r2-2 DEĞİŞMEZİ: tarama başına StreamMaxLength + MaxScanSize ≤ /scratch / 2 (1536m / 2 = 768M).
# Neden: /scratch dolarsa (ENOSPC) libclamav arşiv üyesini "cli_unzip: failed to write" ile ATLAR ve dosyanın geri kalanı
# temizse `stream: OK` döner (K6'da ölçüldü: içinde EICAR olan 150 MiB'lık iç zip, 64m /scratch -> OK = fail-open). Sınırlar
# yarının altındayken AlertExceedsMax tmpfs dolmadan devreye girer (ölçekli test: LIMIT/FOUND, ENOSPC yok; iki eşzamanlı
# tarama dahil). Bu yüzden akış/dosya sınırı mimarideki 260M yerine tam ürün tavanı 256M (= FSRV_MAX_BYTES; tam 256 MiB dosya
# K6'da `stream: OK`), MaxScanSize 512M kalır: 256 + 512 = 768M. (MaxScanSize'ı düşürmek 250 MiB'lık stored zip'i — dış + üyeler
# ≈ 500 MiB — LIMIT yapıyordu.) /scratch küçülürse bu değerler de yarının altına iner (runbook §28b.1).
StreamMaxLength 256M
MaxFileSize 256M
MaxScanSize 512M
# İstemcinin 60 sn bütçesinden önce clamd kendisi Heuristics.Limits.Exceeded.MaxScanTime döner (scan.ts -> TIMEOUT).
MaxScanTime 55000
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
HeuristicAlerts yes
# PCREMaxFileSize varsayılan (100M) bırakıldı: kabul edilen kalan risk R-P28b-7.

# İmza yenileme: freshclam ayrı konteynerde (clamav-update) yazar, NotifyClamd yok. clamd DB dizinini SelfCheck ile en geç
# 10 dk'da bir denetler ve yeniden yükler. ConcurrentDatabaseReload no -> yükleme sırasında bellek iki katına çıkmaz
# (bu ~8 sn'lik pencerede komut kabul edilmez; scan.ts bağlantı aşamasında yeniden dener, K-P28b-23).
SelfCheck 600
ConcurrentDatabaseReload no

# Sunucu eşzamanlılığı 2 tarama + test/yoklama payı.
MaxThreads 4
MaxQueue 20
ReadTimeout 120
CommandReadTimeout 30
IdleTimeout 60
