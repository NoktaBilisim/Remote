# P28b (mimari-p28b §7.1 r2, ADR-0032). `clamav-update` servisine salt okunur bağlanır. freshclam yalnız `av_egress`
# ağındadır (internete çıkar, clamd'ye ve server'a yolu YOK); imza DB'sinin (volume clamav_db) TEK yazanıdır.
# Kontrol sayısı burada DEĞİL komut satırında: `--checks=6` (günde 6; AC-361 "günde ≥ 1" + pay). FRESHCLAM_CHECKS env'i
# yalnız imajın /init'inde okunur; /init kullanılmadığı için yazılmaz (K0).

Foreground yes
LogTime yes
# UpdateLogFile YOK: komut `--stdout` ile konteyner çıktısına yazar (docker logs).

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Yeni indirilen DB yayına alınmadan önce belleğe yüklenip doğrulanır (compose mem_limit 1536m bu yüzden).
TestDatabases yes
# NotifyClamd YAZILMAZ: clamav-update `av` ağında değil; clamd yeni DB'yi SelfCheck 600 ile kendisi görür.
