# Remote Support — tek sunucu yığını (dev + staging). Ayrıntı: docs/runbook.md, mimari §8.
# Kullanım:  cd deploy && cp ../.env.example .env && (değerleri doldur) && docker compose up -d
# Değişkenler deploy/.env'den okunur (git-ignore). Her servise yalnız ihtiyaç duyduğu değişkenler
# açıkça verilir (env_file yok): server MIGRATE_DATABASE_URL / root parolasını göremez (G-15).
name: remote

x-node: &node
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    # P11: binlog (8.4 varsayılanı) açık kalır; --log-bin-trust-function-creators=1 olmadan SUPER'siz `migrator`
    # audit_logs tetikleyicilerini oluşturamaz (ERROR 1419). SUPER vermek yerine bu bayrak seçildi; 8.4'te değişken
    # deprecated (SET ile 1287 uyarısı, açılışta uyarı yok). Ayrıntı docs/db-notlari.md "P11". `--sysdate-is-now` EKLEMEYİN
    # (audit DELETE tetikleyicisi SYSDATE'e dayanır).
    command: ["--default-time-zone=+00:00", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD gerekli}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE gerekli}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD gerekli}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD gerekli}
      # P13a yedek kullanıcısı ('backup'@'localhost', SELECT/SHOW VIEW/TRIGGER): yeni kurulumda 01-users.sh, mevcut
      # kurulumda deploy/mysql/backup-user.sql oluşturur; yedek betiği mysqldump'ı bu env ile konteyner içinde çalıştırır.
      # Boşsa kullanıcı oluşturulmaz (yedek alınamaz). Yalnız bu servise verilir; server/migrate görmez.
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD:-}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [db]
    # Port yayımlanmaz: MySQL yalnız `db` ağından (internal) erişilir.
    healthcheck:
      # Soket üzerinden; init aşamasındaki geçici sunucu (yalnız soket) da yanıt verir, bu yüzden
      # TCP (127.0.0.1) ile kontrol edilir -> init bitip asıl sunucu açılınca sağlıklı olur.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  migrate:
    build: { context: .., dockerfile: apps/server/Dockerfile, target: migrate }
    image: remote-migrate:${IMAGE_TAG:-local}
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      MIGRATE_DATABASE_URL: mysql://migrator:${MYSQL_MIGRATOR_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    networks: [db]
    depends_on:
      mysql: { condition: service_healthy }
    logging: *logging

  # İlk kurulumda bir kez:  docker compose --profile setup run --rm seed
  seed:
    image: remote-migrate:${IMAGE_TAG:-local}
    profiles: [setup]
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["pnpm", "--filter", "@remote/server", "db:seed"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-}
    networks: [db]
    depends_on:
      migrate: { condition: service_completed_successfully }

  server:
    <<: *node
    build: { context: .., dockerfile: apps/server/Dockerfile, target: runtime }
    image: remote-server:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL gerekli}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${PUBLIC_BASE_URL}}
      DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true
      # G-11: güvenilen proxy'ler = caddy (172.30.0.2) + web (172.30.0.3; müşteri sayfası resolve'u
      # Caddy'nin XFF'ini iletir). /31 tam bu iki adresi kapsar; edge'in dinamik aralığı (.128/25) dışında.
      TRUSTED_PROXY_CIDR: 172.30.0.2/31
      # sessionRef HMAC anahtarı; compose'da zorunlu (boşsa her restart'ta eski bağlantılar 404 olur)
      SESSION_REF_KEY: ${SESSION_REF_KEY:?SESSION_REF_KEY gerekli (openssl rand -base64 48)}
      # TURN (ADR-0007, mimari §8.1/§8.3.1): coturn deploy/turn'de ayrı compose; secret iki tarafta aynı.
      TURN_URLS: ${TURN_URLS:?TURN_URLS gerekli (runbook §9)}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET gerekli (openssl rand -hex 32; coturn ile aynı)}
      TURN_CRED_TTL_MIN: ${TURN_CRED_TTL_MIN:-20}  # S-P3-6: env.ts ile aynı varsayılan
      # /metrics Bearer (Caddy dışarıya kapatır; iç scrape). Boşsa server davranışı env.ts'e göre.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # AC-125/S-P4-1: misafir "Kötüye kullanımı bildir" adresi. Tanımsız veya boş olabilir: env.ts boş dizeyi tanımsız
      # sayar (withoutBlanks) → production'da bağlantı gizlenir. Dolu ama geçersiz adres server'ı açtırmaz (runbook §3).
      ABUSE_EMAIL:
      # P6 (mimari §8.1, G-07): Windows istemcisi. AGENT_SHA256'yı deploy/agent/verify-and-publish.sh attestation +
      # SHA256SUMS doğrulamasından sonra yazar; boşsa veya dosya hash'i uyuşmazsa indirme ucu 503 (fail-closed).
      AGENT_BINARY_PATH: /data/downloads/NoktaDestek.exe
      AGENT_SHA256: ${AGENT_SHA256:-}
      # P8b (mimari-e9 §6/§8/§13.5): whatsapp-bildirim servisi (sistem düzeyi; tenant değiştiremez). deploy/.env'den gelir
      # (ör. http://<whatsapp-servis>:3000); yerleşik varsayılan YOK (G-P13b-2): boşsa ve panel kaydı yoksa kanal kapalı.
      # production'da http:// + özel olmayan adres → kanal KAPALI başlar (fail-closed, log `alarm:"whatsapp_insecure"`);
      # prod ön koşulu K13: TLS veya özel ağ (runbook §12).
      WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-}
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY:-}
      # P8b G-E9-4 (mimari-e9 §13.4): asgari Windows istemci sürümü (x.y.z). Boş = kontrol yok; düşük sürüm 426
      # CLIENT_OUTDATED. Güvenlik yamasında yamalı sürüme yükseltilir (runbook §12).
      MIN_AGENT_VERSION:
      # P10 (mimari §3.2/§8.1): *_enc alanlarının AES-256-GCM anahtarları `v1:<base64 32B>[,v2:...]`. production'da
      # zorunlu (env.ts); kaybolursa kayıtlı SMTP şifreleri ve TOTP sırları çözülemez (runbook §3, §14).
      APP_ENCRYPTION_KEYS: ${APP_ENCRYPTION_KEYS:?APP_ENCRYPTION_KEYS gerekli (openssl rand -base64 32 → v1:<deger>)}
      # P12 (AC-81..84): logo/avatar yükleme kökü; dosyalar {tenantId|system}/{rastgele}.{png|jpg|webp}. Server
      # `GET /api/v1/files/{logo,system-logo,avatar}/...` uçlarıyla sunar (Caddy statik sunmaz, volume Caddy'ye bağlanmaz).
      UPLOADS_DIR: /data/uploads
    volumes:
      - agent_downloads:/data/downloads:ro
      # Kök fs salt okunur; yazılabilir kalıcı tek dizin. İzin imajdan gelir (node:node 0700, apps/server/Dockerfile).
      - uploads:/data/uploads
    networks: [edge, db]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  web:
    <<: *node
    build: { context: .., dockerfile: apps/web/Dockerfile, target: runtime }
    image: remote-web:${IMAGE_TAG:-local}
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL gerekli}
      API_INTERNAL_URL: http://server:3001
      # S-P2-1: Caddy'nin web isteklerine yazdığı X-Edge-Auth sırrı; eşleşmezse web XFF iletmez
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?EDGE_PROXY_SECRET gerekli (openssl rand -base64 32)}
    # Sabit adres: server TRUSTED_PROXY_CIDR (172.30.0.2/31) bu adresi güvenilen proxy sayar (G-11).
    # Port yayımlanmaz; web'e yalnız Caddy ulaşır, XFF'i Caddy yeniden yazar.
    networks:
      edge: { ipv4_address: 172.30.0.3 }
    depends_on:
      server: { condition: service_healthy }

  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?EDGE_PROXY_SECRET gerekli (openssl rand -base64 32)}
    ports:
      # 4450 (tls internal, IP ile tanı girişi). PROD: CADDY_BIND=127.0.0.1 (mimari-p13 §7.2/7.9) -> yalnız sunucudan
      # tanı amaçlı erişilir; Docker yayımladığı portta UFW'yi atlar, kapatan kontrol UFW değil bu değerdir (G-P13b-9;
      # kanıt: ss -tlnp | grep 4450 yalnız 127.0.0.1). Boşsa 0.0.0.0 (yalnız staging/yerel geçmiş davranışı).
      - "${CADDY_BIND:-0.0.0.0}:4450:4450/tcp"
      # Host nginx (TLS, remote.noktabilisim.net) -> düz HTTP; YALNIZ loopback (ADR-0015). Caddy bu dinleyicide
      # yalnız edge ağ geçidinden (172.30.0.128, userland-proxy) gelen XFF'e güvenir. 0.0.0.0'a AÇILMAZ.
      - "127.0.0.1:4451:4451/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # P6: /downloads/{NoktaDestek,Destek-<kod>}.exe → tek jenerik ikili (Caddyfile @agentExe)
      - agent_downloads:/srv/downloads:ro
    networks:
      edge: { ipv4_address: 172.30.0.2 }
    depends_on:
      server: { condition: service_healthy }
      web: { condition: service_healthy }
    logging: *logging

networks:
  # edge: YALNIZ caddy, web, server. Bu ağa yeni servis EKLENMEZ (S-P2-1: server web'i güvenilen proxy
  # sayar; edge'deki her konteyner web:3000/server:3001'e doğrudan ulaşır). Yeni servis -> ayrı ağ.
  edge:
    ipam:
      # Dinamik adresler .128/25'ten dağıtılır; sabit adresler (caddy .2, web .3) ile çakışmaz.
      config: [{ subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25 }]
  db:
    internal: true

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  # P6: Windows istemcisi (NoktaDestek.exe); yalnız verify-and-publish yazar, server ve caddy salt okunur bağlar.
  agent_downloads:
  # P12: logo/avatar dosyaları (yalnız server yazar/okur). Yedek: runbook §16.3 (DB dökümüyle aynı anda alınır).
  uploads:
