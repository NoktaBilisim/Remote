# Remote Support — tek sunucu yığını (dev + staging). Ayrıntı: docs/runbook.md, mimari §8.
# Kullanım:  cd deploy && cp ../.env.example .env && (değerleri doldur) && docker compose up -d
# Değişkenler deploy/.env'den okunur (git-ignore). Her servise yalnız ihtiyaç duyduğu değişkenler
# açıkça verilir (env_file yok): server MIGRATE_DATABASE_URL / root parolasını göremez (G-15).
# P13c (mimari-e11 §3.1-3.2, ADR-0019 m.5): aynı sunucuda ikinci yığın (staging, /opt/remote-stg) için yerleşim değerleri
# env'den gelir; VARSAYILANLAR PROD DEĞERLERİDİR (prod .env'e yeni satır gerekmez, `docker compose config` çıktısı aynı).
# Staging .env: COMPOSE_PROJECT_NAME=remote-stg (bu `name:`'i ezer -> volume/ağ/konteyner adları remote-stg_*),
# COMPOSE_FILE=docker-compose.yml:docker-compose.staging.yml (Caddy staging katmanı), EDGE_* / CADDY_*_PORT (runbook §21).
name: remote

x-node: &node
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    # P11: binlog (8.4 varsayılanı) açık kalır; --log-bin-trust-function-creators=1 olmadan SUPER'siz `migrator`
    # audit_logs tetikleyicilerini oluşturamaz (ERROR 1419). SUPER vermek yerine bu bayrak seçildi; 8.4'te değişken
    # deprecated (SET ile 1287 uyarısı, açılışta uyarı yok). Ayrıntı docs/db-notlari.md "P11". `--sysdate-is-now` EKLEMEYİN
    # (audit DELETE tetikleyicisi SYSDATE'e dayanır).
    command: ["--default-time-zone=+00:00", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD gerekli}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE gerekli}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD gerekli}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD gerekli}
      # P13a yedek kullanıcısı ('backup'@'localhost', SELECT/SHOW VIEW/TRIGGER): yeni kurulumda 01-users.sh, mevcut
      # kurulumda deploy/mysql/backup-user.sql oluşturur; yedek betiği mysqldump'ı bu env ile konteyner içinde çalıştırır.
      # Boşsa kullanıcı oluşturulmaz (yedek alınamaz). Yalnız bu servise verilir; server/migrate görmez.
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD:-}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [db]
    # Port yayımlanmaz: MySQL yalnız `db` ağından (internal) erişilir.
    healthcheck:
      # Soket üzerinden; init aşamasındaki geçici sunucu (yalnız soket) da yanıt verir, bu yüzden
      # TCP (127.0.0.1) ile kontrol edilir -> init bitip asıl sunucu açılınca sağlıklı olur.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  migrate:
    build: { context: .., dockerfile: apps/server/Dockerfile, target: migrate }
    image: remote-migrate:${IMAGE_TAG:-local}
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      MIGRATE_DATABASE_URL: mysql://migrator:${MYSQL_MIGRATOR_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # APP_ENCRYPTION_KEYS burada TANIMLANMAZ (S-P18-K3): `cli crypto:rewrap` için yalnız tek seferlik
      # `docker compose run --rm -e APP_ENCRYPTION_KEYS migrate …` ile verilir (runbook §25.5).
    # P16 (ADR-0030 m.9): `cli erasure:replay|verify` imha defterini okur (salt okunur; yazan yalnız server). runbook §23.5
    volumes:
      - ledger:/var/lib/remote:ro
    networks: [db]
    depends_on:
      mysql: { condition: service_healthy }
    logging: *logging

  # İlk kurulumda bir kez:  docker compose --profile setup run --rm seed
  seed:
    image: remote-migrate:${IMAGE_TAG:-local}
    profiles: [setup]
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["pnpm", "--filter", "@remote/server", "db:seed"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-}
    networks: [db]
    depends_on:
      migrate: { condition: service_completed_successfully }

  server:
    <<: *node
    build: { context: .., dockerfile: apps/server/Dockerfile, target: runtime }
    image: remote-server:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL gerekli}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${PUBLIC_BASE_URL}}
      DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true
      # G-11: güvenilen proxy'ler = caddy (172.30.0.2) + web (172.30.0.3; müşteri sayfası resolve'u
      # Caddy'nin XFF'ini iletir). /31 tam bu iki adresi kapsar; edge'in dinamik aralığı (.128/25) dışında.
      # P13c: EDGE_CADDY_IP/EDGE_WEB_IP değişirse bu da değişir (staging 172.30.1.2/31). .env'deki TRUSTED_PROXY_CIDR
      # (compose dışı yerel çalıştırma) burada KULLANILMAZ; ayrı ad, prod .env'deki eski bir değer edge'i bozmasın diye.
      TRUSTED_PROXY_CIDR: ${EDGE_TRUSTED_PROXY_CIDR:-172.30.0.2/31}
      # sessionRef HMAC anahtarı; compose'da zorunlu (boşsa her restart'ta eski bağlantılar 404 olur)
      SESSION_REF_KEY: ${SESSION_REF_KEY:?SESSION_REF_KEY gerekli (openssl rand -base64 48)}
      # TURN (ADR-0007, mimari §8.1/§8.3.1): coturn deploy/turn'de ayrı compose; secret iki tarafta aynı.
      TURN_URLS: ${TURN_URLS:?TURN_URLS gerekli (runbook §9)}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET gerekli (openssl rand -hex 32; coturn ile aynı)}
      TURN_CRED_TTL_MIN: ${TURN_CRED_TTL_MIN:-20}  # S-P3-6: env.ts ile aynı varsayılan
      # /metrics Bearer (Caddy dışarıya kapatır; iç scrape). Boşsa server davranışı env.ts'e göre.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # AC-125/S-P4-1: misafir "Kötüye kullanımı bildir" adresi. Tanımsız veya boş olabilir: env.ts boş dizeyi tanımsız
      # sayar (withoutBlanks) → production'da bağlantı gizlenir. Dolu ama geçersiz adres server'ı açtırmaz (runbook §3).
      ABUSE_EMAIL:
      # P6 (mimari §8.1, G-07): Windows istemcisi. AGENT_SHA256'yı deploy/agent/verify-and-publish.sh attestation +
      # SHA256SUMS doğrulamasından sonra yazar; boşsa veya dosya hash'i uyuşmazsa indirme ucu 503 (fail-closed).
      AGENT_BINARY_PATH: /data/downloads/NoktaDestek.exe
      AGENT_SHA256: ${AGENT_SHA256:-}
      # P28f (mimari-p28f §8.1, S-P28f-3): macOS istemcisi zip'i — aynı agent_downloads volume'u (Caddy agent_zip_file
      # /srv/downloads/NoktaDestek-macOS.zip sunar). Yol sabit (production'da env.ts başka değeri reddeder). SHA'yı yayın
      # betiği attestation + SHA256SUMS doğrulamasından sonra yazar; boşsa/uyuşmazsa macOS indirmesi 503, availability macos:false.
      MAC_AGENT_PATH: /data/downloads/NoktaDestek-macOS.zip
      MAC_AGENT_SHA256: ${MAC_AGENT_SHA256:-}
      # P28f-r4 (K-P28f-r4-2): imza türü adhoc|notarized; publish-mac.sh MAC_AGENT_SHA256 ile birlikte yazar (elle değil).
      MAC_AGENT_SIGNING: ${MAC_AGENT_SIGNING:-}
      # P28g (mimari-p28g §8.1, S-P28g-12): Linux ELF'i — aynı volume (Caddy agent_bin_file /srv/downloads/NoktaDestek-linux).
      # Yol sabit (production'da env.ts başka değeri reddeder). SHA'yı deploy/agent/publish-linux.sh attestation + SHA256SUMS
      # doğrulamasından sonra yazar; boşsa/uyuşmazsa Linux indirmesi 503, availability linux:false.
      LINUX_AGENT_PATH: /data/downloads/NoktaDestek-linux
      LINUX_AGENT_SHA256: ${LINUX_AGENT_SHA256:-}
      # P29 (mimari-p29 §9.1, K-P29-5; runbook §31): imzalı güncelleme manifestleri — aynı agent_downloads volume'unun update/ alt
      # klasörü (salt okunur; Caddy `handle /downloads/*` 404 bu alt yolu da kapatır, public sunulmaz). Yol sabit; yalnız açık anahtar
      # tanımlıyken verilir: anahtarsız .env'de güncelleme kapalı kalır ve env.ts "DIR dolu → PUBKEYS zorunlu" kuralı server'ı
      # durdurmaz. PUBKEYS = ortamın build/update-keys/<env>.pub değerleri (virgüllü ≤ 2, base64url; gizli değil).
      UPDATE_MANIFEST_DIR: ${UPDATE_MANIFEST_PUBKEYS:+/data/downloads/update}
      UPDATE_MANIFEST_PUBKEYS: ${UPDATE_MANIFEST_PUBKEYS:-}
      # P8b (mimari-e9 §6/§8/§13.5): whatsapp-bildirim servisi (sistem düzeyi; tenant değiştiremez). deploy/.env'den gelir
      # (ör. http://<whatsapp-servis>:3000); yerleşik varsayılan YOK (G-P13b-2): boşsa ve panel kaydı yoksa kanal kapalı.
      # production'da http:// + özel olmayan adres → kanal KAPALI başlar (fail-closed, log `alarm:"whatsapp_insecure"`);
      # prod ön koşulu K13: TLS veya özel ağ (runbook §12).
      WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-}
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY:-}
      WHATSAPP_ALLOW_INSECURE_HTTP: ${WHATSAPP_ALLOW_INSECURE_HTTP:-}
      # P19 (mimari-e11 §8c.3/§8c.4): smsportal sistem varsayılanı (firma `sms_url` boşsa). Boş = varsayılan yok. Guard'sız
      # güvenilen adres (devops); production'da http:// + özel olmayan host → SMS kanalı kapalı. Değişimi runbook §26.3.
      SMSPORTAL_URL: ${SMSPORTAL_URL:-}
      # P8b G-E9-4 (mimari-e9 §13.4): asgari Windows istemci sürümü (x.y.z). Boş = kontrol yok; düşük sürüm 426
      # CLIENT_OUTDATED. Güvenlik yamasında yamalı sürüme yükseltilir (runbook §12).
      MIN_AGENT_VERSION:
      # P10 (mimari §3.2/§8.1): *_enc alanlarının AES-256-GCM anahtarları `v1:<base64 32B>[,v2:...]`. production'da
      # zorunlu (env.ts); kaybolursa kayıtlı SMTP şifreleri ve TOTP sırları çözülemez (runbook §3, §14).
      APP_ENCRYPTION_KEYS: ${APP_ENCRYPTION_KEYS:?APP_ENCRYPTION_KEYS gerekli (openssl rand -base64 32 → v1:<deger>)}
      # P12 (AC-81..84): logo/avatar yükleme kökü; dosyalar {tenantId|system}/{rastgele}.{png|jpg|webp}. Server
      # `GET /api/v1/files/{logo,system-logo,avatar}/...` uçlarıyla sunar (Caddy statik sunmaz, volume Caddy'ye bağlanmaz).
      UPLOADS_DIR: /data/uploads
      # P16 (AC-240, mimari-e11 §7.2): gece kalıcı silme modu `dry|on` (boş = dry: yalnız sayar, silmez). Staging'de önce dry
      # çıktısı (retention.run audit purgeCandidates.*) incelenir, sonra on (runbook §23.1).
      RETENTION_PURGE_MODE: ${RETENTION_PURGE_MODE:-}
      # P27 (mimari-p27 §4.5 r2, §8.1; AC-297/342): dağıtım ortamı + gözetimsiz erişim imza kapısı. DEPLOY_ENV yalnız server'a
      # verilir (web/migrate/seed almaz); boşsa compose durur. UNATTENDED_MODE boş = off; `unsigned` yalnız staging (env.ts
      # açılış hatası). Prod: off (SignPath gelene kadar), staging: unsigned (runbook §27).
      DEPLOY_ENV: ${DEPLOY_ENV:?DEPLOY_ENV gerekli (production | staging | development; runbook §3)}
      UNATTENDED_MODE: ${UNATTENDED_MODE:-}
      UNATTENDED_SIGNED_SHA256: ${UNATTENDED_SIGNED_SHA256:-}
      # Servis ikilisi (GET /unattended/download, oturumlu + `manage`). Ayrı volume, YALNIZ server salt okunur bağlar: Caddy
      # görmez, /downloads/* public yoluna konmaz. SHA'yı deploy/agent/publish-servis.sh yazar; boş/uyuşmaz → 503.
      UNATTENDED_AGENT_PATH: /data/unattended/NoktaDestekServis.exe
      UNATTENDED_AGENT_SHA256: ${UNATTENDED_AGENT_SHA256:-}
      # P28b (mimari-p28b §11.3, ADR-0032): sunucuda saklanan dosyalar (AES-256-GCM, {tenantId}/{rastgele}.rsf). Ayrı volume
      # stored_files (uploads'tan ayrı: yetim taraması karışmaz); YEDEĞE GİRMEZ (K-P28b-11; backup.sh yalnız `uploads` etiketli
      # volume'u alır). Yol sabit.
      FILES_DIR: /data/files
      # ClamAV (clamd) — Super Admin panel kaydı yoksa kullanılır. Hedefin TÜM çözülen adresleri CLAMAV_ALLOWED_CIDR içinde
      # olmalı (O-P28b-1, K-P28b-16); değer `av` ağının sabit alt ağıyla AYNI kaynaktan gelir. Boş CIDR = sunucu modu çalışmaz.
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_ALLOWED_CIDR: ${AV_SUBNET:-172.30.2.0/28}
    volumes:
      - agent_downloads:/data/downloads:ro
      - unattended_downloads:/data/unattended:ro
      # Kök fs salt okunur; yazılabilir kalıcı tek dizin. İzin imajdan gelir (node:node 0700, apps/server/Dockerfile).
      - uploads:/data/uploads
      # P16 (ADR-0030 m.9): imha defteri /var/lib/remote/erasure-ledger.jsonl (yalnız eklenen, 0600). Env yok, yol sabit.
      # DB dökümüne girmez; backup.sh ayrı dosya olarak yedekler (runbook §23).
      - ledger:/var/lib/remote
      # P28b: saklanan dosyalar (yalnız server; izin imajdan node:node 0700). Caddy/web/yedek görmez.
      - stored_files:/data/files
    # P28b: `av` = clamd'ye giden tek yol. server clamav'a bağlantıyı kendisi açar; clamav'ın server'a istek atması gerekmez
    # (D-r2-1: server av alt ağından gelen HTTP/WS isteğini reddeder — K3). server clamav'a depends_on ile BAĞLANMAZ:
    # profil kapalıyken compose durmasın; /ready clamd'ye bakmaz (K-P28b-14), sunucu modu fail-closed.
    networks: [edge, db, av]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  web:
    <<: *node
    build: { context: .., dockerfile: apps/web/Dockerfile, target: runtime }
    image: remote-web:${IMAGE_TAG:-local}
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL gerekli}
      API_INTERNAL_URL: http://server:3001
      # S-P2-1: Caddy'nin web isteklerine yazdığı X-Edge-Auth sırrı; eşleşmezse web XFF iletmez
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?EDGE_PROXY_SECRET gerekli (openssl rand -base64 32)}
    # Sabit adres: server TRUSTED_PROXY_CIDR (172.30.0.2/31) bu adresi güvenilen proxy sayar (G-11).
    # Port yayımlanmaz; web'e yalnız Caddy ulaşır, XFF'i Caddy yeniden yazar.
    networks:
      edge: { ipv4_address: "${EDGE_WEB_IP:-172.30.0.3}" }
    depends_on:
      server: { condition: service_healthy }

  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?EDGE_PROXY_SECRET gerekli (openssl rand -base64 32)}
    ports:
      # 4450 (tls internal, IP ile tanı girişi). PROD: CADDY_BIND=127.0.0.1 (mimari-p13 §7.2/7.9) -> yalnız sunucudan
      # tanı amaçlı erişilir; Docker yayımladığı portta UFW'yi atlar, kapatan kontrol UFW değil bu değerdir (G-P13b-9;
      # kanıt: ss -tlnp | grep 4450 yalnız 127.0.0.1). Boşsa 0.0.0.0 (yalnız staging/yerel geçmiş davranışı).
      # P13c: host portu CADDY_TLS_PORT (prod 4450, staging 4460); konteyner içi port 4450 sabit (Caddyfile değişmez).
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_TLS_PORT:-4450}:4450/tcp"
      # Host nginx (TLS, remote.noktabilisim.net) -> düz HTTP; YALNIZ loopback (ADR-0015). Caddy bu dinleyicide
      # yalnız edge ağ geçidinden (172.30.0.128, userland-proxy) gelen XFF'e güvenir. 0.0.0.0'a AÇILMAZ.
      # P13c: host portu CADDY_HTTP_PORT (prod 4451, staging 4461; nginx vhost proxy_pass ve proxy-guard bu portu kullanır).
      - "127.0.0.1:${CADDY_HTTP_PORT:-4451}:4451/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # P6: /downloads/{NoktaDestek,Destek-<kod>}.exe → tek jenerik ikili (Caddyfile @agentExe)
      - agent_downloads:/srv/downloads:ro
    # Caddy'ye özgü staging değerleri (CADDY_TRUSTED_PROXIES, ROBOTS_NOINDEX) burada DEĞİL docker-compose.staging.yml'de:
    # buraya eklenen her anahtar prod `config` çıktısını değiştirirdi (P13c kabul ölçütü: fark 0).
    networks:
      edge: { ipv4_address: "${EDGE_CADDY_IP:-172.30.0.2}" }
    depends_on:
      server: { condition: service_healthy }
      web: { condition: service_healthy }
    logging: *logging

  # P28b (mimari-p28b §7.1 r2, ADR-0032, Y-P28b-1): ClamAV iki servis, AYNI imaj + digest (GPL-2.0, ayrı süreç; kodumuz
  # bağlanmaz, yalnız TCP). Düşmanca dosyayı ayrıştıran clamd internete çıkamaz ve imza DB'sini yazamaz; DB'yi yalnız
  # freshclam yazar ve o da clamd'ye/server'a ulaşamaz. İmajın /init'i KULLANILMAZ (ro DB'de `chown -R` ile çıkar).
  # Profil: ana dosyada profil YOK (tek yığın/prod her zaman açık); ikinci yığın (remote-stg) staging katmanı `profiles: [av]`
  # ekler -> varsayılan kapalı, test sırasında COMPOSE_PROFILES=av ile açılır (K-P28b-18, D-r2-4; runbook §28b).
  clamav:
    image: clamav/clamav:1.5.4@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
    entrypoint: ["clamd", "--foreground", "--config-file=/etc/clamav/clamd.conf"]
    restart: unless-stopped
    user: "100:101"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      # INSTREAM + arşiv açılımı düz metni; tmpfs sayfaları mem_limit'e sayılır (O-P28b-3). Boyut değişmezi: mimari §7.1.
      - /scratch:size=1536m,uid=100,gid=101,mode=0700
      - /run/clamav:size=1m,uid=100,gid=101,mode=0700
      - /tmp:size=16m,uid=100,gid=101,mode=0700
    # D-r2-4: memswap_limit = mem_limit -> kapsayıcı swap KULLANAMAZ (tmpfs düz metni diske düşmez, R-P28b-8).
    mem_limit: 3g
    memswap_limit: 3g
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav_db:/var/lib/clamav:ro
    # YALNIZ `av` (internal). Port YAYIMLANMAZ (AC-353 port taraması: host 3310 kapalı).
    networks: [av]
    # İmajın HEALTHCHECK'i (clamdcheck.sh: PING -> localhost:3310, start_period 360 sn) aynen kullanılır.
    depends_on:
      # Volume ilk kez rw serviste bağlanır -> imajdaki DB volume'a kopyalanır; clamd DB'siz açılmaz.
      # K9 B2: clamav-update sağlıklı = ilk freshclam turu bitti -> clamd güncel daily'yi yükler (yükleme sırasında DB değişip
      # SelfCheck'in yeniyi "OK" sayması yarışı kapanır). Yalnız `compose up` uygular; host yeniden açılışı: runbook §28b.3.
      clamav-update: { condition: service_healthy }
    logging: *logging

  clamav-update:
    image: clamav/clamav:1.5.4@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
    # K9 B2 (ilk açılış yarışı): önce TEK SEFERLİK güncelleme, sonra işaret (/tmp tmpfs -> her başlangıçta sıfır), sonra daemon.
    # Sağlık = işaret + DB dosyaları -> clamav (depends_on service_healthy) imajdaki eski daily'yi değil güncel DB'yi yükler.
    # `;` bilinçli: CDN/çıkış hatasında da clamd eski DB ile açılır (fail-closed değil, imza yaşı alarmı yakalar); `timeout` asılmayı keser.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        timeout 300 freshclam --stdout --config-file=/etc/clamav/freshclam.conf;
        touch /tmp/first-update.done;
        exec freshclam --daemon --foreground --stdout --checks=6 --config-file=/etc/clamav/freshclam.conf
    restart: unless-stopped
    user: "100:101"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,uid=100,gid=101,mode=0700
      - /var/log/clamav:size=1m,uid=100,gid=101,mode=0700
    # TestDatabases yes: yeni DB yayına alınmadan belleğe yüklenip sınanır.
    mem_limit: 1536m
    memswap_limit: 1536m
    volumes:
      - ./clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
      - clamav_db:/var/lib/clamav
    # YALNIZ av_egress (database.clamav.net). `av`'de DEĞİL: clamd'ye ve server'a yolu yok.
    networks: [av_egress]
    healthcheck:
      # İmajın healthcheck'i 3310'a bakar (bu konteynerde clamd yok) -> ezilir: ilk güncelleme denendi mi + DB dosyaları var mı.
      # start_period > tek seferlik `timeout 300`: ilk güncelleme sürerken unhealthy sayılmaz (`up -d` "dependency failed" demez).
      test: ["CMD-SHELL", "test -f /tmp/first-update.done && ls /var/lib/clamav/main.c?d /var/lib/clamav/daily.c?d >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 330s
    logging: *logging

networks:
  # edge: YALNIZ caddy, web, server. Bu ağa yeni servis EKLENMEZ (S-P2-1: server web'i güvenilen proxy
  # sayar; edge'deki her konteyner web:3000/server:3001'e doğrudan ulaşır). Yeni servis -> ayrı ağ.
  edge:
    ipam:
      # Dinamik adresler .128/25'ten dağıtılır; sabit adresler (caddy .2, web .3) ile çakışmaz.
      # P13c: staging 172.30.1.0/24 + 172.30.1.128/25 (iki yığının alt ağı çakışırsa Docker ağı oluşturmaz).
      config: [{ subnet: "${EDGE_SUBNET:-172.30.0.0/24}", ip_range: "${EDGE_IP_RANGE:-172.30.0.128/25}" }]
  db:
    internal: true
  # P28b av: YALNIZ server + clamav. Bu ağa servis EKLENMEZ (O-P28b-1: server bu alt ağı ClamAV hedefinin tek izinli aralığı
  # sayar; ağdaki her konteyner izinli hedef olur). internal -> dışa çıkış yok. Alt ağ sabit ve server CLAMAV_ALLOWED_CIDR ile
  # aynı değişkenden: prod 172.30.2.0/28, ikinci yığın (staging) AV_SUBNET=172.30.3.0/28 (iki yığının alt ağı çakışmaz).
  av:
    internal: true
    ipam:
      config: [{ subnet: "${AV_SUBNET:-172.30.2.0/28}" }]
  # P28b av_egress: YALNIZ clamav-update (freshclam -> database.clamav.net). Bu ağa servis EKLENMEZ.
  av_egress:

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  # P6: Windows istemcisi (NoktaDestek.exe); yalnız verify-and-publish yazar, server ve caddy salt okunur bağlar.
  agent_downloads:
  # P27: gözetimsiz erişim servis ikilisi (NoktaDestekServis.exe); yalnız publish-servis.sh yazar, yalnız server salt okur.
  unattended_downloads:
  # P12: logo/avatar dosyaları (yalnız server yazar/okur). Yedek: runbook §16.3 (DB dökümüyle aynı anda alınır).
  uploads:
  # P16: imha defteri (server yazar, migrate salt okur). SİLİNMEZ: restore sonrası silmeleri yeniden oynatmanın kaynağı.
  ledger:
  # P28b: sunucuda saklanan şifreli dosyalar (yalnız server). YEDEKLENMEZ (K-P28b-11): ≤ 7 gün ömürlü kişisel veri; dönüşte
  # dosyasız CLEAN satırları ilk 03:30 mutabakatında EXPIRED olur. Silinebilir değil ama kaybı veri kaybı sayılmaz.
  stored_files:
  # P28b: ClamAV imza DB'si (clamav-update yazar, clamav salt okur). Yedeklenmez; boş volume'a imajdaki DB kopyalanır.
  clamav_db:
