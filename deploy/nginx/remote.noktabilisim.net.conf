# Remote Support — host nginx vhost'u (ADR-0015, runbook §8.3). Sunucuda:
#   /etc/nginx/sites-available/remote.noktabilisim.net  (+ sites-enabled sembolik linki)
# nginx 443'te Let's Encrypt (certbot --webroot) ile TLS sonlandırır, Caddy'nin yalnız loopback'e yayımlanan düz
# HTTP dinleyicisine (127.0.0.1:4451) iletir. Yönlendirme, ops uçlarının kapatılması, istek gövdesi sınırları, log
# filtresi ve güvenlik başlıkları (CSP, HSTS, nosniff, Referrer-Policy) Caddy + uygulamada; burada ÇİFTLENMEZ.
# Bu dosya yalnız bu siteye ait adları tanımlar (remote_ önekli map/log_format); diğer vhost'ları etkilemez.

# G-10: erişim logunda sorgu dizesi, oturum token'ı (/session/<token>), indirme kodu (/downloads/Destek-<kod>.exe),
# firma dosyası ref'i (/downloads/NoktaDestek-<label>-<ref>.exe, G-E9-8), çerez, Authorization, Referer ve
# Sec-WebSocket-Protocol yazılmaz. $uri sorgu dizesi içermez; üç map yoldaki gizli parçayı Caddy filtresiyle aynı
# biçimde maskeler. Doğrulama: deploy/nginx/test-nginx.sh (CI).
map $uri $remote_log_uri_s {
    "~^(?<remote_m1>.*/session/)[^/]+(?<remote_m2>.*)$" "${remote_m1}***${remote_m2}";
    default $uri;
}
map $remote_log_uri_s $remote_log_uri_d {
    "~^(?<remote_m3>.*/downloads/Destek-)[^/]+(?<remote_m4>.*)$" "${remote_m3}***${remote_m4}";
    default $remote_log_uri_s;
}
# G-E9-8 (P8b): firma dosyası /downloads/NoktaDestek-<label>-<ref>.exe. İlk "NoktaDestek-"ten sonrası tümüyle silinir
# (ref ve firma kısa adı; yol nerede geçerse geçsin). /downloads/NoktaDestek.exe (kodsuz ad) maskelenmez.
map $remote_log_uri_d $remote_log_uri {
    "~^(?<remote_m5>.*?)NoktaDestek-" "${remote_m5}NoktaDestek-***";
    default $remote_log_uri_d;
}
log_format remote_masked escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$remote_log_uri","proto":"$server_protocol","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status","ua":"$http_user_agent"}';

# WebSocket: Upgrade varsa "upgrade", yoksa keep-alive için boş Connection.
map $http_upgrade $remote_connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name remote.noktabilisim.net;
    server_tokens off;
    access_log /var/log/nginx/remote.access.log remote_masked;
    # Hata logu istek satırını (sorgu dizesi dahil) yazar -> yalnız crit (G-10). 502/504 teşhisi: erişim logu
    # (status/upstream_status) + `docker compose logs caddy`.
    error_log /var/log/nginx/remote.error.log crit;

    # ACME HTTP-01 (certbot --webroot); yalnız bu siteye ait dizin.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/remote-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name remote.noktabilisim.net;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/remote.noktabilisim.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.noktabilisim.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/remote.access.log remote_masked;
    error_log /var/log/nginx/remote.error.log crit;

    # Caddy aynı içeriği sıkıştırmıyor; nginx de sıkıştırmaz (BREACH; davranış 4450 ile aynı kalır).
    gzip off;
    # Uygulamanın en büyük gövdesi P12 logo/avatar yüklemesi: Caddy `@upload` 3 MiB (2 MB dosya + multipart zarfı);
    # diğer /api 2MB, web 1MB sınırını Caddy uygular. Burası en büyük Caddy tavanıyla aynı (3m = 3 MiB); fazlası 413.
    client_max_body_size 3m;
    client_body_timeout 30s;
    client_header_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:4451;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # G-11: istemcinin gönderdiği XFF/X-Real-IP YOK SAYILIR, gerçek bağlantı adresiyle yeniden yazılır
        # ($proxy_add_x_forwarded_for DEĞİL). Caddy 4451 yalnız ağ geçidinden gelen bu değere güvenir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";

        # WebSocket (/ws/*): uzun ömürlü bağlantı; server 30 sn'de bir ping atar, yine de üst sınır 1 saat+.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $remote_connection_upgrade;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_connect_timeout 5s;

        # İndirme (exe) diske tamponlanmasın; akış olarak iletilir.
        proxy_buffering off;
        proxy_request_buffering on;
    }
}
