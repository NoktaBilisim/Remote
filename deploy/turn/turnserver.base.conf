# coturn sabit yapılandırma (repo; ADR-0007 r3, mimari §8.3.1, G-05). Ortama özgü değerler
# (realm, secret, external-ip, bant genişliği, sertifika) entrypoint.sh tarafından env'den eklenir;
# altyapı IP'leri denied-peer-ip.local.conf'tadır (git-ignore). Gizli bilgi bu dosyaya YAZILMAZ.
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49199
fingerprint
use-auth-secret
no-multicast-peers
no-tcp-relay
user-quota=8
total-quota=200
stale-nonce=600
prometheus
prometheus-port=9641
log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
# Varsayılanlar (4.18): CLI kapalı (--cli verilmedikçe; no-cli artık hata), loopback peer yasak (allow-loopback-peers yok), DTLS kapalı, TLS en az 1.2, SOFTWARE özniteliği gönderilmez, RFC5780 alt portları yok.

# --- denied-peer-ip (a): sabit liste. coturn bu sürümde (4.18) CIDR değil `a-b` aralığı alır. ---
# 0.0.0.0/8, 10/8, 100.64/10, 127/8, 169.254/16, 172.16/12, 192.0.0/24, 192.0.2/24, 192.168/16,
# 198.18/15, 198.51.100/24, 203.0.113/24, 224/4, 240/4 (255.255.255.255 dahil)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# ::/128, ::1, ::ffff:0:0/96, 64:ff9b::/96, 100::/64, 2001::/32, 2001:db8::/32, 2002::/16,
# fc00::/7, fe80::/10, ff00::/8
# ::/128 YAZILMAZ: coturn 4.18 tek başına `::` satırını "her adres" sayıyor (1.1.1.1 dahil tüm peer'lar 403
# aldı, 2026-11-11 testi). Belirsiz adres coturn tarafından zaten reddedilir; test-denied.sh `::`'i ayrıca dener.
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:0:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
