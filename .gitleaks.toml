# gitleaks yapılandırması (mimari §5.4, G-18). Varsayılan kurallar + dar istisnalar.
# İstisna eklemek: yalnız sahte test değeri içeren TEK dosya yolu; gerekçe yorumda yazılır.
[extend]
useDefault = true

[allowlist]
description = "Sahte test değerleri"
paths = [
  # Entegrasyon testi sabit parolası (gerçek ortamda geçerli değil)
  # (|/) öneki: git modunda göreli yol, dir modunda /repo/... yolu da eşleşsin (S-P3-5).
  '''(^|/)apps/server/test/helpers/app\.ts$''',
  # Tüm sahte test secret'larının tek kaynağı (TURN secret, metrics token) — S-P3-5
  '''(^|/)apps/server/test/helpers/secrets\.ts$''',
]
